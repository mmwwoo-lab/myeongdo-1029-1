푸른 잎새 사이

천년의 바람이 불어와

오래도록 털어 내지 못한다</div><p class="date">2026년 11월 9일</p><div class="actions"><button id="read">▶ 시 읽기</button><button id="pause">⏸ 일시정지 / 이어 읽기</button><button id="stop">■ 정지</button></div></article></main><footer>© 명도재 이명우 · 창작 서정시</footer><script>let utter=null,paused=false;const synth=window.speechSynthesis;document.getElementById('read').onclick=()=>{if(!synth){alert('이 브라우저는 음성 읽기를 지원하지 않습니다.');return;}synth.cancel();utter=new SpeechSynthesisUtterance(document.querySelector('.verse').textContent);utter.lang='ko-KR';utter.rate=.84;synth.speak(utter);paused=false};document.getElementById('pause').onclick=()=>{if(!synth||!utter)return;if(paused){synth.resume();paused=false}else{synth.pause();paused=true}};document.getElementById('stop').onclick=()=>{if(synth)synth.cancel();utter=null;paused=false};window.addEventListener('pagehide',()=>synth?.cancel());</script></body></html>
