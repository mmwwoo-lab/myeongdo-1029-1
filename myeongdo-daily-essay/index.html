<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9e9e5"><meta name="description" content="명도재 이명우의 오늘의 수필. 하루 한 편씩 쌓아 가는 책장형 수필집과 음성 낭독."><meta property="og:title" content="명도재 이명우의 오늘의 수필 | 빈 의자를 향해 다시 말을 건네다"><meta property="og:description" content="퇴직 후에도 사람에게 건넬 말을 배우는 하루. 2026년 11월 23일 월요일."><title>명도재 이명우의 오늘의 수필</title><style>
:root{color-scheme:light;--ink:#273d39;--green:#397064;--paper:#fffdf6}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Nanum Myeongjo','Noto Serif CJK KR',Batang,serif;background:radial-gradient(circle at 12% 20%,#d9ebdf 0,transparent 27%),radial-gradient(circle at 84% 75%,#d8e5e2 0,transparent 33%),#e8ede5;min-height:100vh}.top{max-width:1100px;margin:auto;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:700;letter-spacing:.08em}.top a{color:var(--green);font:600 14px sans-serif}.intro{text-align:center;padding:5px 18px 22px}.intro h1{font-size:clamp(23px,3vw,34px);margin:8px}.intro p{font:15px/1.65 sans-serif;color:#62756c}.book{position:relative;max-width:860px;margin:0 auto 18px;min-height:520px;background:var(--paper);border:1px solid #c4c8b8;border-radius:5px 15px 15px 5px;box-shadow:17px 19px 0 -9px #d1d8ca,0 25px 55px #45615a33;overflow:hidden}.book:before{content:"";position:absolute;inset:0 auto 0 0;width:18px;background:linear-gradient(90deg,#a3afa0,#e7ebdf,#fff);z-index:2}.page{padding:60px clamp(30px,8vw,95px) 80px;min-height:520px;background:linear-gradient(120deg,#fffef9,#fbfaf1)}.page.cover{background:linear-gradient(150deg,#f8f8ec 10%,#dbe9dc 62%,#b2ccbd);display:flex;flex-direction:column;justify-content:center;text-align:center}.eyebrow{font:700 13px sans-serif;letter-spacing:.13em;color:var(--green)}.page h2{font-size:clamp(25px,3.5vw,39px);line-height:1.38;word-break:keep-all;margin:23px 0 32px}.page p{font-size:clamp(17px,2.1vw,21px);line-height:2.05;word-break:keep-all;white-space:pre-line}.page a{color:#216055;text-decoration:underline}.page small{font-size:15px}.foot{position:absolute;bottom:21px;right:34px;font:14px sans-serif;color:#718078}.controls{max-width:860px;margin:20px auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 10px}.controls button{border:1px solid #8eaca0;background:#fffefa;border-radius:24px;padding:11px 16px;color:#244a41;font:600 15px sans-serif;cursor:pointer;min-height:44px}.controls button:disabled{opacity:.4;cursor:default}.controls button:hover:not(:disabled){background:#e2f0e7}.status{text-align:center;color:#526961;font:14px sans-serif;margin:12px}.note{max-width:860px;margin:20px auto 60px;padding:0 20px;color:#5f7167;font:14px/1.8 sans-serif}button:focus-visible,a:focus-visible{outline:3px solid #227661;outline-offset:3px}@media(max-width:600px){.book{margin:0 12px;min-height:65vh}.page{min-height:65vh;padding:39px 35px 72px}.controls{justify-content:center}.top{padding:15px}.page p{font-size:17px;line-height:1.9}}@media(prefers-reduced-motion:no-preference){.page{animation:open .23s ease-out}@keyframes open{from{opacity:.55;transform:translateX(9px)}to{opacity:1;transform:translateX(0)}}}
</style></head><body><header class="top"><div class="brand">明道齋 · 오늘의 수필</div><a href="../essay-book/">생활수필 제1권</a></header><section class="intro"><h1>명도재 이명우의 오늘의 수필</h1><p>2026년 11월 23일 월요일 · 한 편씩 채우는 50쪽 책자</p></section><main><div class="book" id="book" aria-live="polite"><article id="page" class="page"></article></div><div class="status" id="status"></div><nav class="controls" aria-label="책장과 낭독"><button id="prev">이전 장</button><button id="toc">목차</button><button id="speak">▶ 듣기</button><button id="pause">Ⅱ 일시정지</button><button id="stop">■ 정지</button><button id="next">다음 장</button></nav><p class="note">50쪽을 목표로 연재 중입니다. 현재는 첫 수필과 편집 기록을 수록했습니다. 낭독은 기기의 한국어 음성 지원 상태에 따라 다르게 들릴 수 있습니다.</p></main><script>
const pages=[{"eyebrow":"명도재 이명우의 오늘의 수필","title":"빈 의자를 향해\u003cbr>다시 말을 건네다","body":"2026년 11월 23일 월요일\u003cbr>\u003cbr>명도재 이명우 지음\u003cbr>\u003csmall>세상을 읽고, 다시 삶을 쓰다\u003c/small>","cover":true},{"eyebrow":"머리말","title":"한 편씩 채우는\u003cbr>50쪽 수필집","body":"오늘의 수필을 날짜별로 기록합니다. 이 책에는 현재 2026년 11월 23일 첫 편만 실려 있습니다. 글을 확인할 수 있는 친구들의 최근 글은 출처와 날짜를 검증한 뒤 수록합니다.\u003cbr>\u003cbr>목차\u003cbr>01 빈 의자를 향해 다시 말을 건네다\u003cbr>02 자료와 편집 기록"},{"eyebrow":"오늘의 수필 · 1","title":"빈 의자를 향해 다시 말을 건네다","body":"퇴직하고 나면 하루가 갑자기 길어진다고 한다. 삼십육 년 동안 종소리에 맞추어 움직이던 사람에게는 오전 열 시도 낯설다. 수업 준비를 하던 시간에 책상 앞에 앉아 글을 쓰려니, 오래 쓰던 이름표가 사라진 듯하다. 그러나 의자가 비었다고 사람이 빈 것은 아니다. 내가 건네던 말의 방향이 달라졌을 뿐이다."},{"eyebrow":"오늘의 수필 · 2","title":"다시 여는 교실","body":"고산골을 걸을 때면 떨어진 잎을 한 번 더 본다. 나무에 달려 있을 때만 아름다운 줄 알았던 단풍은 땅에 누워서도 길을 밝힌다. 한때 교실에서 학생을 기다렸던 내가 이제는 문학관의 빈 화면을 연다. 어느 쪽이 더 중요한 자리인지 따질 필요가 없다. 사람을 기다리는 마음이 남아 있다면, 그곳이 새로운 교실이다."},{"eyebrow":"오늘의 수필 · 3","title":"두 번째 장","body":"인생 이모작이라는 말은 첫 생을 실패로 만들지 않는다. 미술교사로서 아이들의 그림을 오래 보아 온 눈은 시화를 고를 때도 일한다. 상담의 경험은 친구의 말에서 미처 말하지 않은 외로움을 헤아리게 하고, 컴퓨터를 가르친 손은 어린이 학습 앱의 버튼을 다시 눌러 본다. 퇴직 뒤의 창작은 앞선 삶의 열매를 다른 사람의 손에 건네는 일이다."},{"eyebrow":"오늘의 수필 · 4","title":"안부의 자리","body":"그렇다고 소외가 쉽게 지워지는 것은 아니다. 하루 종일 알림이 울려도 정작 “오늘 어떠셨어요?”라고 묻는 사람은 드물 수 있다. 누구나 어느 날은 단체 대화창의 숫자만 바라본다. 그럴 때 나는 한 사람의 글을 천천히 읽고, 짧더라도 구체적인 안부를 남기고 싶다. 대단한 충고보다 “그 장면이 오래 마음에 남습니다”라는 한마디가 누군가의 하루를 붙든다."},{"eyebrow":"오늘의 수필 · 5","title":"귀 기울이는 시간","body":"종교가 달라도 이웃을 돌보고 자기 마음을 살피라는 가르침은 삶에서 만날 수 있다. 그 말이 내게 요구하는 것은 남을 쉽게 판단하지 않는 태도다. 믿음의 이름으로 다른 이의 쓸쓸함을 재단하기보다, 함께 앉아 잠시 들어 주는 일. 나는 그것이 일상의 작은 수행이라고 생각한다. 특정 종교인의 최근 글을 확인하지 못했으므로 여기에는 경전이나 인물의 말을 인용하지 않았다."},{"eyebrow":"오늘의 수필 · 6","title":"AI와 배움","body":"신종우 교수는 9월 교육 칼럼에서 AI가 답을 빠르게 내놓을수록 학생의 질문과 근거, 판단을 살리는 수업이 필요하다고 썼다. 나는 그 생각을 오래된 교실의 경험과 나란히 놓아 본다. 내가 중학생용 시 창작 앱을 만들 때도 완성된 시를 건네는 버튼보다, 아이가 고산골의 바람을 자기 말로 먼저 적게 하는 질문이 소중하다. 11월 10일 발표된 AI 교육 자료 역시 도구 사용에 비해 활용 지도가 부족하다고 전한다. 두 자료를 읽으며 나는 새 기술 앞에서 교사의 몫이란 아이가 스스로 생각하도록 곁에 있는 일이라고 생각했다."},{"eyebrow":"오늘의 수필 · 7","title":"정확하게 인용하기","body":"오늘 페이스북 친구 세 분의 글을 소개하려 했지만, 공개 검색으로는 해당 글의 원문·날짜·작성자를 함께 확인하지 못했다. 이름을 빌려 그럴듯한 문장을 꾸며 쓰는 일은 하지 않겠다. 내일은 확인 가능한 친구의 글을 만나면 정확히 출처를 적고, 그 글과 내 삶이 닿는 곳을 이어 쓰겠다."},{"eyebrow":"오늘의 수필 · 창작의 눈","title":"지나친 것을 다시 보는 일","body":"고양신문에 실린 강종래 화가의 인터뷰를 읽었다. 그는 여수의 바닷가와 갯벌의 돌, 갈매기처럼 지나치기 쉬운 대상을 다시 보며 작업한다고 했다. 나도 고산골의 잎 하나를 오래 바라보다 시의 첫 줄을 찾는다. 오래 그림을 그려 온 화가의 시선은 퇴직 뒤에도 관찰하는 사람으로 살 수 있다는 격려처럼 다가온다. 이것은 최근 페이스북 글의 인용이 아니라, 2023년 공개 인터뷰를 읽고 적은 내 생각이다."},{"eyebrow":"오늘의 수필 · 8","title":"여백에서 시작하기","body":"빈 의자 앞에 오늘도 앉는다. 손주가 자라서 언젠가 “할아버지는 퇴직하고 무엇을 하셨어요?” 하고 물으면 이렇게 말할 것이다. 사람을 가르치는 일을 마친 뒤에도, 사람에게 건넬 말을 배우고 있었다고. 삶의 두 번째 장은 새 책이 아니다. 오래 읽은 책에서 처음 발견한 여백이다."},{"eyebrow":"자료와 편집 기록","title":"글의 바탕","body":"강종래 화가 인터뷰: 정미경, 「여전히 뜨겁게 샘솟는 70대 화가의 창작 열정」(고양신문, 2023.10.26).\u003cbr>\u003ca href='https://www.mygoyang.com/news/articleView.html?idxno=75884' target='_blank' rel='noopener'>인터뷰 원문\u003c/a>\u003cbr>\u003cbr>AI 교육 자료: 신종우, 「AGI 시대, 교과서는 그대로라도 수업은 달라져야 합니다」(2026.9.10).\u003cbr>\u003ca href='https://edu-week.com/news/view.asp?idx=23556&amp;msection=6&amp;page=1&amp;ssection=14' target='_blank' rel='noopener'>신종우 교수 칼럼\u003c/a>\u003cbr>\u003cbr>OpenAI, 「교육 현장의 AI 활용 지도 공백 해소」(2026.11.10).\u003cbr>\u003ca href='https://openai.com/ko-KR/index/closing-ai-guidance-gap-education/' target='_blank' rel='noopener'>AI 교육 자료 원문\u003c/a>\u003cbr>\u003cbr>추천 페이스북 친구 최근 글 3건은 공개 원문과 게시일을 확인하지 못해 인용하지 않았습니다. 종교인의 발언과 교리 문구도 확인되지 않아 인용하지 않았습니다.\u003cbr>\u003cbr>\u003ca href='2026-11-23.md'>오늘의 원고 보기\u003c/a>"}]; let current=0,utterance=null;const q=id=>document.getElementById(id),syn=window.speechSynthesis;
function stop(){if(syn)syn.cancel();utterance=null}
function render(){stop();const p=pages[current];const article=q("page");article.className="page"+(p.cover?" cover":"");article.innerHTML='<div class="eyebrow">'+p.eyebrow+'</div><h2>'+p.title+'</h2><p>'+p.body+'</p><div class="foot">'+(current+1)+' / '+pages.length+'쪽 · 50쪽 목표</div>';q("status").textContent=(current+1)+" / "+pages.length+"쪽";q("prev").disabled=current===0;q("next").disabled=current===pages.length-1;history.replaceState(null,"","#page-"+(current+1))}
function go(n){current=Math.max(0,Math.min(pages.length-1,n));render();q("book").scrollIntoView({behavior:"smooth",block:"nearest"})}
q("prev").onclick=()=>go(current-1);q("next").onclick=()=>go(current+1);q("toc").onclick=()=>go(1);
q("speak").onclick=()=>{if(!syn){alert("이 브라우저에서 음성 읽기를 지원하지 않습니다.");return}if(syn.paused&&utterance){syn.resume();return}stop();utterance=new SpeechSynthesisUtterance(q("page").innerText);utterance.lang="ko-KR";utterance.rate=.9;syn.speak(utterance)};
q("pause").onclick=()=>{if(syn&&syn.speaking&&!syn.paused)syn.pause()};
q("stop").onclick=stop;document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(current+1);if(e.key==="ArrowLeft")go(current-1)});let startX=0;q("book").addEventListener("touchstart",e=>startX=e.changedTouches[0].screenX,{passive:true});q("book").addEventListener("touchend",e=>{const d=e.changedTouches[0].screenX-startX;if(Math.abs(d)>65)go(current+(d<0?1:-1))},{passive:true});current=Math.max(0,Math.min(pages.length-1,(Number(location.hash.match(/page-(\d+)/)?.[1])||1)-1));render();
</script></body></html>
