name: Codex editorial and website checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-and-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check essential pages exist
        shell: bash
        run: |
          test -s index.html
          test -s poetry-book/index.html
          test -s essay-book/index.html
      - name: Validate article drafts (data format, not facts)
        run: python scripts/validate_issue.py --dir content/drafts
      - name: Scan primary pages for local resource paths (advisory)
        run: python scripts/check_site.py --root . --paths index.html poetry-book/index.html essay-book/index.html --warn-only
