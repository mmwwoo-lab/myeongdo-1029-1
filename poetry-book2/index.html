<script type="application/json" id="bookData">{"title":"고향 들길에서 고산골까지","subtitle":"명도재 이명우 제2집 · 고향의 기억, 수필의 하루, 소설의 꿈을 잇는 서정시 100편","author":"명도재 이명우","parts":[{"number":1,"title":"소를 몰던 아이와 마을의 불빛","subtitle":"고향 들길·국민학교·1970년대 마을의 변화"},{"number":2,"title":"대명동으로 가는 느린 버스","subtitle":"형제자매·고등학교·미술과 교직으로 이어진 길"},{"number":3,"title":"고산골에 피는 사계절","subtitle":"봉덕동에서 앞산으로 걷는 산책의 시"},{"number":4,"title":"신천과 주리못의 물빛","subtitle":"오리·백로·왜가리와 물가의 기억"},{"number":5,"title":"명도재의 늦지 않은 봄","subtitle":"그림·문학·교육·AI 창작의 새로운 일상"}],"poems":[{"number":1,"title":"소를 몰던 아침","text":"새벽 이슬이 풀끝마다 맺히면\n나는 소고삐를 잡고 들길로 나섰다\n소는 서두를 줄 모르는 걸음으로\n풀 냄새 나는 둑을 따라 걸었다\n학교 가기 전 잠깐 맡은 일이지만\n어린 내 손에는 고삐가 제법 묵직했다\n소가 길가의 풀을 뜯는 동안\n나는 구름의 모양을 세어 보았다\n먼 산 너머로 해가 솟아오르면\n집에서 어머니가 나를 부르셨다\n소는 고개를 들어 나를 바라보고\n나는 그 커다란 눈에 아침을 보았다\n그때 배운 느린 걸음이\n지금도 내 산책길을 따라온다","part":0},{"number":2,"title":"풀 베러 가는 길","text":"책가방을 내려놓기 무섭게\n나는 작은 낫과 풀망태를 챙겼다\n소 먹일 풀을 베는 일은\n어른들 뒤를 따라 배우는 일이었다\n논둑에는 강아지풀이 흔들리고\n고랑에서는 개구리가 뛰어올랐다\n나는 낫을 조심조심 움직이며\n베어 낸 풀을 한 줌씩 모았다\n해가 기울 무렵 망태가 불룩해지면\n등 뒤로 풀 냄새가 따라왔다\n어머니는 수고했다고 웃으셨고\n나는 손바닥의 작은 물집을 숨겼다\n그날 저녁 소가 풀을 씹는 소리가\n우리 집 마당을 오래 채웠다","part":0},{"number":3,"title":"논물에 뜬 하늘","text":"아버지를 따라 논으로 나가면\n어린 발목에 차가운 물이 닿았다\n논에는 하늘이 거꾸로 담겨 있었고\n그 속을 작은 올챙이가 헤엄쳤다\n나는 모를 가지런히 건네드리다가\n자꾸 물속의 구름을 내려다보았다\n아버지는 허리를 펴지 못한 채\n한 줄 한 줄 푸른 모를 심으셨다\n한낮의 햇볕이 등을 뜨겁게 해도\n논둑의 참새는 씩씩하게 울었다\n해 질 무렵 물빛이 붉어지면\n아버지 그림자도 길게 누웠다\n밥 한 그릇의 무게를\n나는 그때 논물에서 배웠다","part":0},{"number":4,"title":"어머니의 보리밥","text":"논일을 마치고 들어오던 저녁\n부엌에서는 밥 짓는 냄새가 났다\n어머니는 큰 그릇에 보리밥을 담고\n고추장과 나물을 곁에 놓으셨다\n나는 먼저 숟가락을 들었다가\n아버지 자리가 비어 있음을 보았다\n마지막 고랑을 살피러 가신 아버지\n어머니는 밥그릇을 덮어 두셨다\n마당에 어둠이 내릴 때쯤\n젖은 발을 씻는 소리가 들려왔다\n그제야 우리 밥상도 둥글어졌다\n말은 적었지만 모두 배가 고팠다\n따뜻한 밥 한 숟갈 속에\n하루의 들판이 함께 들어왔다","part":0},{"number":5,"title":"우물가 여름방학","text":"한낮이면 마을 우물가에\n바가지 부딪히는 소리가 났다\n우리는 물을 길어 오라는 심부름도\n물장난이 될까 싶어 신이 났다\n두레박을 천천히 내려 보내면\n깊은 곳에서 둥근 소리가 올라왔다\n찬물을 손등에 묻혀 보다가\n어른의 눈길을 보고 얼른 일어섰다\n집으로 돌아오는 좁은 길에는\n잠자리가 낮게 날고 있었다\n물동이보다 무거웠던 여름 햇살도\n집 앞 그늘에서는 가벼워졌다\n그때의 찬물 한 모금은\n지금도 목마른 기억을 적신다","part":0},{"number":6,"title":"아버지의 자전거","text":"아버지는 자전거를 잘 타셨다\n들길에서 두 바퀴가 조용히 굴렀다\n그러나 경운기만큼은\n내가 손잡이를 잡아야 움직였다\n어린 날에는 아버지 뒤를 따랐고\n조금 자라서는 내가 앞에 섰다\n쇠바퀴가 흙길을 떨며 지나가면\n아버지는 논두렁 쪽을 살피셨다\n일을 마치고 집으로 돌아올 때\n우리는 말없이 저녁하늘을 보았다\n서로 다른 손으로 잡은 두 기계가\n하나의 집으로 돌아가던 날들\n그 먼지는 오래전에 씻겼어도\n우리의 나란한 길은 남아 있다","part":0},{"number":7,"title":"고무신에 묻은 흙","text":"국민학교에 가려고 신은 고무신에\n어제 논둑에서 묻은 흙이 남아 있었다\n나는 우물가에서 대충 씻고\n아침 종소리를 따라 달렸다\n운동장에 들어서자 친구들이\n먼지를 일으키며 축구를 하고 있었다\n깨끗했던 고무신은 금세 누렇게 되고\n종아리에도 흙이 튀었다\n선생님이 교실로 들어오라 부르면\n우리는 공을 내려놓고 뛰었다\n배우는 글자는 공책에 남았지만\n운동장의 흙냄새는 몸에 남았다\n지금 산책화 밑창을 털 때마다\n그 고무신이 먼저 떠오른다","part":0},{"number":8,"title":"우리 마을 국민학교","text":"우리 마을에는 국민학교가 있었다\n아침이면 마을 아이들이 한길로 모였다\n책가방을 흔들며 교문을 들어서면\n넓은 운동장이 먼저 반겨 주었다\n조회대 뒤로는 낮은 산이 보이고\n교실 창문마다 햇살이 들어왔다\n칠판 앞에서 글자를 익히다가도\n쉬는 종이 울리면 운동장으로 달렸다\n먼지 묻은 무릎은 자랑 같았고\n친구의 이름은 곧 하루의 노래였다\n세상이 아직 작았던 시절\n학교는 마을에서 가장 큰 나라였다\n나는 지금도 그 교문을 생각하면\n어린 발자국 소리를 듣는다","part":0},{"number":9,"title":"일등으로 달리던 날","text":"운동회 아침에 흰 줄이 그어지고\n우리는 출발선 앞에 나란히 섰다\n가슴이 쿵쿵 뛰는 소리가\n응원하는 북소리보다 크게 들렸다\n선생님의 신호가 울리자\n나는 바람을 향해 힘껏 달렸다\n옆 친구의 발소리가 멀어지고\n결승선의 흰 끈이 눈앞으로 다가왔다\n일등이라는 소리가 들린 순간\n나는 먼저 어머니 얼굴을 찾았다\n어머니는 먼 곳에서 손을 흔드셨다\n상품보다 그 웃음이 더 좋았다\n지금은 천천히 산길을 걸어도\n그날의 바람은 내 안에서 달린다","part":0},{"number":10,"title":"만국기 아래 운동회","text":"가을 운동장 위로 만국기가 펄럭였다\n마을 어른들이 교문으로 들어오셨다\n큰 운동장은 하루 종일\n모두의 웃음으로 북적거렸다\n어머니가 싸 오신 도시락을 열면\n밥 위에 달걀 한 조각이 놓여 있었다\n달리기 끝난 친구들도 모여 앉아\n김치와 반찬을 조금씩 나누었다\n멀리서는 청군 백군 함성이 들리고\n하늘의 깃발은 바람을 따라 흔들렸다\n나는 배가 부른 줄도 모르고\n다시 운동장으로 뛰어나갔다\n그날만큼은 마을 전체가\n한 학교의 큰 운동장이었다","part":0},{"number":11,"title":"고무줄놀이 노랫소리","text":"교실 뒤 그늘진 자리에서\n여학생들이 고무줄을 걸었다\n발끝이 일정한 박자로 오르고\n노랫소리가 담장을 넘어왔다\n우리는 옆에서 공을 차다가도\n가끔 그 리듬을 흉내 내 보았다\n서로 노는 자리는 달랐지만\n쉬는 시간은 누구에게나 짧았다\n종소리가 울리면 고무줄은 감기고\n공도 흙바닥에 조용히 멈췄다\n교실로 돌아가는 아이들 뒤로\n한낮의 바람이 오래 따라왔다\n세월이 지나도 그 노래에는\n운동장의 햇살이 묻어 있다","part":0},{"number":12,"title":"축구공이 날던 오후","text":"점심을 먹자마자 운동장으로 달렸다\n낡은 공 하나면 친구들이 모였다\n골대는 나무 두 그루로 대신하고\n심판 없이도 경기는 시작됐다\n공이 논둑 가까이 굴러가면\n가장 어린 친구가 먼저 뛰어갔다\n승부를 놓고 다투는 날도 있었지만\n해 질 무렵이면 다시 한편이 됐다\n땀에 젖은 셔츠를 털고\n먼 산에 걸린 해를 바라보았다\n내일도 그 자리에서 만나자는 말\n굳이 약속할 필요가 없었다\n공은 작았지만 그 안에는\n우리들의 넓은 오후가 있었다","part":0},{"number":13,"title":"마당의 소꿉놀이","text":"낮은 담장 옆 빈터에 모여\n우리는 작은 집을 지었다\n깨진 사기그릇은 밥그릇이 되고\n나뭇잎은 푸른 반찬이 되었다\n누군가는 장에 간다며 떠났다가\n주머니 가득 돌멩이를 들고 왔다\n서로 엄마와 아빠를 맡겠다고\n깔깔 웃으며 자리를 바꿨다\n저녁이 되어 진짜 엄마가 부르면\n흙으로 지은 부엌을 뒤로했다\n다음 날 비가 오면 집은 무너졌지만\n우리는 또 새 집을 지었다\n가진 것이 적어도 마음만은\n언제나 큰 집 한 채였다","part":0},{"number":14,"title":"개울의 징검돌","text":"학교에서 돌아오면 개울로 갔다\n맑은 물밑에는 자갈이 빛났다\n큰 돌만 밟으며 건너 보겠다고\n친구들과 차례로 발을 옮겼다\n발을 헛디뎌 양말이 젖으면\n우리는 서로를 보며 크게 웃었다\n물속에서는 작은 물고기가 달아나고\n버들가지가 흐름을 따라 흔들렸다\n집에 돌아갈 때쯤 해는 낮아지고\n신발 속에서는 찰박 소리가 났다\n어머니에게 혼날까 걱정하면서도\n다음 날 다시 개울로 향했다\n지금 신천 돌다리를 볼 때면\n그 어린 발이 먼저 건너간다","part":0},{"number":15,"title":"낮은 기와지붕의 저녁","text":"해가 지면 마을 집집마다\n부엌에서 저녁 연기가 올랐다\n낮은 기와지붕과 슬레이트 지붕 위로\n하루의 냄새가 천천히 퍼졌다\n우리 집 부엌에서는 어머니가\n솥뚜껑을 열고 밥을 살피셨다\n나는 마당에서 소에게 물을 주고\n형들의 발소리를 기다렸다\n어둠이 내려오면 창마다 불이 켜지고\n골목의 사람 소리도 잦아들었다\n작은 마을이 하루를 접는 시간\n별들이 지붕 위에 하나씩 떴다\n세월이 바꿔 놓은 것은 집 모양이지\n저녁을 기다리는 마음은 아니다","part":0},{"number":16,"title":"가을걷이의 손","text":"벼가 누렇게 익으면 온 식구가 바빴다\n논두렁에는 볏단이 차곡차곡 쌓였다\n나는 가벼운 단부터 옮기며\n어른들 사이에서 일을 배웠다\n손에는 볏짚이 따갑게 닿고\n모자 밑으로 땀이 흘러내렸다\n아버지는 해가 지는 줄도 모르고\n마지막 줄의 벼를 살피셨다\n집으로 돌아와 밥을 먹을 때\n우리는 서로의 손을 바라보았다\n가을은 곡식만 익히는 것이 아니라\n아이의 작은 손도 단단하게 했다\n논바닥에 남은 짚 냄새가\n오늘의 밥상까지 따라온다","part":0},{"number":17,"title":"거울 속의 아버지","text":"동네 이발소에 들어서니\n낡은 의자 하나가 나를 기다렸다\n이발사는 하얀 천을 목에 두르고\n가위로 묵은 시간을 잘라 냈다\n타일 세면대에는 물소리가 고였고\n로션 냄새는 어린 날로 돌아갔다\n머리를 감고 거울 앞에 앉았을 때\n뜻밖에도 아버지의 얼굴이 보였다\n이마의 주름이며 눈가의 웃음까지\n언제 저렇게 닮아 버렸을까\n이발사는 시원하냐고 물었지만\n나는 한동안 대답하지 못했다\n아버지는 먼 곳에 계시는데\n거울 속에서는 나와 함께 늙고 있었다","part":0},{"number":18,"title":"눈길의 책가방","text":"겨울 아침에는 길이 꽁꽁 얼었다\n나는 책가방을 꼭 잡고 학교로 갔다\n논둑에는 눈이 얇게 쌓이고\n멀리 산이 흰 모자를 쓰고 있었다\n친구를 만나면 발자국을 겹쳐 보며\n누가 더 크게 찍는지 겨루었다\n차가운 교실에 들어서면\n손을 비비며 난로 곁에 모였다\n연필 끝이 손에서 미끄러져도\n종이 울리면 받아쓰기를 시작했다\n그날 쓴 글자는 잊어버렸어도\n눈 속에서 웃던 얼굴은 남았다\n겨울바람은 멀리 갔지만\n어린 책가방은 아직 따뜻하다","part":0},{"number":19,"title":"어머니의 호미","text":"어머니는 이른 아침부터 밭에 계셨다\n고랑마다 호미가 작게 반짝였다\n나는 옆에서 뽑은 풀을 모으며\n새로 돋은 싹은 건드리지 않으려 했다\n어머니는 풀과 작물을 구별하는 법을\n한 포기씩 손가락으로 알려 주셨다\n허리를 펴면 멀리 산이 보였고\n다시 숙이면 작은 땅이 보였다\n해 질 무렵 호미를 씻어 두실 때\n어머니 손등에는 흙이 남아 있었다\n그 손으로 저녁상을 차리셨다는 걸\n나는 한참 뒤에야 알았다\n고산골 작은 꽃을 볼 때마다\n그 손끝의 봄을 떠올린다","part":0},{"number":20,"title":"마을에 전깃불이 켜진 날","text":"국민학교 이학년 무렵이었다\n마을에 처음 전깃불이 들어왔다\n누군가 스위치를 올리자\n방안의 얼굴들이 한꺼번에 밝아졌다\n우리는 신기해 불빛을 올려다보고\n어른들은 전선과 전구를 살폈다\n동네 스피커에서는 라디오 소식이\n온 마을을 향해 또렷이 흘러나왔다\n전깃불 아래 숙제를 펼쳐 놓으니\n연필 그림자도 새롭게 보였다\n그날 밤 마당의 별은 그대로인데\n우리 집 저녁만 조금 달라졌다\n작은 전구 하나가 켜지면서\n마을의 내일도 밝아지기 시작했다","part":0},{"number":21,"title":"장식장 속에 들어온 세상","text":"국민학교 오학년 무렵\n우리 집에 텔레비전이 들어왔다\n장식장처럼 문이 달린 그 물건 앞에\n동네 사람들이 하나둘 모여들었다\n저녁마다 드라마 여로가 시작되면\n마루와 방이 사람들로 가득 찼다\n나는 화면보다 방문을 더 바라보며\n누가 또 오시는지 세어 보았다\n친구를 만나러 마을에 나서면\n괜히 어깨가 으쓱해지곤 했다\n작은 흑백 화면이 보여 준 세상은\n우리 마을보다 훨씬 넓었다\n그러나 가장 환한 장면은\n그날 함께 웃던 이웃들의 얼굴이었다","part":1},{"number":22,"title":"이웃 마을에 생긴 중학교","text":"우리 마을에는 국민학교가 있었고\n이웃 마을에는 중학교가 새로 생겼다\n나는 그 학교의 네 번째 졸업 기수로\n익숙한 들길을 오가며 공부했다\n형과 누나들은 일찍 대구로 떠났는데\n나는 새 학교가 생긴 덕에 남았다\n학교를 마치고 돌아오면\n책가방 옆에 농사일이 기다렸다\n도시로 가는 버스가 지나갈 때마다\n나는 잠깐 창문을 올려다보았다\n먼 곳으로 떠나지 못한 서운함도\n들길의 바람 속에서 자라났다\n작은 학교의 종소리가\n먼 훗날 내 교실로 이어질 줄은 몰랐다","part":1},{"number":23,"title":"누나가 떠나던 아침","text":"바로 위 누나도 중학교에 입학했다\n그러나 얼마 지나지 않아 대구로 갔다\n도시에 사는 형들에게 밥을 해 주라는\n어른들의 말이 전학의 이유가 되었다\n누나는 책을 품고 떠나는 학생이면서\n누군가의 식사를 맡은 사람이었다\n그때는 이상하다고 크게 말하지 못했지만\n세월이 흐를수록 마음이 무거워졌다\n누나에게도 이루고 싶은 꿈이 있었을 텐데\n나는 그 뒷모습을 오래 기억한다\n여자라는 이유로 더 져야 했던 짐\n이제는 그 무게를 분명히 안다\n그날 버스는 누나를 데려갔지만\n미안한 마음은 집에 남았다","part":1},{"number":24,"title":"형제들의 대학 가는 길","text":"형과 누나들은 국민학교를 마치고\n하나둘 대구로 공부하러 떠났다\n농사짓는 부모님께 대학 등록금은\n가을볕보다 무거운 짐이었을 것이다\n그래도 부모님은 자식마다\n배울 길을 놓치지 않게 하셨다\n누군가는 먼저 일터에 나갔고\n누군가는 동생의 학비를 도왔다\n나는 그 마음을 모두 모르고\n그저 새 교과서를 펼쳐 보았다\n돌아보면 우리 집의 가장 큰 농사는\n논이 아니라 아이들의 내일이었다\n부모님의 굳은 손바닥에서\n형제자매의 길이 자라났다","part":1},{"number":25,"title":"대구고등학교 첫날","text":"연합고사를 치르고 대구고에 들어갔다\n교문은 고향 학교보다 훨씬 커 보였다\n처음 부모님 곁을 떠나 살게 된 날\n책가방보다 마음이 더 무거웠다\n대명동 길에는 낯선 버스가 오갔고\n모르는 사람들의 발걸음도 빨랐다\n나는 교복 깃을 다시 여미며\n교실로 향하는 계단을 올랐다\n창밖에는 고향의 논 대신\n줄지어 선 집과 전깃줄이 보였다\n도시의 하루는 빠르게 흘렀지만\n밤이면 부모님 얼굴이 떠올랐다\n그리움도 공부처럼 하나씩 익혀야 하는\n열여섯 무렵의 첫 도시였다","part":1},{"number":26,"title":"명덕시장의 선짓국","text":"고등학생이던 새벽\n나는 냄비를 들고 명덕시장으로 갔다\n뜨거운 선짓국을 받아 오면\n겨울 공기 사이로 김이 솟았다\n집에는 둘째 형과 누나와 내가 있었고\n아침밥을 먹어야 학교에 갈 수 있었다\n냄비 손잡이가 뜨거워 손을 바꾸면\n시장 골목의 불빛도 흔들렸다\n서둘러 돌아오는 길에\n내 그림자가 골목을 길게 걸었다\n큰 말 없이 차린 아침상이었지만\n세 사람의 하루를 움직이는 힘이었다\n지금도 시장의 국 냄새를 맡으면\n어린 내가 냄비를 다시 든다","part":1},{"number":27,"title":"만두 다섯 개의 비밀","text":"학교를 마치고 명덕시장을 지나면\n김이 나는 만두 찜통이 보였다\n용돈을 받는 날에는 한 통을 사서\n돌아오는 길에 두 개를 먹었다\n남은 세 개는 형과 누나와 나\n셋이서 나누어 먹을 몫이었다\n그런데 생각해 보니\n나는 늘 세 개를 먹는 셈이었다\n형과 누나는 그걸 알고도 웃었을까\n뜨거운 만두를 입안에서 굴리며\n집으로 돌아오던 저녁이 그립다\n요즘 가창에서 만두를 사는 날이면\n찜통의 김 사이로 그 골목이 보인다\n오래된 맛은 사람을 데리고 온다","part":1},{"number":28,"title":"국신여객을 기다리며","text":"주말이면 국신여객 시골버스를 탔다\n정류장에서는 한참을 기다려야 했다\n먼지 나는 길을 돌아 버스가 오면\n사람들은 보따리를 안고 올라탔다\n지금은 금세 닿는 고향집까지\n그때는 두 시간이 훌쩍 지나곤 했다\n창밖의 논과 산을 바라보다\n졸음이 오면 창틀에 머리를 기댔다\n드디어 고향 정류장에 내리면\n익숙한 흙냄새가 먼저 달려왔다\n멀리서 부모님이 보이지 않아도\n우리 집으로 가는 길은 알았다\n느린 버스가 데려다준 것은\n거리보다 더 깊은 그리움이었다","part":1},{"number":29,"title":"주말이면 큰일꾼","text":"고향집에 가면 부모님이 반기셨다\n그러나 쉬기 전에 할 일이 많았다\n어느새 자란 고등학생 아들은\n농사일에도 필요한 손이 되었다\n논의 물길을 살피고 밭을 고르며\n경운기에 기름을 채워 넣었다\n아버지는 자전거를 타셨지만\n경운기는 내가 몰아야 움직였다\n농약을 칠 때는 더욱 조심했고\n해가 질 때까지 일은 이어졌다\n피곤한 몸으로 대구에 돌아와도\n다음 주말이면 다시 집을 찾았다\n일꾼으로 가는 길이면서도\n막내아들이 돌아가는 길이었다","part":1},{"number":30,"title":"경운기 손잡이","text":"경운기 시동이 한 번에 걸리지 않으면\n나는 손잡이를 잡고 다시 힘을 주었다\n커다란 소리가 들판에 울리면\n아버지는 논 쪽으로 걸어가셨다\n밭을 갈고 물길을 내는 날에는\n나의 주말이 하루 종일 바빴다\n철바퀴 아래 흙이 뒤집힐 때마다\n봄의 냄새가 진하게 올라왔다\n농사 기계는 내 손을 기다렸지만\n나는 도시의 교과서도 놓지 않았다\n들판과 교실 사이를 오가며\n두 가지 길을 함께 배웠다\n지금도 엔진 소리를 들으면\n아버지의 기다리는 등이 보인다","part":1},{"number":31,"title":"형의 화실에서 배운 길","text":"큰형의 화실에는 물감 냄새가 났다\n나는 형이 남긴 붓을 씻으며\n종이 위에 산과 집을 그렸다\n형은 눈에 보이는 것보다\n마음에 남는 빛을 그려 보라 했다\n서울에서 공부할 수 있었던 형은\n동생들의 길을 위해 대구에 남았다\n나는 뒤늦게 그 선택을 알았다\n그림 한 장을 건네던 손끝에\n우리 가족의 내일이 걸려 있었다\n오늘도 화실의 문을 마음으로 열면\n젊은 형이 그림 앞에 서 있다\n내가 걸어온 긴 교직의 길에도\n형의 붓 자국이 먼저 놓여 있다","part":1},{"number":32,"title":"노래가 머문 화실","text":"오래된 화실의 창문으로\n가을 햇살이 길게 들어왔다\n붓을 든 청년은 그림을 멈추고\n복도에서 들려오는 노래를 들었다\n노래를 부르던 여인은 지나갔지만\n빈 캔버스에는 파란 빛이 번졌다\n만난 적 없는 사람을 그리듯\n그는 한동안 문을 바라보았다\n훗날 소설 속 청년 윤재가 되어\n그 노랫소리를 다시 불러냈다\n이루지 못한 꿈도 사라지지 않아\n어느 날 다른 이야기로 피어난다\n그림이 멈춘 자리에 노래가 남고\n노래가 떠난 자리에 그림이 자랐다","part":1},{"number":33,"title":"가을비가 묻는 길","text":"대구의 오래된 소극장 앞에서\n가을비가 보도블록을 적셨다\n소설 속 젊은 화가 윤재는\n젖은 우산 끝을 털며 서 있었다\n무대에서는 지연의 춤이 끝나고\n꺼진 조명이 천천히 식어 갔다\n두 사람은 가까이 있으면서도\n서로 다른 꿈을 바라보았다\n떠나야 하는 길 앞에서는\n좋아한다는 말도 작아진다\n나는 그들의 뒷모습을 쓰다가\n창밖의 빗소리에 귀 기울였다\n끝내 만나지 못한 마음 하나가\n젖은 골목에 오래 남아 있었다","part":1},{"number":34,"title":"대구공고 교생실습","text":"칠성시장 건너편 대구공고에서\n나는 처음 선생님의 자리에 섰다\n출석부를 들고 교실로 들어가니\n학생들의 눈빛이 한꺼번에 모였다\n잘 가르치고 싶은 마음만 앞서\n분필을 쥔 손에 땀이 났다\n그곳에는 나를 이끌어 주는 선배가\n차근차근 수업을 알려 주셨다\n하루의 수업을 끝내고 나오면\n칠성시장 골목에 저녁이 내렸다\n나는 교사가 된다는 일의 무게를\n그 짧은 실습에서 처음 느꼈다\n교실 문을 닫고 난 뒤에도\n학생들의 질문이 오래 남았다","part":1},{"number":35,"title":"칠성시장 선배의 손","text":"교생실습을 마친 저녁\n선배는 칠성시장으로 나를 데려갔다\n해삼과 멍게가 접시에 놓이고\n시장 안에는 사람들의 말이 넘쳤다\n오늘은 제가 계산하겠습니다\n내가 지갑을 꺼내면\n선배는 웃으며 먼저 손을 내밀었다\n선배가 사야지, 그러면서\n그림과 글을 꾸준히 놓지 않던 사람\n지금도 화폭 앞에 서 있는 사람\n나는 그 성실한 등을 따라 배우고\n가끔은 작품을 세상에 소개한다\n한 잔의 저녁을 돌려드리지는 못해도\n감사의 말은 오래 새로 쓸 수 있다","part":1},{"number":36,"title":"교실에서 보낸 서른여섯 해","text":"처음 교실 문을 열던 날의 떨림이\n어느덧 서른여섯 해를 건너왔다\n아이들은 자라고 또 졸업했고\n계절마다 새 얼굴이 교실에 앉았다\n분필에서 컴퓨터 화면으로\n수업 도구도 조금씩 바뀌었다\n그러나 질문하는 눈빛 하나만은\n언제나 처음 보는 별처럼 빛났다\n때로는 가르치고 때로는 배우면서\n나는 그 많은 봄을 지나왔다\n퇴임한 지금 고산골을 걸을 때도\n아이들의 웃음이 바람에 섞인다\n학교는 떠났지만 내 마음에는\n아직 끝나지 않은 수업이 있다","part":1},{"number":37,"title":"대명동, 방 한 칸","text":"고등학교를 다니던 대명동에는\n형과 누나와 내가 지내던 방이 있었다\n새벽 시장에서 선짓국을 사 오면\n작은 냄비에 하루가 뜨거워졌다\n책상 하나를 번갈아 쓰고\n늦은 밤까지 숙제를 했다\n방은 작고 세상은 멀게 느껴졌지만\n우리 셋의 꿈은 문밖으로 자랐다\n훗날 나는 그 방을 소설로 옮겼다\n사람을 살게 하는 것이\n언제나 넓은 집은 아니었다\n한 사람의 등을 다른 사람이 받치던\n그 비좁고 따뜻한 세월이\n우리를 먼 곳까지 데려다주었다","part":1},{"number":38,"title":"그림과 훈장 사이","text":"낮에는 아이들을 만나 수업하고\n밤에는 화실의 불을 오래 켰다\n대구시 초대작가로 작품을 내고\n교육자료를 만들어 발표도 했다\n잘해 보려는 날들이 차곡차곡 모여\n2015년 옥조근정훈장을 받았다\n빛나는 훈장을 손에 올려놓으며\n그동안 만난 학생들을 떠올렸다\n나 혼자 만든 시간이 아니었다\n동료와 가족의 손길도 함께 있었다\n상장과 훈장은 서랍에 넣어 두었지만\n교실에서 나눈 말은 아직 따뜻하다\n가장 오래 남는 상은 어쩌면\n누군가의 기억 속에 있을 것이다","part":1},{"number":39,"title":"칠판에서 화면까지","text":"처음 교실에 들어서던 날\n손에는 분필과 출석부가 있었다\n학생의 눈빛을 더 알고 싶어\n상담 공부를 다시 시작했고\n컴퓨터 앞에 앉아 밤을 새웠다\n새 기계가 교실에 들어올 때마다\n배우지 않으면 가르칠 수 없었다\n세월이 흘러 칠판은 화면이 되고\n나는 인공지능으로 수업을 만든다\n버튼 하나를 고치는 새벽에도\n가장 먼저 떠오르는 것은\n틀린 답 앞에서 머뭇거리던 아이\n교실 밖으로 나온 뒤에도\n선생의 질문은 끝나지 않는다","part":1},{"number":40,"title":"봉덕동으로 돌아온 저녁","text":"대명동에서 보낸 청춘을 지나\n나는 봉덕동에 삶의 자리를 잡았다\n학생들을 가르치고 그림을 그리며\n계절이 여러 번 문을 두드렸다\n바쁘다는 말로 지나친 날도 많았다\n지금은 고산골로 천천히 걸어가\n버들잎이 흔들리는 소리를 듣는다\n가끔 월촌역 쪽에서 친구를 만나면\n우리는 옛 교실 이야기를 꺼낸다\n누군가는 시를 쓰고\n누군가는 웃음으로 하루를 적는다\n젊은 날 멀리 찾던 아름다움이\n이제는 가까운 길모퉁이에서\n나를 기다리고 있다","part":1},{"number":41,"title":"고산골 첫걸음","text":"봉덕동 집을 나와\n고산골 오르는 길에 들어선다\n도시 소음이 조금씩 멀어지고\n나무 사이로 바람이 지나간다\n나는 늘 같은 길을 걷지만\n어제와 같은 나뭇잎은 없다\n산 아래 첫 계단을 밟을 때\n시장 소음이 등 뒤로 물러났다\n산길의 흙은 어제 내린 비를 품고\n작은 풀은 돌틈에서 아침을 올렸다\n숨을 고르며 나도 조용해졌다\n산책은 익숙한 곳에서\n새로운 하루를 만나는 일이다","part":2},{"number":42,"title":"메타세쿼이아 길","text":"키 큰 메타세쿼이아가\n길 양쪽에서 하늘을 받친다\n발밑에는 오래된 잎이 쌓이고\n머리 위에는 새잎이 흔들린다\n나는 가운데 길을 천천히 걷는다\n나무들은 말없이 서 있지만\n키 큰 나무들이 길 위에 줄을 서고\n잎 사이 햇살이 어깨에 떨어졌다\n바람이 불자 가지들은 함께 흔들렸지만\n서로의 자리를 빼앗지 않았다\n나는 그 사이로 느린 시간을 걸었다\n그 사이를 지나면\n마음이 곧게 펴진다","part":2},{"number":43,"title":"고산골 봄꽃","text":"언 땅이 풀리고\n산길 가장자리 작은 꽃이 피었다\n사람들은 큰 벚꽃나무를 올려다보지만\n나는 발밑의 보랏빛 꽃을 본다\n누구도 심지 않은 자리에서\n자기 몫의 봄을 피운 꽃\n연분홍 꽃잎이 신발 앞에 내려앉았다\n막 피어난 꽃은 이름을 묻지 않고\n그 자리에서 하루를 환하게 했다\n내가 고개를 숙여야만 보이는 것들\n봄은 작은 곳에서 먼저 시작되었다\n그 앞에서 나도\n조금 더 천천히 걷는다","part":2},{"number":44,"title":"진달래 피는 언덕","text":"고산골 언덕에 진달래가 피었다\n멀리서 보면 산이 붉게 웃는다\n가까이 가면 가는 꽃잎마다\n찬바람을 견딘 자국이 있다\n봄은 따뜻해서 오는 줄 알았는데\n추위를 지나온 꽃이 먼저 알려 준다\n진달래 사이로 마을 지붕이 내려다보였다\n어릴 적에도 봄이면 이런 빛이었을까\n한 걸음 더 오르자 꽃은 더 가까워졌고\n산 아래 걱정은 조금 멀어졌다\n그 붉은 빛이 내 하루를 씻었다\n기다린 시간만큼\n빛은 더 깊어진다는 것을","part":2},{"number":45,"title":"목련이 지는 날","text":"하얀 목련이 한꺼번에 피더니\n며칠 만에 길에 꽃잎을 놓았다\n아름다운 날은 왜 짧을까\n나는 떨어진 꽃잎을 밟지 않고 걷는다\n꽃은 나무 위에 있을 때도\n흙 위에 누울 때도 꽃이다\n하얀 꽃잎이 계단에 흩어져 있었다\n꽃이 떨어진 자리마다 빛이 고였다\n나는 가장 온전한 한 장을 골라\n손바닥에 잠깐 올려놓았다\n아름다움은 꼭 가지에만 있지 않았다\n한 계절의 끝에서\n다음 계절이 자라고 있었다","part":2},{"number":46,"title":"법장사 풍경소리","text":"법장사 처마 끝에서\n작은 풍경이 바람을 불렀다\n나는 계단 아래 서서\n그 맑은 소리를 들었다\n서둘러 오르던 마음이 멈추고\n멀리 새소리까지 가까워졌다\n바람이 지나가자 처마 끝이 울었다\n작은 쇳소리가 숲속으로 번져 갔다\n등산객의 발길도 잠시 느려지고\n나는 손에 쥔 걱정을 놓아 보았다\n소리는 멎어도 산은 오래 울렸다\n산에서 내려올 때\n내 걸음도 조금 조용해졌다","part":2},{"number":47,"title":"약수터의 바가지","text":"약수터에 차가운 물이 솟았다\n작은 바가지가 물 위에 떠 있었다\n먼저 온 사람이 한 모금 마시고\n다음 사람에게 자리를 비켜 주었다\n산에서 가장 맑은 것은\n물만이 아니었다\n찬물은 손바닥의 열을 식혀 주었다\n바가지에 담긴 하늘이 잠시 흔들렸다\n누군가 마시고 내려놓은 자리에\n다음 사람이 조용히 다가왔다\n작은 그릇 하나에 길이 이어졌다\n서로 먼저 마시라 손짓하는\n그 짧은 인사도 맑았다","part":2},{"number":48,"title":"바위의 초록 이끼","text":"계곡 바위에는 이끼가 자란다\n차가운 그늘에서도\n초록빛을 잃지 않고 자란다\n나는 손대지 않고 바라본다\n작은 생명은 조용히\n돌의 긴 시간을 덮어 간다\n바위 그늘에는 작은 초록이 살고 있었다\n여름 볕이 깊이 닿지 못한 자리였다\n나는 손으로 만지지 않고 들여다보았다\n눈에 잘 띄지 않는 생명도\n제 몫의 계절을 묵묵히 건넌다\n크게 소리 내지 않아도\n살아 있다는 것은 분명하다","part":2},{"number":49,"title":"계곡의 물소리","text":"고산골 계곡에 귀를 기울인다\n물은 돌을 만나 돌아가고\n좁은 곳에서는 노래를 높인다\n나는 작은 다리 위에 서서\n한참을 물소리를 듣는다\n막힌 길을 탓하지 않고\n돌에 부딪힌 물이 하얗게 튀었다\n소리는 굽이마다 다른 높이로 울렸다\n아무도 악보를 놓지 않았는데\n계곡은 하루 종일 노래했다\n나는 그 노래를 마음에 담았다\n다른 길을 찾는 물\n오늘은 그 물에게 길을 배운다","part":2},{"number":50,"title":"여름 매미와 오래된 운동장","text":"고산골 여름 숲에 들어서면\n매미 소리가 나뭇잎을 흔든다\n나는 모자를 벗고 땀을 닦다가\n국민학교 운동장을 떠올린다\n그날도 햇볕이 뜨거웠고\n우리는 흙먼지 속에서 공을 찼다\n매미는 아무리 크게 울어도\n우리가 돌아보지 않는 줄 알았을까\n지금은 공 차는 아이들이 멀어지고\n내 발걸음만 숲길에 남았다\n그러나 나무 위 작은 목소리는\n해마다 여름을 처음처럼 부른다\n늙어 가는 것은 나뿐인지\n숲은 오늘도 소년의 목소리다","part":2},{"number":51,"title":"소나기 지나간 산길","text":"갑자기 소나기가 쏟아졌다\n나뭇잎들이 굵은 빗방울을 받았다\n비가 그치자 숲은 더 푸르게 젖고\n흙에서는 진한 냄새가 올라왔다\n나는 젖은 신발을 내려다본다\n돌아갈 길은 조금 미끄럽지만\n젖은 소나무에서 빗방울이 떨어졌다\n길가의 흙냄새가 더욱 짙어졌다\n먼 산을 가리던 구름이 걷히고\n작은 개울에 햇빛이 들어왔다\n비가 지나간 자리에 길이 다시 열렸다\n비를 맞은 오늘의 산을\n오래 기억할 것 같다","part":2},{"number":52,"title":"앞산의 안개","text":"이른 아침 앞산에 안개가 걸렸다\n먼 능선은 보이지 않고\n가까운 소나무만 서 있었다\n나는 보이는 길만큼 걸었다\n안개는 조금씩 옅어지고\n나무 뒤로 햇살이 나왔다\n구름이 낮게 내려와 산허리를 감쌌다\n익숙한 나무도 오늘은 낯설었다\n나는 보이는 만큼만 걸음을 옮겼다\n길을 다 알지 못해도 괜찮았다\n안개 속에도 길은 이어지고 있었다\n앞이 다 보이지 않아도\n한 걸음은 언제나 내 앞에 있다","part":2},{"number":53,"title":"고산골 쉼터","text":"나무 의자에 앉아 물을 마신다\n등산객이 지나가며 인사한다\n처음 보는 얼굴인데도\n같은 길을 걸었다는 이유로 반갑다\n바람이 이마의 땀을 식히고\n발끝에는 햇빛이 내려온다\n낡은 의자에는 햇살이 먼저 앉았다\n물병을 내려놓고 신발을 고쳐 맸다\n앞서 가던 사람이 웃으며 인사했다\n짧은 한마디가 산길에 오래 남았다\n쉼터는 나무가 만든 작은 거실이었다\n산은 우리에게\n잠시 쉬어 갈 자리도 내어 준다","part":2},{"number":54,"title":"청설모의 아침","text":"소나무 가지가 갑자기 흔들렸다\n청설모 한 마리가 건너뛰었다\n작은 발톱으로 나무를 붙잡고\n높은 곳으로 금세 올라갔다\n나는 잠시 발을 멈췄다\n이 숲은 산책하는 내 길이면서\n꼬리가 긴 청설모가 나무를 올랐다\n가지 하나가 가볍게 흔들렸다\n나는 소리를 죽여 걸음을 멈췄다\n그 작은 몸은 숲 전체를 집으로 삼았다\n오늘의 손님은 오히려 나였다\n작은 생명들이 살아가는\n소중한 집이기도 하다","part":2},{"number":55,"title":"가을이 내려앉은 길","text":"고산골 단풍이 붉어질 무렵\n나는 느린 걸음으로 산길에 오른다\n나무마다 지난여름을 접어\n서로 다른 빛으로 내놓는다\n사진을 찍느라 한참을 서 있다가\n발밑의 낙엽 하나를 본다\n나뭇가지에 있을 때는\n그렇게 자주 올려다보았는데\n가까이 내려온 잎은 그냥 지나쳤다\n나를 기다리던 사람들도\n곁에 있을 때는 몰랐던가\n늦은 바람이 옷깃을 당긴다\n나는 낙엽을 밟지 않고 돌아서서\n오래 미뤄 둔 안부를 생각한다","part":2},{"number":56,"title":"낙엽 한 장","text":"갈색 낙엽이 내 발 앞에 떨어졌다\n조금 전까지 나무에 매달렸던 잎\n나는 그 곁에 잠시 서 있었다\n떠날 때가 되면\n바람에 몸을 맡기는 잎\n가을은 끝이라고 말하지 않는다\n잎 하나가 내 어깨를 스치고 떨어졌다\n아무도 밀지 않았는데 제때 내려왔다\n나는 밟지 않으려 길을 비켰다\n떠나는 일에도 고운 때가 있는가\n바람은 대답 대신 잎을 돌려놓았다\n떨어진 자리에도\n새봄이 올 것을 알고 있다","part":2},{"number":57,"title":"아버지의 흰 낮달","text":"고산골 산길 위에 낮달이 떠 있다\n가을걷이를 끝내고 가시겠다던\n아버지의 말씀이 생각난다\n달이 차오르면 뵙는 날이 가까워져\n나는 자꾸 하늘을 올려다본다\n어머니 손을 잡고 함께 오셔서\n제 절을 받아 주시면 좋겠다\n잎을 달고 있을 때는 모르다가\n땅에 떨어진 뒤에야 그리워하듯\n가까이 계실 때 못한 말이 많다\n산등성이로 찬바람이 넘어온다\n낮에도 지지 않는 저 흰달처럼\n아버지는 어디에 계셔도\n내 걸음을 오래 비추고 계신다","part":2},{"number":58,"title":"겨울 숲의 발자국","text":"눈 내린 고산골 길에는\n아직 아무 발자국도 없었다\n나는 천천히 첫걸음을 내디뎠다\n뒤돌아보니 발자국들이 이어졌다\n어려운 날도 이와 같을 것이다\n한 번에 먼 길을 갈 수는 없어도\n발자국마다 마른 잎이 바스락거렸다\n겨울 숲은 말을 아끼는 사람 같았다\n잎을 떨군 가지 사이로 먼 하늘이 보이고\n작은 새가 바닥을 한 번 쪼았다\n빈 숲에도 하루는 가득했다\n한 걸음씩 쌓이면\n뒤에 길 하나가 남는다","part":2},{"number":59,"title":"산새가 깨우는 아침","text":"고산골 아침은 새가 먼저 연다\n작은 지저귐 하나에\n잠든 나무들이 깨어나는 듯하다\n나는 휴대전화를 주머니에 넣고\n그 소리를 가만히 듣는다\n오늘 처음 들리는 노래인데\n먼저 깨어난 산새가 가지를 옮겼다\n시계보다 부지런한 아침이었다\n나는 휴대전화를 주머니에 넣었다\n소리의 방향을 따라 고개를 들자\n어느새 햇살이 얼굴에 닿았다\n어쩐지 오래 알고 지낸\n이웃의 인사처럼 반갑다","part":2},{"number":60,"title":"월촌역 일곱 번째 출구","text":"월촌역 일곱 번째 출구로 나오면\n오래된 친구들의 얼굴이 보인다\n누군가는 먼저 커피를 주문하고\n누군가는 새로 쓴 시를 펼친다\n서로의 주름은 세지 않으면서\n시의 한 줄은 오래 들여다본다\n점심에는 뜨거운 찌개를 나누고\n별것 아닌 농담에 크게 웃는다\n청춘에는 앞서 달리기 바빴지만\n이제는 천천히 기다릴 줄 안다\n흩어졌다 다시 만나는 길 위에\n우리의 말들이 작은 불빛을 켠다\n시를 잘 쓰는 일보다 먼저\n함께 읽을 사람이 있어 고맙다","part":2},{"number":61,"title":"신천의 흰 새","text":"입동 지난 신천을 걷다가\n물가에 선 백로를 만났다\n찬바람은 억새 사이로 지나가고\n새는 물속을 오래 바라보았다\n나는 서둘러 사진을 찍으려다\n손을 내리고 함께 기다렸다\n물고기 한 마리가 지나갈 때\n흰 목이 천천히 움직였다\n살아간다는 것은 저마다\n제때의 물결을 기다리는 일\n바람은 쉬지 않고 등을 밀었지만\n백로는 제 그림자를 놓지 않았다\n나는 신천의 양지로 걸어가며\n오늘은 조금 덜 서둘러 보기로 했다","part":3},{"number":62,"title":"흰 백로 한 마리","text":"얕은 물에 백로 한 마리가 섰다\n흰 깃털은 아침빛을 받아 빛났다\n차들은 다리 위로 바쁘게 달리지만\n백로는 긴 다리를 움직이지 않는다\n물고기가 가까이 오기를 기다리는 새\n나는 그 곁을 지나며\n백로는 물 위에 긴 다리를 세웠다\n움직이지 않는 듯 물고기를 기다렸다\n흰 깃에 아침 햇살이 부서지고\n강 건너 자동차들은 쉼 없이 달렸다\n기다리는 힘을 새에게 배웠다\n기다림에도\n저마다의 깊이가 있음을 배운다","part":3},{"number":63,"title":"왜가리의 긴 그림자","text":"왜가리가 물가를 천천히 걸었다\n회색 날개 아래 긴 그림자가 따라갔다\n나는 그 새가 날아오르기를 기다렸다\n하지만 왜가리는 서두르지 않았다\n바람이 오고 물결이 멈춘 뒤\n커다란 날개를 펼쳤다\n왜가리가 물 가장자리로 옮겨 갔다\n긴 목이 천천히 굽어졌다\n물속 그림자는 먼저 고개를 숙였다\n나는 낚시도 하지 않으면서\n그 묵묵한 시간을 함께 지켰다\n날아갈 때를 아는 새에게\n강은 넓은 길이 되었다","part":3},{"number":64,"title":"물고기의 방향","text":"물속 작은 물고기들이\n햇빛을 따라 반짝이며 움직였다\n흐르는 물에 몸을 맡기는 듯하다가\n순식간에 방향을 바꾸었다\n나는 난간에 기대어 생각했다\n물살이 센 날에도\n얕은 물에 작은 물고기들이 모였다\n그림자가 스치면 한꺼번에 흩어졌다\n그러다 곧 다시 제자리로 돌아왔다\n물결의 방향은 수시로 달라져도\n작은 지느러미는 쉬지 않았다\n제 길을 찾는 작은 몸\n살아가는 힘은 크기로 정해지지 않는다","part":3},{"number":65,"title":"잉어가 오르는 물","text":"신천의 잔잔한 곳에\n커다란 잉어가 모습을 드러냈다\n느린 꼬리짓 하나에\n둥근 물결이 멀리 번졌다\n나는 잉어가 지나간 자리를 본다\n잠시 흔들리던 물은 다시 고요하다\n잉어가 수면 가까이 떠올랐다\n붉은 등에는 낮빛이 얹혔다\n잠깐 입을 내밀었다가 사라지자\n남은 것은 커다란 둥근 물결\n깊은 곳에도 살아 있는 힘이 있었다\n하루의 소란도 언젠가는\n이렇게 잠잠해질 것이다","part":3},{"number":66,"title":"물비늘","text":"햇살이 신천 위에 쏟아졌다\n물결마다 작은 빛이 반짝였다\n손으로 잡으려 하면 사라질 빛\n나는 바라보는 것만으로 좋았다\n물은 아무것도 가지지 않아도\n하루 종일 빛을 나누었다\n햇살이 강물 위에서 잘게 부서졌다\n작은 빛들은 저마다 다른 곳을 향했다\n나는 한 조각도 손에 잡지 못했지만\n한참 바라보는 것만으로 충분했다\n물은 이렇게 빛을 나누어 주었다\n나도 누군가에게\n작은 반짝임 하나 건네고 싶다","part":3},{"number":67,"title":"버드나무 아래","text":"신천 둔치 버드나무가\n긴 가지를 물 쪽으로 내렸다\n바람이 불 때마다\n물 위에 초록 인사를 건넸다\n나는 나무 그늘에 앉아\n지나가는 사람들을 바라보았다\n버드나무 가지가 물 가까이 내려왔다\n긴 잎이 강바람에 머리를 빗었다\n그 아래 작은 물고기가 머물렀다\n나는 나무 그늘에 잠깐 앉았다\n쉬는 곳을 내어 주는 것도 사랑이다\n바쁜 하루 한가운데에도\n이렇게 쉬어 갈 그늘이 있다","part":3},{"number":68,"title":"강가의 돌멩이","text":"신천 가장자리 작은 돌 하나\n오랜 물살에 모서리가 둥글었다\n나는 돌을 집어 들었다가\n다시 물가에 내려놓았다\n거친 시간이 지나면\n마음도 이렇게 부드러워질까\n물살에 닳은 돌은 모서리가 둥글었다\n누가 얼마나 오래 만졌을까\n나는 손안에 돌 하나를 올려놓았다\n차가운 무게가 천천히 전해졌다\n세월은 거친 것에도 부드러운 얼굴을 준다\n물소리가 대답 대신\n돌을 조용히 적셨다","part":3},{"number":69,"title":"비가 그친 봉덕시장","text":"고산골에 비가 내린 날\n신천까지 내려오니 물이 불었다\n왜가리는 돌 위에 서 있었고\n오리들은 바쁜 물살을 피했다\n나는 봉덕시장 쪽으로 발길을 돌렸다\n식당 앞에서는 된장 냄새가 났다\n밥 한 그릇 먹고 가라는 듯\n따뜻한 김이 문밖으로 나왔다\n발걸음은 늘 계획대로 가지 않는다\n비를 피해 들어간 골목에서\n뜻밖의 저녁을 만날 때도 있다\n집으로 돌아와 젖은 신발을 벗으니\n우산 끝에 남은 물방울들이\n신천의 작은 물결처럼 흔들렸다","part":3},{"number":70,"title":"저녁 강물","text":"저녁노을이 신천을 붉게 물들였다\n산책하던 사람들은 집으로 돌아가고\n한 마리 새가 늦게 날아갔다\n나는 마지막 햇살을 바라본다\n오늘 한 일보다\n고마웠던 얼굴이 먼저 떠오른다\n다리 아래로 붉은 노을이 길게 흘렀다\n산책하는 사람들의 그림자가 늘어졌다\n물새가 마지막 빛을 가르고 날았다\n나는 강을 따라 천천히 집으로 갔다\n저녁도 이렇게 걸어서 오는 것이었다\n강물은 말없이\n그 얼굴들을 데리고 흐른다","part":3},{"number":71,"title":"주리못 가는 길","text":"가창 길을 따라 주리못으로 간다\n산이 가까워질수록 바람이 맑다\n못둑에 닿으면 물이 먼저 반긴다\n오래 보아 온 풍경인데도\n오늘은 다른 구름이 떠 있다\n나를 다시 오게 하는 것은\n가창으로 향하는 길에 산빛이 짙어졌다\n익숙한 굽이를 돌면 못물이 보였다\n차창을 내리자 풀 냄새가 들어왔다\n어릴 적 집으로 가던 길과 닮았다\n목적지보다 반가운 것은 길이었다\n큰 구경거리가 아니라\n날마다 달라지는 이 작은 하늘이다","part":3},{"number":72,"title":"핑크빛 빈 벤치","text":"비가 그친 주리못 둑에\n핑크빛 벤치 하나가 앉아 있다\n사람들은 잠시 쉬었다 떠나고\n벤치는 물가를 오래 바라본다\n풀잎에는 빗방울이 남았고\n나리꽃 한 송이가 고개를 든다\n바람이 먼저 다가와 앉자\n못물에도 잔주름이 번졌다\n누군가 오기를 기다리는 일도\n하루를 살아 내는 방법일까\n나는 잠시 벤치 곁에 서서\n서두르지 않는 시간을 배운다\n비어 있는 자리 하나가\n이렇게 넓은 풍경을 품고 있다","part":3},{"number":73,"title":"빈 돛배","text":"못가에 작은 돛배가 매여 있었다\n바람은 오는데 배는 떠나지 않았다\n물 위로 구름만 천천히 흘렀다\n나는 배를 오래 바라보았다\n멀리 가지 않는 날에도\n하늘을 실을 수 있다는 듯\n돛을 접은 배는 조용히 떠 있었다\n바람이 불자 물 위에 줄이 흔들렸다\n멀리 가려는 듯하면서도 가지 않았다\n나는 그 곁에서 한참 쉬었다\n머무르는 시간도 여행의 한 부분이다\n빈 배는 고요히\n못물 한가운데를 바라보았다","part":3},{"number":74,"title":"주리못의 봄비","text":"봄비가 주리못 수면에 떨어졌다\n동그란 물결이 셀 수 없이 피었다\n멀리 산은 안개에 가려지고\n못가의 새싹은 더 선명해졌다\n나는 우산 아래 서서\n젖은 봄의 냄새를 맡았다\n빗방울이 연달아 둥근 원을 만들었다\n서로 만난 물결이 더 넓게 퍼졌다\n산그늘은 젖은 못물에 가까워지고\n연둣빛 잎 하나가 물가에 떠 있었다\n작은 비에도 봄은 깊어졌다\n비는 지나가지만\n나뭇잎에는 새 계절이 남는다","part":3},{"number":75,"title":"도윤이의 첫 가을","text":"비슬산 억새가 은빛으로 흔들리던 날\n도윤이는 엄마 품에서 산을 보았다\n아직 단풍이 무엇인지 몰라도\n작은 눈에는 붉은 빛이 담겼다\n슬로우 스톤 카페의 창가에서\n가족은 따뜻한 차를 나누었다\n아이는 손을 뻗어 바람을 잡고\n나는 오래된 가을들을 떠올렸다\n한 해가 저물어 가는 나이에도\n처음 보는 계절이 다시 온다\n도윤이가 만나는 첫 번째 가을은\n내게는 잊고 있던 봄이었다\n작은 손 하나가 웃을 때마다\n저무는 햇살도 다시 환해졌다","part":3},{"number":76,"title":"가을 억새","text":"주리못둑에 억새가 피었다\n은빛 이삭들이 바람에 몸을 기울였다\n멀리서 보면 물결이 땅 위로 올라온 듯하다\n나는 그 사이를 천천히 걸었다\n한 해 동안 키운 마음을\n바람 앞에 풀어놓는 억새\n억새가 바람 쪽으로 몸을 기울였다\n은빛 이삭마다 오후가 묻어났다\n나는 그 사이를 천천히 지나갔다\n가을빛은 붙잡을 수 없어 더 고왔다\n저무는 것도 빛나는 일이었다\n가을은 떠나는 계절이면서\n가장 환하게 빛나는 계절이다","part":3},{"number":77,"title":"못물에 든 구름","text":"구름 하나가 주리못에 내려왔다\n하늘에는 그대로 떠 있는데\n물속에도 똑같은 얼굴이 있었다\n나는 어느 쪽이 진짜인지 묻지 않았다\n구름은 두 곳에서 모두 아름다웠다\n사람도 누군가의 마음속에\n하늘의 구름이 물속에서 다시 태어났다\n바람 한 번에 얼굴이 흩어졌다가\n잠시 후 새 모양으로 모였다\n나는 두 개의 하늘을 번갈아 보았다\n변하는 모습에도 같은 빛이 있었다\n이렇게 다른 모습으로\n살아가고 있을지 모른다","part":3},{"number":78,"title":"떠나온 길에 남은 노을","text":"홍콩의 높은 빌딩 사이로\n저녁 불빛이 하나둘 켜졌다\n딸과 함께 걸었던 낯선 길에는\n바다에서 건너온 바람이 불었다\n아득한 항구를 돌아보며\n나는 대구의 신천을 떠올렸다\n먼 도시의 밤은 눈부셨지만\n그리운 곳은 늘 가까이에 있었다\n사람이 돌아가는 곳은 어디일까\n나는 가족의 걸음에 속도를 맞췄다\n밤하늘 아래 오가는 배들처럼\n저마다 다른 길을 지나도\n우리는 다시 같은 식탁으로\n천천히 돌아올 수 있었다","part":3},{"number":79,"title":"물가의 첫서리","text":"겨울 아침 주리못둑\n풀잎 끝에 하얀 서리가 앉았다\n밤새 누가 다녀갔는지\n발자국 없이 반짝이는 흔적\n나는 손을 주머니에 넣고 걷는다\n찬 공기가 뺨을 스치지만\n풀밭의 서리가 햇살에 반짝였다\n아직 발을 딛지 않은 길이 하얬다\n손끝은 시려도 눈은 맑아졌다\n작은 얼음은 곧 사라질 것이다\n잠깐 머문 아름다움도 온전했다\n못물은 아직 천천히 흐른다\n겨울에도 멈추지 않는 시간이 있다","part":3},{"number":80,"title":"낮달 아래 가족의 이름","text":"주리못에 흰 낮달이 비친다\n바람 한 줄기에 두 개로 흔들리다가\n금세 하나의 달로 모인다\n나는 물가에서 부모님을 생각한다\n어린 날 소를 몰던 들길과\n늦은 저녁 부엌의 불빛도 떠오른다\n이름을 부르지 않아도\n그리운 얼굴은 물결에 나타난다\n가까이 있을 때 몰랐던 온기를\n멀리서야 한 번 더 배우는 나이\n물이 잔잔해지자 낮달도 멈춘다\n나는 말없이 두 손을 모은다\n물 위에는 오래된 하늘 하나\n내 안에는 돌아갈 집 하나","part":3},{"number":81,"title":"여행 끝의 라면 두 그릇","text":"홍콩에서 돌아온 늦은 날\n서울 집 부엌에 냄비를 올렸다\n파를 썰고 달걀을 하나 풀자\n빨간 국물 위로 김이 피어올랐다\n낯선 도시의 맛있는 음식보다\n지금은 이 냄새가 더 반가웠다\n아내와 마주 앉아 국물을 마시며\n우리는 말없이 웃었다\n비행기와 버스에서 보낸 긴 시간이\n따뜻한 한 젓가락에 풀렸다\n여행은 멀리 떠나는 일이지만\n돌아올 자리를 아는 일이기도 하다\n빈 그릇 두 개를 씻는 저녁\n집은 다시 우리를 품어 주었다","part":4},{"number":82,"title":"도윤이의 영상통화","text":"작은 화면에 도윤이가 나타났다\n아이는 손을 흔들 줄도 모르면서\n까만 눈으로 나를 바라보았다\n나는 화면 가까이 얼굴을 대고\n몇 번이고 이름을 불렀다\n먼 곳에서 들려오는 웃음 하나가\n방 안의 어둠을 밀어냈다\n첫돌을 앞둔 아이의 하루에는\n처음 배우는 일이 참 많겠다\n나에게도 처음인 일이 생겼다\n멀리 있어도 마음이 먼저 달려가\n손보다 빨리 아이를 안는 일\n통화가 끝난 뒤에도 한참\n작은 웃음이 화면에 남아 있었다","part":4},{"number":83,"title":"책상 위에 놓인 두 시대","text":"서가에서 옛 교과서를 꺼내고\n옆에는 인공지능 책을 펼쳤다\n분필을 잡던 손으로 마우스를 쥐니\n지나온 교실들이 나란히 앉는다\n처음 컴퓨터를 배웠을 때도\n낯선 화면 앞에서 오래 망설였다\n오늘은 인공지능에게 질문을 쓰고\n그 대답을 다시 검토한다\n기계가 문장을 빨리 찾아 주어도\n어느 말을 남길지는 내 몫이다\n책장 한쪽에는 오래된 학생 사진\n다른 쪽에는 새로 만든 앱 화면\n배움은 시대를 갈아입으면서도\n사람의 호기심을 놓지 않는다","part":4},{"number":84,"title":"바이브코딩 첫 화면","text":"명도재 작은 모니터에\n하얀 화면 하나가 켜졌다\n하고 싶은 일을 말로 적자\n빈 화면에 버튼이 생겨났다\n나는 신기해서 몇 번을 눌러 보았다\n상상한 것을 눈앞에 놓는 일\n말로 적은 생각이 화면에 나타났다\n작은 버튼이 손가락을 기다렸다\n제대로 움직이지 않아 다시 고치니\n그제야 비행기가 천천히 날았다\n실패한 줄도 창작의 한 장면이다\n어린 시절 흙으로 집을 짓던 놀이가\n이제 빛나는 화면에서 이어진다","part":4},{"number":85,"title":"어린이 퀴즈 앱","text":"세 문제를 맞히면 별이 뜨는\n작은 학습 게임을 만들었다\n정답을 누른 아이가 웃을 생각에\n나는 설명을 한 번 더 고쳤다\n기계는 답을 빠르게 보여 주지만\n배우는 기쁨은 사람의 것이다\n문제를 고르다 아이 얼굴을 떠올렸다\n틀린 답에도 풀이를 붙여 두었다\n정답을 맞힌 뒤 웃는 기쁨보다\n모르는 것을 알아가는 기쁨이 크기를\n작은 별 하나에 바람을 담았다\n작은 별 하나에도\n아이의 내일이 반짝인다","part":4},{"number":86,"title":"시와 그림 사이의 창","text":"사진 한 장을 화면에 올렸다\n고산골 바위에 이끼가 돋은 날\n나는 그 초록을 한 줄의 시로 적고\n시를 읽을 그림을 다시 그렸다\n그림 속에는 조용한 물소리\n시 속에는 젖은 돌의 빛이 남았다\n낭송 버튼을 누르니\n글자가 목소리를 얻어 걸어간다\n사진과 시와 그림과 노래가\n한 장의 창으로 이어지는 저녁\n기계는 멀리 갈 길을 도와주지만\n어디에 머물지는 내가 고른다\n손끝에서 새로운 문이 열리고\n산길의 초록은 오래 살아 있다","part":4},{"number":87,"title":"비행기 게임을 만들며","text":"모니터 속 작은 비행기가\n푸른 하늘을 날아간다\n나는 방향 버튼을 눌러 보고\n속도가 너무 빠르면 다시 고친다\n실패해도 괜찮다\n어린 날 운동장에서 공을 차듯\n비행기가 장애물을 피하지 못했다\n나는 속도와 방향을 다시 맞췄다\n어릴 적 운동장에서도 그랬다\n넘어지고 다시 뛰는 사이에\n우리의 놀이가 조금씩 나아졌다\n몇 번 넘어져 보는 동안\n게임도 나도 조금씩 배운다","part":4},{"number":88,"title":"우주를 배우는 아이","text":"아이들을 위한 별자리 화면에\n작은 별들이 하나씩 켜진다\n멀리 있는 별 이름을 누르면\n짧은 설명이 나타난다\n나는 시골 마당의 밤을 떠올린다\n아버지와 함께 세던 북두칠성\n화면 위에 북두칠성이 떠올랐다\n시골집 마당에서 보았던 별이었다\n아이의 손끝이 별 이름을 눌렀다\n먼 하늘을 가깝게 만드는 일\n오래된 기억이 새로운 공부가 되었다\n그 하늘이 이제\n아이의 손바닥에 내려왔다","part":4},{"number":89,"title":"곤충이 사는 화면","text":"게임 속 나비가 꽃 위에 앉는다\n아이들은 날개를 보고 이름을 맞힌다\n나는 고산골에서 본 나비를 생각한다\n화면으로 배우는 것도 좋지만\n언젠가는 아이들이 숲으로 나가\n진짜 꽃과 바람을 만나기를\n나비의 날개를 크게 그려 넣었다\n꽃 이름을 맞히는 문제도 만들었다\n그러나 진짜 숲에서 보는 나비는\n문제의 정답보다 훨씬 아름답다\n화면 너머로 아이들이 걸어가기를\n작은 게임이\n큰 세상으로 가는 문이기를","part":4},{"number":90,"title":"물방울의 여행","text":"물방울 하나가 구름을 떠나\n산과 강을 지나 바다로 간다\n어린이 과학 화면을 만들다가\n나는 신천의 물결을 떠올린다\n책에서 배운 물의 순환이\n산책길에서는 살아 움직인다\n구름에서 시작한 물방울을 따라갔다\n강으로 내려오는 길에 신천을 넣었다\n익숙한 산책길이 교과서가 되었다\n화면의 물방울이 바다에 닿는 동안\n나는 창밖의 비를 다시 바라보았다\n공부는 교실에서 시작해도\n세상에서 다시 자란다","part":4},{"number":91,"title":"화실에서 돌아온 소설","text":"밤늦게 소설 원고를 펼쳤다\n윤재가 서 있는 화실에는\n마르지 않은 물감 냄새가 난다\n문밖에서는 미란의 노래가 들리고\n청년은 붓을 잠시 내려놓는다\n나는 그 장면의 끝을 고치다가\n대명동의 오래된 저녁을 떠올린다\n살지 않은 삶을 쓰면서도\n지나온 날의 빛을 빌리게 된다\n사람은 못다 한 말을 그림에 남기고\n때로는 이야기 속 인물에게 건넨다\n화면을 닫자 방은 고요하지만\n아직 끝나지 않은 노래 하나가\n책상 위에 천천히 머물렀다","part":4},{"number":92,"title":"인공지능 시대의 첫 문장","text":"신문을 읽다가 펜을 들었다\n시험장에 들어온 인공지능 이야기\n막는 일만으로 될까 생각하며\n오래전 교실의 눈빛을 떠올렸다\n아이들은 답보다 이유를 묻고\n교사는 생각할 시간을 주어야 한다\n빠른 기계가 우리 앞에 왔지만\n배움을 대신 살아 주지는 못한다\n나는 칼럼의 첫 줄을 지웠다가\n다시 작은 글씨로 적었다\n새로운 도구를 두려워하기보다\n어떻게 책임 있게 쓸지 가르치자\n밤이 깊어도 책상에는\n아직 지우지 않은 질문이 남았다","part":4},{"number":93,"title":"아이와 인공지능","text":"아이에게 정답을 모두 알려 주면\n스스로 찾는 길이 짧아질까\n나는 모니터 앞에서 생각한다\n묻고 고르고 다시 해 보는 시간\n그 시간이 아이를 자라게 한다\n인공지능은 좋은 길잡이가 될 수 있지만\n아이가 다시 질문하도록 남겨 두었다\n정답 옆에 작은 물음표를 적었다\n빨리 가는 기술이 많아질수록\n천천히 생각할 시간도 필요하다\n그 시간을 지켜 주는 도구이고 싶다\n길 위에서 걸어야 하는 사람은\n언제나 아이 자신이다","part":4},{"number":94,"title":"첫눈을 쓰는 교실","text":"한 학생이 첫눈을 주제로 시를 쓴다\n운동장에 눈이 내렸어요\n나는 그 문장 옆에 물었다\n누구의 발자국이 먼저 남았니\n아이는 잠시 창밖을 바라보고\n친구의 빨간 장갑을 떠올렸다\n짧은 문장에 겨울이 들어오고\n작은 이야기가 시가 되었다\n인공지능은 낱말을 찾아주었지만\n그 눈을 본 사람은 아이였다\n교실의 창은 많이 달라져도\n발견하는 기쁨만은 변하지 않는다\n나는 오늘도 학생의 눈높이에서\n새로 시작하는 시를 읽는다","part":4},{"number":95,"title":"고산골 산책 뒤의 원고","text":"고산골을 한 바퀴 돌아오면\n신발 밑에 작은 흙이 묻어 있다\n계곡에서는 물소리를 듣고\n메타세쿼이아 길에서 바람을 만났다\n나는 책상에 앉아 기억을 적는다\n산책이 수필 한 편이 되는 날\n한 문장 속에 잎 하나를 남기고\n나머지는 조용히 덜어 낸다\n말이 많다고 마음이 깊은 것은 아니다\n물가에서 본 백로처럼\n한자리에서 오래 바라보는 것\n그렇게 적은 글을 다시 읽으면\n오전에 지나온 길이\n저녁의 내 마음을 천천히 지난다","part":4},{"number":96,"title":"비슬산의 작은 봄","text":"억새꽃이 햇살을 받아 흔들렸다\n도윤이는 품에 안긴 채 눈을 깜박였다\n아직 말하지 못하는 아이의 마음을\n나는 가을 산의 색으로 읽었다\n엄마는 작은 손을 꼭 잡고\n가족들은 서로 사진을 찍어 주었다\n아이는 처음 보는 풍경 앞에서\n세상을 온몸으로 배워 갔다\n나는 오래전에 놓친 봄을\n그 작은 손끝에서 다시 만났다\n사람의 나이는 저마다 달라도\n함께 보는 햇살은 같은 빛이다\n집으로 돌아오는 차창에도\n아이의 눈망울이 반짝였다","part":4},{"number":97,"title":"시가 노래를 만나는 저녁","text":"고산골 단풍을 적은 시에\n조용한 선율 하나를 붙였다\n말로 다 하지 못한 그리움이\n노래의 긴 숨을 타고 흘렀다\n화면 속에는 내가 찍은 풍경\n그 위로 자막이 천천히 지나간다\n한글로 쓴 시가 다른 말로 옮겨져\n멀리 있는 누군가에게 닿을까\n나는 낭송을 다시 듣고\n어색한 구절을 한 번 더 고친다\n노래가 크다고 감동이 깊지는 않다\n가장 작은 소리로도\n한 사람의 하루를 위로한다면\n그것으로 충분한 작품이 된다","part":4},{"number":98,"title":"또 한 권을 만드는 새벽","text":"새벽 명도재에 불을 켜고\n어제 쓴 수필과 소설을 펼친다\n인공지능에게 시의 초고를 맡기고\n나는 오래된 기억을 다시 읽는다\n고향의 소, 대명동의 만두\n봉덕동에서 시작한 긴 산책\n한 작품씩 기쁨과 아쉬움을 고르며\n불필요한 말을 조용히 지운다\n화면은 빠르게 새 문장을 내놓지만\n어느 장면이 내 삶인지는 내가 안다\n백 편의 시를 나누어 읽는 아침\n책장 사이에 시간이 차곡차곡 쌓인다\n기계는 좋은 조수가 되어도\n마지막 한 줄은 내가 책임진다","part":4},{"number":99,"title":"명도재의 저녁 식탁","text":"저녁이 오면 명도재 창에 불이 켜진다\n낮에 쓴 칼럼을 덮고\n산책길에서 찍은 사진을 다시 본다\n홍콩의 항구와 신천의 물결\n월촌역 친구들과 도윤이의 웃음\n서로 먼 장면들이 한자리에 모인다\n젊은 날에는 새로운 길을 찾느라\n뒤돌아볼 시간이 없었다\n지금은 지나온 사람들의 이름을\n천천히 불러 보는 일이 좋다\n많이 이룬 날보다 오래 기억되는 건\n함께 밥을 먹고 웃었던 저녁\n창밖의 어둠이 깊어질수록\n내 안의 작은 불빛은 환해진다","part":4},{"number":100,"title":"백 번째 시, 다시 걷는 길","text":"고향 들에서 소를 몰던 소년이\n대명동의 학교와 화실을 지나\n봉덕동 고산골에 다시 섰다\n발아래에는 낙엽이 쌓이고\n신천에서는 흰 새가 날아간다\n나는 오늘 쓴 백 번째 시를 떠올린다\n어머니의 밥상과 형의 붓\n아이들의 교실과 도윤이의 봄\n떠나온 시간들이 한 권에 모였다\n아직 쓰지 못한 말도 많지만\n모든 이야기를 오늘 끝낼 필요는 없다\n주리못 위로 낮달이 떠오른다\n나는 빈 페이지 하나를 남겨 두고\n내일도 같은 길을 걸어갈 것이다","part":4}],"intro":"고향 들길에서 소를 몰던 소년은 대명동에서 공부하고 봉덕동에 살며 고산골을 걷는 어른이 되었습니다. 가족의 기억과 교직의 시간을 적은 시에 최근 생활수필의 하루와 소설 속 젊은 날의 꿈도 조심스럽게 더했습니다. 홍콩 여행 끝의 라면, 도윤이의 첫 가을, 월촌역 친구들, 동네 이발소의 거울은 실제 삶에서 왔고, 소극장의 윤재와 지연, 화실의 미란은 소설에서 태어난 인물입니다. 모두 다른 길에서 시작했지만 사람의 온기를 향한다는 점에서 이 책의 한 식구입니다. 어려운 말보다 누구나 아는 사물 하나가 오래 마음에 남기를 바랍니다.","after":"오늘도 고산골을 걸어 돌아오면, 수필에 담긴 하루와 소설 속 인물들이 책상에서 다시 만납니다. 사실의 기억은 있는 그대로 존중하고, 소설의 상상은 상상으로 남겨 두었습니다. 시는 그 둘 사이를 걷는 또 하나의 길이었습니다. 시의 마지막을 결정하는 것은 빠른 기계가 아니라 한 장면을 오래 바라보는 사람의 마음이라고 믿습니다."}</script>
<script>
(()=>{'use strict';const B=JSON.parse(document.getElementById('bookData').textContent), mobile=window.matchMedia('(max-width:720px)');const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let pages=[],position=0,animating=false,utter=null,paused=false;const step=()=>mobile.matches?1:2;
function cover(){return `<div class="cover"><div class="seal">明道</div><div class="small">明道齋 · 명도재 이명우 제2집</div><div class="series">제1집의 물빛을 지나, 제2집의 들길로</div><div class="visual" aria-hidden="true"><i class="bird1"></i><i class="bird2"></i><i class="bird3"></i><i class="bird4"></i></div><h1>${escape(B.title)}</h1><p>${escape(B.subtitle)}</p><div class="series-link">제1집의 잔잔한 물빛과 자연의 결을 잇는 표지 이미지</div><div class="author-bottom">${escape(B.author)} 지음</div><div class="publisher">명도재 시문학사 · 2026</div></div>`}
function poemPage(p){return `<section class="poem"><div class="page-top"><span>제${p.part+1}부 · ${escape(B.parts[p.part].title)}</span><span>POEM ${String(p.number).padStart(3,'0')} / 100</span></div><div class="sep"></div><h2 class="poem-title">${escape(p.title)}</h2><div class="author">이명우</div><div class="verse">${escape(p.text)}</div><div class="poem-bottom"><span>명도재 제2집</span><span>${String(p.number).padStart(3,'0')}</span></div></section>`}
function partPage(part){return `<section class="divider-page"><div class="eyebrow">PART ${String(part.number).padStart(2,'0')} · ${String((part.number-1)*20+1).padStart(3,'0')}—${String(part.number*20).padStart(3,'0')}</div><div class="symbol">❧</div><h2>${escape(part.title)}</h2><p>${escape(part.subtitle)}</p><div class="symbol">⌁</div></section>`}
function prosePage(title,content,label){return `<section class="prose-page"><div class="label">${label}</div><h2>${escape(title)}</h2><p>${escape(content)}</p></section>`}
function tocPage(){return `<section class="toc-page"><div class="page-top">CONTENTS · 차례</div><h2>다섯 갈래의 길</h2>${B.parts.map(p=>`<button type="button" class="toc-part" data-part="${p.number}">제${p.number}부 · ${escape(p.title)}<small>${escape(p.subtitle)} · 20편</small></button>`).join('')}</section>`}
function build(){pages=[{html:cover(),type:'cover'},{html:prosePage('들길에서 다시 만난 이름들',B.intro,'시인의 말'),type:'intro'},{html:tocPage(),type:'toc'}];for(const part of B.parts){pages.push({html:partPage(part),type:'part',part:part.number});for(const p of B.poems.filter(p=>p.part===part.number-1))pages.push({html:poemPage(p),type:'poem',poem:p})}pages.push({html:prosePage('고향에서 명도재까지 이어진 길',B.after,'발문'),type:'after'});pages.push({html:`<div class="closing"><p>물 위의 하늘과 물속의 하늘을<br>한 권에 포개어 놓습니다.</p><b>${escape(B.author)}</b></div>`,type:'end'});if(pages.length%2)pages.push({html:'',type:'blank'});$('tocEntries').innerHTML=B.parts.map(part=>`<section class="part-group"><h3>제${part.number}부 · ${escape(part.title)}</h3>`+B.poems.filter(p=>p.part===part.number-1).map(p=>`<button type="button" class="entry" data-poem="${p.number}">${escape(p.title)}<span>${String(p.number).padStart(3,'0')}</span></button>`).join('')+'</section>').join('')}
function pageOfPoem(n){return pages.findIndex(p=>p.poem&&p.poem.number===n)}function goto(index,noAnim=false){index=Math.max(0,Math.min(pages.length-1,index));if(!mobile.matches)index-=index%2;if(index===position)return;stopSpeech();if(noAnim){position=index;render();return}const f=$('flip');animating=true;f.className='flip '+(index<position?'backward':'active');setTimeout(()=>{position=index;f.className='flip';animating=false;render()},490)}
function setLeaf(el,p,n){
 el.innerHTML=p?.html||'';
 el.dataset.page=p?.type==='cover'?'':String(n+1).padStart(2,'0');
 el.dataset.kind=p?.type||'blank';
 if(p?.poem){
  el.dataset.poem=p.poem.number;
  const control=document.createElement('div');control.className='page-read-control';
  const button=document.createElement('button');button.type='button';button.dataset.readPoem=String(p.poem.number);
  button.textContent='▶ 이 페이지 읽기';button.setAttribute('aria-label',p.poem.title+' 이 페이지 읽기');
  control.appendChild(button);el.appendChild(control);
 } else delete el.dataset.poem;
 el.scrollTop=0;
}
function render(){setLeaf($('left'),pages[position],position);setLeaf($('right'),pages[position+1],position+1);$('pageStat').textContent=(position+1)+'–'+Math.min(position+step(),pages.length)+' / '+pages.length;$('prev').disabled=position===0;$('next').disabled=position+step()>=pages.length;$('edge-prev').disabled=position===0;$('edge-next').disabled=position+step()>=pages.length;const hash='#page-'+(position+1);history.replaceState(null,'',hash)}
function toggleToc(v){$('tocOverlay').hidden=!v}
let speechJob=0, currentPoem=null, speakingIndex=0;
function setVoiceStatus(message){$('voiceStatus').textContent=message;updateVoiceButtons()}
function updateVoiceButtons(){
 for(const btn of document.querySelectorAll('[data-read-poem]')){
  const selected=currentPoem&&Number(btn.dataset.readPoem)===currentPoem.number;
  btn.textContent=selected?(paused?'▶ 이어 읽기':'⏸ 일시정지'):'▶ 이 페이지 읽기';
  btn.setAttribute('aria-pressed',selected?'true':'false');
 }
 $('read').textContent=currentPoem?(paused?'▶ 이어 읽기':'⏸ 일시정지'):'▶ 현재 시 낭송';
 $('pause').textContent=paused?'▶ 이어 읽기':'⏸ 일시정지';
}
function stopSpeech(){
 speechJob++;
 if('speechSynthesis' in window){try{window.speechSynthesis.cancel()}catch(_){}}
 utter=null;paused=false;currentPoem=null;speakingIndex=0;
 setVoiceStatus('');
}
function koreanVoice(){
 const voices=window.speechSynthesis.getVoices();
 return voices.find(v=>/^ko([-_]|$)/i.test(v.lang)&&v.localService)||voices.find(v=>/^ko([-_]|$)/i.test(v.lang))||null;
}
function pauseSpeech(){
 if(!currentPoem||!('speechSynthesis' in window))return;
 try{
  if(paused){speechSynthesis.resume();paused=false;setVoiceStatus('낭송 이어 읽기 · '+currentPoem.title)}
  else{speechSynthesis.pause();paused=true;setVoiceStatus('낭송 일시정지 · '+currentPoem.title)}
 }catch(e){setVoiceStatus('이 브라우저에서 음성 조절을 사용할 수 없습니다')}
}
function speakPoem(poem){
 if(!poem)return;
 if(currentPoem&&currentPoem.number===poem.number){pauseSpeech();return}
 stopSpeech();
 if(!('speechSynthesis' in window)){setVoiceStatus('읽어주기를 지원하지 않습니다. 크롬 또는 삼성 인터넷에서 열어 주세요.');return}

 let idx=0;

 const next=()=>{
  if(token!==speechJob||!currentPoem)return;

  const voice=koreanVoice();if(voice)u.voice=voice;
  u.onend=()=>{if(token===speechJob)next()};

  try{window.speechSynthesis.speak(u)}catch(_){if(token===speechJob){stopSpeech();setVoiceStatus('음성 재생을 시작하지 못했습니다')}}
