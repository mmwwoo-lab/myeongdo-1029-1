function buildToc(){const box=$('#toc-list');box.innerHTML='';for(const part of parts){const h=document.createElement('h3');h.textContent=part[0]+' · '+part[1];box.append(h);for(let n=part[2];n<=part[3];n++){const id=String(n).padStart(3,'0'),p=logicalPages.find(x=>x.kind==='poem'&&x.num===id&&!x.continued);if(!p)continue;const b=document.createElement('button');b.innerHTML=`${esc(id+' '+p.title)}<span>${logicalPages.indexOf(p)+1}</span>`;b.onclick=()=>{toggleToc(false);go(logicalPages.indexOf(p))};box.append(b)}}}buildToc();
