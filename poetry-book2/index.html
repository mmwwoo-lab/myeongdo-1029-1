<script type="application/json" id="bookData">{"title":"고향 들길에서 고산골까지","subtitle":"명도재 이명우 제2집 · 농촌의 기억과 봉덕동, 고산골 산책에서 만난 삶의 풍경","author":"명도재 이명우","parts":[{"number":1,"title":"고향 들길에 남은 발자국","subtitle":"농촌에서 보낸 어린 시절과 국민학교 운동장"},{"number":2,"title":"대명동과 봉덕동 사이","subtitle":"대명동 학창 시절과 봉덕동의 일상"},{"number":3,"title":"고산골 사계절 산책","subtitle":"고산골 산책에서 만난 사계절의 노래"},{"number":4,"title":"신천 물가와 주리못의 하루","subtitle":"신천과 주리못의 물새, 물결, 그리움"},{"number":5,"title":"명도재에서 다시 쓰는 삶","subtitle":"배움과 창작을 이어가는 명도재의 하루"}],"poems":[{"number":1,"title":"소를 몰고 가던 아침","text":"새벽 안개가 논두렁을 덮으면\n나는 소의 고삐를 잡고 들로 나섰다\n소는 풀 냄새를 먼저 맡고\n나는 뒤따라 젖은 풀잎을 밟았다\n학교 가기 전의 짧은 아침\n소의 느린 걸음만큼\n내 마음에도 햇살이 차올랐다","part":0},{"number":2,"title":"풀을 베던 낫","text":"아버지는 작은 낫을 내게 쥐여 주셨다\n손 조심해라\n그 말씀을 들으며 풀밭에 앉았다\n낫 끝에서 풀이 가지런히 눕고\n내 손바닥에는 물집이 생겼다\n그날 저녁 소가 맛있게 풀을 씹는 소리\n나는 그것을 칭찬으로 들었다","part":0},{"number":3,"title":"논에 비친 어린 하늘","text":"모내기하는 날이면\n논은 넓은 거울이 되었다\n어머니가 허리를 굽히면\n구름도 물속에서 고개를 숙였다\n나는 모를 한 줌씩 건네며\n흙탕물에 발을 깊이 묻었다\n해 질 무렵 돌아보니\n논마다 초록 줄이 곱게 서 있었다","part":0},{"number":4,"title":"보리밥 한 그릇","text":"들일을 마친 낮\n어머니가 보리밥을 내오셨다\n된장 냄새가 마당까지 번지고\n시원한 물 한 바가지가 돌았다\n그때는 몰랐다\n뜨거운 밥보다 먼저\n우리 식구를 배부르게 한 것이\n함께 앉아 먹던 시간이라는 것을","part":0},{"number":5,"title":"우물가의 여름","text":"두레박을 내리면\n우물 속 하늘이 흔들렸다\n차가운 물을 길어 손을 씻고\n나는 툇마루에 앉았다\n매미는 감나무에서 쉬지 않고 울었다\n아무 일도 일어나지 않던 오후\n그 시간이 가장 넉넉한 여름이었다","part":0},{"number":6,"title":"아버지의 지게","text":"아버지의 지게는 늘 문 옆에 서 있었다\n볏단도 나무도 그 등에 올랐다\n하루는 내가 지게를 져 보았다\n몇 걸음 못 가 어깨가 아팠다\n아버지는 웃으며 지게를 내려 주셨다\n세월이 지나도 잊지 못한다\n그날 내 어깨에 남았던\n아버지 하루의 무게를","part":0},{"number":7,"title":"고무신에 묻은 흙","text":"비 온 뒤 학교 가는 길\n검정 고무신에 흙이 달라붙었다\n개울가에서 신발을 씻어도\n발뒤꿈치에는 진흙이 남았다\n운동장에 도착하자\n친구들도 같은 발로 달려왔다\n그 시절 우리는\n흙 묻은 발로도 참 멀리 뛰었다","part":0},{"number":8,"title":"국민학교 운동장","text":"아침 조회가 시작되면\n운동장에 아이들이 줄을 섰다\n교실 창문에는 햇빛이 닿고\n깃대 위 태극기가 바람에 펄럭였다\n수업 끝 종이 울리는 순간\n우리는 신발끈도 고치지 않고 뛰었다\n운동장은 하루마다\n우리의 세상을 조금씩 넓혀 주었다","part":0},{"number":9,"title":"달리기 일등","text":"운동회 날 나는 출발선에 섰다\n가슴에서는 작은 북이 울렸다\n선생님 손이 내려가자\n먼지가 발뒤꿈치에서 솟았다\n결승선을 먼저 지나며\n나는 뒤를 돌아볼 겨를도 없었다\n어머니가 웃던 얼굴 하나\n그날 받은 상보다 오래 빛난다","part":0},{"number":10,"title":"운동회의 만국기","text":"운동장 위로 만국기가 걸렸다\n바람이 불 때마다 온 나라가 펄럭였다\n어른들은 돗자리를 펴고\n아이들은 과자를 나눠 먹었다\n이기고 지는 일이 잠시 중요했지만\n해 질 무렵 모두가 함께 돌아갔다\n운동회는 하루 동안\n마을 전체를 한 가족으로 만들었다","part":0},{"number":11,"title":"고무줄놀이 노래","text":"교실 옆 빈터에\n여학생들의 고무줄이 팽팽했다\n노랫가락에 맞춰 발이 올라가고\n치맛자락이 바람을 그렸다\n우리는 옆에서 구경하다\n괜히 웃으며 달아났다\n지금도 그 골목을 생각하면\n노래보다 먼저 뛰는 발끝이 보인다","part":0},{"number":12,"title":"공 하나로 가득한 오후","text":"낡은 축구공 하나만 있으면\n운동장 끝까지 친구들이 모였다\n돌멩이 두 개로 골문을 세우고\n해가 질 때까지 달렸다\n무릎에는 상처가 나고\n소매에는 흙이 묻었다\n집에서 이름을 부르는 소리가 나서야\n우리는 경기를 끝냈다","part":0},{"number":13,"title":"소꿉놀이 마당","text":"담장 아래 납작한 돌이 밥상이었다\n풀잎은 나물이고 모래는 쌀이었다\n아이들은 서로 엄마 아빠가 되어\n없는 반찬도 넉넉히 차렸다\n비가 한 방울 떨어지자\n우리의 작은 집도 문을 닫았다\n그날 배운 가장 큰 놀이는\n서로에게 자리를 내어 주는 일이었다","part":0},{"number":14,"title":"개울가 징검돌","text":"소를 먹이고 돌아오는 길\n나는 개울의 돌을 하나씩 밟았다\n물속 피라미가 번쩍 지나가면\n한참을 들여다보다 늦게 돌아왔다\n누군가 건너편에서 손짓했다\n해가 진다 어서 와라\n그 목소리가 지금도\n마음속 저녁길을 건너온다","part":0},{"number":15,"title":"초가집 굴뚝 연기","text":"해거름 들판에 서면\n집집마다 굴뚝에서 연기가 올랐다\n연기는 서로 다른 지붕에서 나와\n같은 저녁하늘에 섞였다\n우리 집 연기를 찾는 일은 쉬웠다\n그 아래에 어머니가 계셨으니까\n멀리 나와 살아도\n나는 저녁마다 그 연기를 찾는다","part":0},{"number":16,"title":"가을걷이 날","text":"벼가 노랗게 익으면\n온 식구가 논으로 나갔다\n아버지가 벼를 베고\n어머니가 볏단을 묶었다\n나는 작고 가벼운 것을 날랐다\n저녁노을이 논 끝에 닿을 때\n서로의 얼굴에도\n잘 익은 가을빛이 남았다","part":0},{"number":17,"title":"감나무 아래 평상","text":"가을이면 마당 감나무가 붉어졌다\n높은 가지에는 새들이 먼저 앉았다\n나는 평상에 누워\n감 하나 떨어지기를 기다렸다\n바람이 불면 잎부터 내려왔다\n기다림도 놀이가 되던 시절\n그 나무는 해마다\n우리에게 느린 가을을 주었다","part":0},{"number":18,"title":"눈길의 책가방","text":"눈 내린 아침 학교 가는 길\n발자국마다 작은 우물이 생겼다\n책가방을 등에 단단히 메고\n친구와 앞서거니 뒤서거니 걸었다\n손끝이 빨갛게 얼어도\n입에서는 하얀 웃음이 나왔다\n눈길은 멀었지만\n교실에 닿으면 금세 봄이었다","part":0},{"number":19,"title":"어머니의 호미","text":"어머니는 밭고랑에 앉아\n작은 풀까지 하나하나 뽑으셨다\n나는 옆에서 흙을 고르다\n자꾸 하늘을 올려다보았다\n어머니는 일하다 말고\n저 구름 예쁘지 않니 하셨다\n농사일뿐인 줄 알았던 하루에\n어머니는 하늘도 심어 두셨다","part":0},{"number":20,"title":"고향의 별","text":"전깃불이 일찍 꺼지던 밤\n마당에는 별이 쏟아졌다\n나는 아버지 곁에 앉아\n북두칠성을 손가락으로 셌다\n어른이 되면 어디까지 갈까\n별들은 아무 대답도 하지 않았다\n다만 돌아갈 길을 잊지 말라고\n오래도록 반짝여 주었다","part":0},{"number":21,"title":"대명동 첫 등굣길","text":"고등학교에 가던 아침\n대명동 길은 낯설고 분주했다\n버스 창가에 앉아 교복 깃을 고치면\n거리의 간판들이 빠르게 지나갔다\n도시가 아직 어색했지만\n교문 앞 친구의 인사 한마디에\n나는 조금씩 그곳 사람이 되었다","part":1},{"number":22,"title":"교실 맨 뒷자리","text":"창가 맨 뒷자리에서\n나는 운동장의 은행나무를 보았다\n칠판에는 어려운 문제가 가득하고\n마음은 자꾸 운동장으로 달아났다\n그때 적어 둔 짧은 문장 하나\n세월을 건너 오늘의 시가 된다\n공부보다 오래 남는 것은\n가끔 창밖을 바라보던 마음이다","part":1},{"number":23,"title":"대명동 저녁 버스","text":"자율학습을 마친 밤\n버스 정류장에 학생들이 모였다\n손에는 책가방 하나\n가슴에는 말 못 할 꿈이 하나\n멀리서 버스 불빛이 다가오면\n우리는 다시 내일을 생각했다\n젊은 날의 집은\n늦은 버스가 데려다주던 곳이었다","part":1},{"number":24,"title":"시험 끝난 날","text":"마지막 시험지를 내고 나오자\n바람이 먼저 나를 맞았다\n친구들과 골목 분식집에 앉아\n뜨거운 국물을 나눠 먹었다\n점수는 아직 몰랐지만\n웃음은 이미 만점이었다\n그날의 떡볶이 맛이\n오래도록 청춘의 맛으로 남았다","part":1},{"number":25,"title":"친구의 낡은 공책","text":"친구가 빌려 준 공책에는\n모서리마다 작은 글씨가 있었다\n어려운 문제 옆에\n괜찮아 다시 해 봐\n나는 답보다 그 말을 먼저 읽었다\n오랜 뒤 공책은 없어졌지만\n누군가를 일으키는 문장은\n아직 내 안에 남았다","part":1},{"number":26,"title":"대학 가는 아침","text":"처음 대학으로 향하던 날\n버스 유리창에 얼굴을 비췄다\n어제의 학생과 내일의 어른이\n한 창에 함께 앉아 있었다\n익숙한 골목은 뒤로 물러나고\n새로운 길이 천천히 열렸다\n나는 창밖을 보며\n낯선 하루를 좋아하기로 했다","part":1},{"number":27,"title":"화실의 오후","text":"대학 화실에는 물감 냄새가 났다\n친구들은 각자의 빛을 캔버스에 놓았다\n나는 창가에 앉아\n빗물 고인 화분을 그렸다\n잘 그린 그림보다 오래 남은 것은\n같은 빛을 서로 다르게 보던 눈\n그때부터 세상은\n끝없이 펼쳐진 그림책이었다","part":1},{"number":28,"title":"붓을 씻는 저녁","text":"붓 끝에 남은 파란 물감이\n물통 속에서 천천히 풀렸다\n오늘 그린 하늘은 마음에 들지 않았다\n그래도 물통의 작은 파문은 예뻤다\n완벽하지 않은 하루에도\n남겨 둘 빛은 있다는 것\n나는 붓을 씻으며\n그 쉬운 사실을 배웠다","part":1},{"number":29,"title":"봉덕동 첫 살림","text":"대학을 졸업한 뒤\n봉덕동 골목에 새 하루를 놓았다\n저녁이면 시장에서 장을 보고\n작은 방 창문을 열었다\n가까운 집들의 불빛이 하나둘 켜졌다\n낯선 도시가 아니라\n내가 오래 살아갈 동네임을\n그때부터 조금씩 알았다","part":1},{"number":30,"title":"봉덕동 아침 시장","text":"장바구니를 들고 시장에 나가면\n채소에 아직 물방울이 맺혀 있다\n상인은 덤 한 줌을 얹어 주고\n골목에는 따뜻한 빵 냄새가 돈다\n큰일 없는 아침이지만\n나는 이런 아침이 좋다\n살아 있다는 말이\n시장 골목마다 가득하기 때문이다","part":1},{"number":31,"title":"학교 종소리","text":"교실 문을 열면\n서른 개의 눈빛이 나를 보았다\n잘 그려지지 않는 선 앞에서\n아이들은 몇 번이고 지우개를 썼다\n나는 조금 기다려 주었다\n하나의 선에도 시간이 필요한 법\n그 아이들이 가르쳐 준 인내가\n지금 내 시의 여백이 되었다","part":1},{"number":32,"title":"분필 가루","text":"수업이 끝난 교실\n칠판 아래 분필 가루가 쌓였다\n아이들이 떠난 책상 위에는\n못다 한 질문 하나가 남았다\n나는 창문을 열어 바람을 들였다\n가르친 날보다 배운 날이 많았다\n흰 가루가 햇빛에 떠오르며\n작은 별처럼 반짝였다","part":1},{"number":33,"title":"퇴근길 신천교","text":"해 질 무렵 신천교를 건너면\n강물은 말없이 하루를 접었다\n버스와 자동차는 바쁘게 지나가고\n물가에는 새 한 마리가 남았다\n오늘의 피로를 강물에 놓아 두고\n나는 봉덕동 집으로 걸었다\n내일도 같은 길이 있다는 것\n그것만으로 마음이 놓였다","part":1},{"number":34,"title":"골목의 세탁물","text":"봉덕동 좁은 골목 빨랫줄에\n흰 셔츠가 바람을 받았다\n어느 집에서는 된장국 냄새가 나고\n어느 집에서는 아이가 웃었다\n서로 이름을 몰라도\n저녁마다 같은 하늘을 나누었다\n도시는 높이 자라지만\n사람의 하루는 골목에서 익었다","part":1},{"number":35,"title":"비 오는 창가","text":"창문을 두드리는 비를 보며\n따뜻한 차 한 잔을 마셨다\n시골 지붕에 듣던 빗소리와\n봉덕동 창가의 빗소리는 달랐다\n그런데 눈을 감으면\n어머니가 부엌에서 움직이셨다\n비는 어디에 내려도\n잊은 사람을 데려오는 모양이다","part":1},{"number":36,"title":"오래된 이발소","text":"동네 이발소 거울 앞에 앉으면\n흰머리가 먼저 눈에 들어온다\n가위 소리가 귀 곁에서 지나고\n오래된 로션 냄새가 난다\n거울 속 얼굴을 바라보다\n나는 아버지의 이마를 떠올린다\n세월은 조용히 찾아와\n닮고 싶은 사람을 닮게 한다","part":1},{"number":37,"title":"봉덕동 가로등","text":"밤이 깊은 골목에\n가로등 하나가 불을 켠다\n늦게 돌아오는 사람의 발끝을\n끝까지 비추어 준다\n나는 그 불빛 아래서 잠시 선다\n누구나 어두운 길을 걷는 날이 있다\n그럴 때 작은 빛 하나면\n집까지 걸어갈 수 있다","part":1},{"number":38,"title":"첫눈 오는 골목","text":"봉덕동 지붕 위에 첫눈이 내렸다\n차가운 난간에도 하얀 꽃이 피었다\n골목을 건너는 발자국 하나\n눈 위에 또렷이 남았다\n나는 어릴 적 운동장으로 돌아간 듯\n괜히 발을 크게 내디뎠다\n나이가 들어도 첫눈 앞에서는\n마음이 먼저 어린아이가 된다","part":1},{"number":39,"title":"사진첩의 빈자리","text":"오래된 가족사진을 펼친다\n사진 속 어머니는 젊고\n아버지는 웃고 계신다\n나는 그 옆에 서 있는 작은 아이\n지금은 모일 수 없는 사람들도\n한 장의 사진 안에서는 함께 있다\n책장을 덮은 뒤에도\n그 웃음은 오래 곁에 머문다","part":1},{"number":40,"title":"봉덕동에서 고산골까지","text":"아침마다 신발끈을 고쳐 묶고\n봉덕동 길을 나선다\n집과 시장과 학교가 지나온 자리에\n앞산의 푸른 능선이 보인다\n멀리 떠나지 않아도 좋다\n내 하루가 자라는 길이\n지금도 이 동네에 있으니","part":1},{"number":41,"title":"고산골 첫걸음","text":"봉덕동 집을 나와\n고산골 오르는 길에 들어선다\n도시 소음이 조금씩 멀어지고\n나무 사이로 바람이 지나간다\n나는 늘 같은 길을 걷지만\n어제와 같은 나뭇잎은 없다\n산책은 익숙한 곳에서\n새로운 하루를 만나는 일이다","part":2},{"number":42,"title":"메타세쿼이아 길","text":"키 큰 메타세쿼이아가\n길 양쪽에서 하늘을 받친다\n발밑에는 오래된 잎이 쌓이고\n머리 위에는 새잎이 흔들린다\n나는 가운데 길을 천천히 걷는다\n나무들은 말없이 서 있지만\n그 사이를 지나면\n마음이 곧게 펴진다","part":2},{"number":43,"title":"고산골 봄꽃","text":"언 땅이 풀리고\n산길 가장자리 작은 꽃이 피었다\n사람들은 큰 벚꽃나무를 올려다보지만\n나는 발밑의 보랏빛 꽃을 본다\n누구도 심지 않은 자리에서\n자기 몫의 봄을 피운 꽃\n그 앞에서 나도\n조금 더 천천히 걷는다","part":2},{"number":44,"title":"진달래 피는 언덕","text":"고산골 언덕에 진달래가 피었다\n멀리서 보면 산이 붉게 웃는다\n가까이 가면 가는 꽃잎마다\n찬바람을 견딘 자국이 있다\n봄은 따뜻해서 오는 줄 알았는데\n추위를 지나온 꽃이 먼저 알려 준다\n기다린 시간만큼\n빛은 더 깊어진다는 것을","part":2},{"number":45,"title":"목련이 지는 날","text":"하얀 목련이 한꺼번에 피더니\n며칠 만에 길에 꽃잎을 놓았다\n아름다운 날은 왜 짧을까\n나는 떨어진 꽃잎을 밟지 않고 걷는다\n꽃은 나무 위에 있을 때도\n흙 위에 누울 때도 꽃이다\n한 계절의 끝에서\n다음 계절이 자라고 있었다","part":2},{"number":46,"title":"법장사 풍경소리","text":"법장사 처마 끝에서\n작은 풍경이 바람을 불렀다\n나는 계단 아래 서서\n그 맑은 소리를 들었다\n서둘러 오르던 마음이 멈추고\n멀리 새소리까지 가까워졌다\n산에서 내려올 때\n내 걸음도 조금 조용해졌다","part":2},{"number":47,"title":"약수터의 바가지","text":"약수터에 차가운 물이 솟았다\n작은 바가지가 물 위에 떠 있었다\n먼저 온 사람이 한 모금 마시고\n다음 사람에게 자리를 비켜 주었다\n산에서 가장 맑은 것은\n물만이 아니었다\n서로 먼저 마시라 손짓하는\n그 짧은 인사도 맑았다","part":2},{"number":48,"title":"바위의 초록 이끼","text":"계곡 바위에는 이끼가 자란다\n차가운 그늘에서도\n초록빛을 잃지 않고 자란다\n나는 손대지 않고 바라본다\n작은 생명은 조용히\n돌의 긴 시간을 덮어 간다\n크게 소리 내지 않아도\n살아 있다는 것은 분명하다","part":2},{"number":49,"title":"계곡의 물소리","text":"고산골 계곡에 귀를 기울인다\n물은 돌을 만나 돌아가고\n좁은 곳에서는 노래를 높인다\n나는 작은 다리 위에 서서\n한참을 물소리를 듣는다\n막힌 길을 탓하지 않고\n다른 길을 찾는 물\n오늘은 그 물에게 길을 배운다","part":2},{"number":50,"title":"여름 매미","text":"한여름 고산골 숲\n매미가 온 산을 흔들어 놓는다\n보이지 않는 작은 몸들이\n이토록 큰 소리를 낸다\n나는 그늘 아래 앉아 땀을 식힌다\n매미에게는 지금이\n오래 기다려 만난 여름일 것이다\n그래서 저렇게 힘껏 노래할 것이다","part":2},{"number":51,"title":"소나기 지나간 산길","text":"갑자기 소나기가 쏟아졌다\n나뭇잎들이 굵은 빗방울을 받았다\n비가 그치자 숲은 더 푸르게 젖고\n흙에서는 진한 냄새가 올라왔다\n나는 젖은 신발을 내려다본다\n돌아갈 길은 조금 미끄럽지만\n비를 맞은 오늘의 산을\n오래 기억할 것 같다","part":2},{"number":52,"title":"앞산의 안개","text":"이른 아침 앞산에 안개가 걸렸다\n먼 능선은 보이지 않고\n가까운 소나무만 서 있었다\n나는 보이는 길만큼 걸었다\n안개는 조금씩 옅어지고\n나무 뒤로 햇살이 나왔다\n앞이 다 보이지 않아도\n한 걸음은 언제나 내 앞에 있다","part":2},{"number":53,"title":"고산골 쉼터","text":"나무 의자에 앉아 물을 마신다\n등산객이 지나가며 인사한다\n처음 보는 얼굴인데도\n같은 길을 걸었다는 이유로 반갑다\n바람이 이마의 땀을 식히고\n발끝에는 햇빛이 내려온다\n산은 우리에게\n잠시 쉬어 갈 자리도 내어 준다","part":2},{"number":54,"title":"청설모의 아침","text":"소나무 가지가 갑자기 흔들렸다\n청설모 한 마리가 건너뛰었다\n작은 발톱으로 나무를 붙잡고\n높은 곳으로 금세 올라갔다\n나는 잠시 발을 멈췄다\n이 숲은 산책하는 내 길이면서\n작은 생명들이 살아가는\n소중한 집이기도 하다","part":2},{"number":55,"title":"가을 단풍길","text":"고산골 길이 붉게 물들었다\n나무들은 한 해 동안 모은 빛을\n마지막 잎에 모두 쏟아 놓았다\n나는 천천히 걸으며\n붉은 잎 하나를 눈에 담았다\n아름다운 것은 잡아 두기보다\n오래 바라보는 편이 좋다\n바람이 그 말을 대신했다","part":2},{"number":56,"title":"낙엽 한 장","text":"갈색 낙엽이 내 발 앞에 떨어졌다\n조금 전까지 나무에 매달렸던 잎\n나는 그 곁에 잠시 서 있었다\n떠날 때가 되면\n바람에 몸을 맡기는 잎\n가을은 끝이라고 말하지 않는다\n떨어진 자리에도\n새봄이 올 것을 알고 있다","part":2},{"number":57,"title":"고산골 낮달","text":"나무 사이로 낮달이 떠 있었다\n햇살 아래 희미한 하얀 얼굴\n나는 걸음을 멈추고 올려다본다\n어릴 적 아버지와 보던 그 달\n멀리 떠난 사람도\n같은 하늘 아래 있을 것만 같다\n산길은 고요하고\n달빛보다 그리움이 먼저 밝아졌다","part":2},{"number":58,"title":"겨울 숲의 발자국","text":"눈 내린 고산골 길에는\n아직 아무 발자국도 없었다\n나는 천천히 첫걸음을 내디뎠다\n뒤돌아보니 발자국들이 이어졌다\n어려운 날도 이와 같을 것이다\n한 번에 먼 길을 갈 수는 없어도\n한 걸음씩 쌓이면\n뒤에 길 하나가 남는다","part":2},{"number":59,"title":"산새가 깨우는 아침","text":"고산골 아침은 새가 먼저 연다\n작은 지저귐 하나에\n잠든 나무들이 깨어나는 듯하다\n나는 휴대전화를 주머니에 넣고\n그 소리를 가만히 듣는다\n오늘 처음 들리는 노래인데\n어쩐지 오래 알고 지낸\n이웃의 인사처럼 반갑다","part":2},{"number":60,"title":"산에서 내려오는 길","text":"산을 오를 때는 정상만 생각했다\n내려올 때는 작은 꽃이 보였다\n바위에 고인 물과\n어깨를 스치는 풀잎도 보였다\n오를 때 놓친 것들이\n돌아오는 길에 말을 걸었다\n인생도 가끔은\n천천히 내려와야 보이는 것이 있다","part":2},{"number":61,"title":"신천의 아침 오리","text":"신천 물가에 오리들이 모였다\n물살을 따라 나란히 헤엄치고\n가끔 머리를 물속에 넣는다\n나는 다리 위에서 한참을 바라본다\n누가 먼저 가자고 하지 않아도\n오리들은 서로를 기다린다\n함께 가는 길에는\n서두를 까닭이 없는가 보다","part":3},{"number":62,"title":"흰 백로 한 마리","text":"얕은 물에 백로 한 마리가 섰다\n흰 깃털은 아침빛을 받아 빛났다\n차들은 다리 위로 바쁘게 달리지만\n백로는 긴 다리를 움직이지 않는다\n물고기가 가까이 오기를 기다리는 새\n나는 그 곁을 지나며\n기다림에도\n저마다의 깊이가 있음을 배운다","part":3},{"number":63,"title":"왜가리의 긴 그림자","text":"왜가리가 물가를 천천히 걸었다\n회색 날개 아래 긴 그림자가 따라갔다\n나는 그 새가 날아오르기를 기다렸다\n하지만 왜가리는 서두르지 않았다\n바람이 오고 물결이 멈춘 뒤\n커다란 날개를 펼쳤다\n날아갈 때를 아는 새에게\n강은 넓은 길이 되었다","part":3},{"number":64,"title":"물고기의 방향","text":"물속 작은 물고기들이\n햇빛을 따라 반짝이며 움직였다\n흐르는 물에 몸을 맡기는 듯하다가\n순식간에 방향을 바꾸었다\n나는 난간에 기대어 생각했다\n물살이 센 날에도\n제 길을 찾는 작은 몸\n살아가는 힘은 크기로 정해지지 않는다","part":3},{"number":65,"title":"잉어가 오르는 물","text":"신천의 잔잔한 곳에\n커다란 잉어가 모습을 드러냈다\n느린 꼬리짓 하나에\n둥근 물결이 멀리 번졌다\n나는 잉어가 지나간 자리를 본다\n잠시 흔들리던 물은 다시 고요하다\n하루의 소란도 언젠가는\n이렇게 잠잠해질 것이다","part":3},{"number":66,"title":"물비늘","text":"햇살이 신천 위에 쏟아졌다\n물결마다 작은 빛이 반짝였다\n손으로 잡으려 하면 사라질 빛\n나는 바라보는 것만으로 좋았다\n물은 아무것도 가지지 않아도\n하루 종일 빛을 나누었다\n나도 누군가에게\n작은 반짝임 하나 건네고 싶다","part":3},{"number":67,"title":"버드나무 아래","text":"신천 둔치 버드나무가\n긴 가지를 물 쪽으로 내렸다\n바람이 불 때마다\n물 위에 초록 인사를 건넸다\n나는 나무 그늘에 앉아\n지나가는 사람들을 바라보았다\n바쁜 하루 한가운데에도\n이렇게 쉬어 갈 그늘이 있다","part":3},{"number":68,"title":"강가의 돌멩이","text":"신천 가장자리 작은 돌 하나\n오랜 물살에 모서리가 둥글었다\n나는 돌을 집어 들었다가\n다시 물가에 내려놓았다\n거친 시간이 지나면\n마음도 이렇게 부드러워질까\n물소리가 대답 대신\n돌을 조용히 적셨다","part":3},{"number":69,"title":"비 온 뒤 신천","text":"밤새 비가 내린 다음 날\n신천의 물소리가 커졌다\n흙빛 물결이 빠르게 흘렀고\n오리들은 조용한 곳으로 옮겨 갔다\n나는 다리 위에 서서\n변한 강의 얼굴을 보았다\n같은 길을 흐르면서도\n강은 날마다 다른 하루를 산다","part":3},{"number":70,"title":"저녁 강물","text":"저녁노을이 신천을 붉게 물들였다\n산책하던 사람들은 집으로 돌아가고\n한 마리 새가 늦게 날아갔다\n나는 마지막 햇살을 바라본다\n오늘 한 일보다\n고마웠던 얼굴이 먼저 떠오른다\n강물은 말없이\n그 얼굴들을 데리고 흐른다","part":3},{"number":71,"title":"주리못 가는 길","text":"가창 길을 따라 주리못으로 간다\n산이 가까워질수록 바람이 맑다\n못둑에 닿으면 물이 먼저 반긴다\n오래 보아 온 풍경인데도\n오늘은 다른 구름이 떠 있다\n나를 다시 오게 하는 것은\n큰 구경거리가 아니라\n날마다 달라지는 이 작은 하늘이다","part":3},{"number":72,"title":"핑크빛 빈 벤치","text":"주리못가 핑크빛 벤치에\n아무도 앉아 있지 않았다\n바람이 먼저 앉아 쉬고\n햇살이 빈자리를 채웠다\n나는 잠시 그 곁에 섰다\n누군가 오기를 기다리는 자리처럼\n벤치는 물 쪽을 향해 있었다\n기다림도 풍경이 되는 오후였다","part":3},{"number":73,"title":"빈 돛배","text":"못가에 작은 돛배가 매여 있었다\n바람은 오는데 배는 떠나지 않았다\n물 위로 구름만 천천히 흘렀다\n나는 배를 오래 바라보았다\n멀리 가지 않는 날에도\n하늘을 실을 수 있다는 듯\n빈 배는 고요히\n못물 한가운데를 바라보았다","part":3},{"number":74,"title":"주리못의 봄비","text":"봄비가 주리못 수면에 떨어졌다\n동그란 물결이 셀 수 없이 피었다\n멀리 산은 안개에 가려지고\n못가의 새싹은 더 선명해졌다\n나는 우산 아래 서서\n젖은 봄의 냄새를 맡았다\n비는 지나가지만\n나뭇잎에는 새 계절이 남는다","part":3},{"number":75,"title":"여름 못의 잠자리","text":"햇빛이 뜨거운 오후\n잠자리 한 마리가 물 위를 낮게 날았다\n물가 풀잎에 잠시 앉았다가\n다시 푸른 바람 속으로 사라졌다\n나는 벤치에 앉아 땀을 식혔다\n짧은 날갯짓에도\n여름 한가운데를 사는\n작은 기쁨이 가득했다","part":3},{"number":76,"title":"가을 억새","text":"주리못둑에 억새가 피었다\n은빛 이삭들이 바람에 몸을 기울였다\n멀리서 보면 물결이 땅 위로 올라온 듯하다\n나는 그 사이를 천천히 걸었다\n한 해 동안 키운 마음을\n바람 앞에 풀어놓는 억새\n가을은 떠나는 계절이면서\n가장 환하게 빛나는 계절이다","part":3},{"number":77,"title":"못물에 든 구름","text":"구름 하나가 주리못에 내려왔다\n하늘에는 그대로 떠 있는데\n물속에도 똑같은 얼굴이 있었다\n나는 어느 쪽이 진짜인지 묻지 않았다\n구름은 두 곳에서 모두 아름다웠다\n사람도 누군가의 마음속에\n이렇게 다른 모습으로\n살아가고 있을지 모른다","part":3},{"number":78,"title":"단풍잎의 여행","text":"붉은 단풍잎 하나가\n주리못 위에 조용히 내려앉았다\n작은 배가 된 잎은\n바람이 미는 대로 천천히 떠났다\n나는 끝까지 눈으로 따라갔다\n나무를 떠난 뒤에도\n잎에게는 또 다른 길이 있었다\n이별이 끝만은 아니라는 듯","part":3},{"number":79,"title":"물가의 첫서리","text":"겨울 아침 주리못둑\n풀잎 끝에 하얀 서리가 앉았다\n밤새 누가 다녀갔는지\n발자국 없이 반짝이는 흔적\n나는 손을 주머니에 넣고 걷는다\n찬 공기가 뺨을 스치지만\n못물은 아직 천천히 흐른다\n겨울에도 멈추지 않는 시간이 있다","part":3},{"number":80,"title":"주리못의 낮달","text":"한낮 주리못 위로 흰달이 떴다\n하늘에 하나 물속에 하나\n바람이 불자 물속 달이 흔들렸다\n나는 오래도록 그 모습을 보았다\n어릴 적 시골 하늘에서 보던 달\n아버지와 어머니의 목소리가\n물결 사이로 돌아오는 듯했다\n먼 그리움이 가까워지는 오후였다","part":3},{"number":81,"title":"명도재의 아침","text":"명도재 창문을 열면\n앞산에서 내려온 바람이 들어온다\n책상에는 책과 연필이 놓여 있고\n어제 쓰던 시가 기다리고 있다\n나는 따뜻한 차를 한 잔 따른다\n새로운 하루를 시작하는 데\n거창한 준비는 필요 없다\n창밖의 빛을 먼저 바라보면 된다","part":4},{"number":82,"title":"연필을 깎는 시간","text":"연필 끝을 천천히 깎는다\n나무 향이 손끝에 남는다\n하얀 종이 위에 첫 문장을 적었다가\n지우개로 조용히 지운다\n잘 쓰는 것보다 중요한 것은\n오늘도 다시 써 보는 일\n짧아진 연필만큼\n내 하루에는 문장이 남는다","part":4},{"number":83,"title":"책갈피의 인공지능","text":"새로 산 인공지능 책을 펼친다\n낯선 말들이 페이지마다 놓여 있다\n나는 모르는 단어에 밑줄을 긋고\n하나씩 천천히 뜻을 찾는다\n나이가 들어도\n처음 배우는 것은 가슴을 뛰게 한다\n책장을 넘기는 소리가\n새 길을 여는 발소리 같다","part":4},{"number":84,"title":"바이브코딩 첫 화면","text":"명도재 작은 모니터에\n하얀 화면 하나가 켜졌다\n하고 싶은 일을 말로 적자\n빈 화면에 버튼이 생겨났다\n나는 신기해서 몇 번을 눌러 보았다\n상상한 것을 눈앞에 놓는 일\n어린 시절 흙으로 집을 짓던 놀이가\n이제 빛나는 화면에서 이어진다","part":4},{"number":85,"title":"어린이 퀴즈 앱","text":"세 문제를 맞히면 별이 뜨는\n작은 학습 게임을 만들었다\n정답을 누른 아이가 웃을 생각에\n나는 설명을 한 번 더 고쳤다\n기계는 답을 빠르게 보여 주지만\n배우는 기쁨은 사람의 것이다\n작은 별 하나에도\n아이의 내일이 반짝인다","part":4},{"number":86,"title":"시를 쓰는 앱","text":"화면에 아이가 한 줄을 적는다\n오늘 비가 왔어요\n나는 어디에 비가 왔는지 묻고 싶다\n운동장일까 집 앞 골목일까\n아이의 눈이 본 풍경을 듣고 싶다\n기계가 문장을 도와주어도\n그 비를 맞은 마음은\n오직 아이만이 쓸 수 있다","part":4},{"number":87,"title":"비행기 게임을 만들며","text":"모니터 속 작은 비행기가\n푸른 하늘을 날아간다\n나는 방향 버튼을 눌러 보고\n속도가 너무 빠르면 다시 고친다\n실패해도 괜찮다\n어린 날 운동장에서 공을 차듯\n몇 번 넘어져 보는 동안\n게임도 나도 조금씩 배운다","part":4},{"number":88,"title":"우주를 배우는 아이","text":"아이들을 위한 별자리 화면에\n작은 별들이 하나씩 켜진다\n멀리 있는 별 이름을 누르면\n짧은 설명이 나타난다\n나는 시골 마당의 밤을 떠올린다\n아버지와 함께 세던 북두칠성\n그 하늘이 이제\n아이의 손바닥에 내려왔다","part":4},{"number":89,"title":"곤충이 사는 화면","text":"게임 속 나비가 꽃 위에 앉는다\n아이들은 날개를 보고 이름을 맞힌다\n나는 고산골에서 본 나비를 생각한다\n화면으로 배우는 것도 좋지만\n언젠가는 아이들이 숲으로 나가\n진짜 꽃과 바람을 만나기를\n작은 게임이\n큰 세상으로 가는 문이기를","part":4},{"number":90,"title":"물방울의 여행","text":"물방울 하나가 구름을 떠나\n산과 강을 지나 바다로 간다\n어린이 과학 화면을 만들다가\n나는 신천의 물결을 떠올린다\n책에서 배운 물의 순환이\n산책길에서는 살아 움직인다\n공부는 교실에서 시작해도\n세상에서 다시 자란다","part":4},{"number":91,"title":"컴퓨터가 잠든 밤","text":"밤이 깊자 모니터를 껐다\n검은 화면에 내 얼굴이 비쳤다\n오늘은 많은 버튼을 만들었지만\n기억나는 것은 고산골의 꽃 한 송이\n나는 책상에서 일어나 창문을 열었다\n바깥에는 진짜 바람이 불었다\n기술을 배우는 날에도\n마음은 자연에서 쉬고 싶다","part":4},{"number":92,"title":"신문 칼럼의 첫 줄","text":"아침 신문을 펼치고\n세상 소식에 오래 눈을 둔다\n교육과 인공지능을 생각하며\n첫 문장을 천천히 적는다\n큰 목소리보다 정확한 말이 좋다\n누군가를 꾸짖기보다\n함께 나아갈 길을 찾는 글\n그런 한 줄을 쓰고 싶다","part":4},{"number":93,"title":"아이와 인공지능","text":"아이에게 정답을 모두 알려 주면\n스스로 찾는 길이 짧아질까\n나는 모니터 앞에서 생각한다\n묻고 고르고 다시 해 보는 시간\n그 시간이 아이를 자라게 한다\n인공지능은 좋은 길잡이가 될 수 있지만\n길 위에서 걸어야 하는 사람은\n언제나 아이 자신이다","part":4},{"number":94,"title":"새로운 교실","text":"오래전 교실에는 칠판이 있었고\n지금은 작은 화면이 놓였다\n도구는 많이 달라졌지만\n궁금한 것을 묻는 눈빛은 같다\n나는 그 눈빛을 떠올리며\n오늘도 새로운 수업을 꿈꾼다\n배움의 주인은\n언제나 사람이라는 것을 잊지 않는다","part":4},{"number":95,"title":"산책 뒤의 한 문장","text":"고산골을 돌아와 신발을 벗는다\n흙 묻은 바닥을 털고\n책상 앞에 다시 앉는다\n산길에서 본 이끼와 꽃과 새\n그 모습을 천천히 적는다\n한 편의 시가 멀리 있는 것은 아니다\n오늘 내 발이 지나온 길에\n이미 첫 문장이 놓여 있다","part":4},{"number":96,"title":"사진 한 장의 시","text":"신천 물가에서 백로를 찍었다\n하얀 새는 물속 그림자를 바라본다\n사진을 확대하다 보니\n내가 보지 못했던 물결이 보였다\n한 장의 사진이 질문을 건넨다\n저 새는 무엇을 기다릴까\n그 물음이 시가 되어\n늦은 오후 책상 위에 앉는다","part":4},{"number":97,"title":"노래가 되는 시","text":"짧은 시에 멜로디를 붙였다\n화면에서 노랫소리가 흘러나왔다\n어린 시절 들녘에서 부르던 노래와\n모양은 많이 달라졌지만\n누군가의 마음을 움직이고 싶은 뜻은 같다\n나는 조용히 다시 들으며\n시가 걸어서 가지 못한 곳에\n노래가 닿기를 바랐다","part":4},{"number":98,"title":"낯선 것을 배우는 나이","text":"새 프로그램을 열다가\n어제 배운 버튼을 또 잊었다\n처음부터 다시 눌러 보고\n작은 실수에 웃었다\n나무도 해마다 새잎을 내는데\n사람이라고 배우기를 멈출까\n내 책상에는 오늘도\n작은 봄 하나가 자라고 있다","part":4},{"number":99,"title":"명도재의 저녁 창","text":"해가 지면 명도재 창이 노랗게 빛난다\n책을 덮고 창밖 산을 본다\n어릴 적 고향 들에서 시작한 길이\n대명동과 봉덕동을 지나 여기까지 왔다\n돌아보면 길마다 누군가 있었다\n부모님과 친구와 아이들\n그 얼굴들이 저녁 창에\n한 송이씩 불빛으로 피어난다","part":4},{"number":100,"title":"백 번째 하늘","text":"주리못에 낮달이 떠 있다\n물 위에는 구름이 느리게 지나간다\n나는 한참을 바라보다\n고향의 들길을 떠올린다\n소를 몰던 아이가 어른이 되어\n오늘도 같은 하늘 아래 걷는다\n백 번의 계절이 지나도\n새로운 하루는 다시 시작된다","part":4}],"intro":"시골에서 소를 몰고 풀을 베던 소년은 대명동에서 공부하고 봉덕동에 살며 고산골을 걷는 어른이 되었습니다. 논과 운동장, 신천과 주리못, 작은 꽃과 새가 들려준 이야기를 쉬운 말로 적었습니다. 어려운 낱말보다 우리 곁의 사물에 귀 기울이며, 한 편을 읽고 나면 자신의 하루가 떠오르는 시집이 되기를 바랍니다.","after":"백 편의 시를 쓰는 동안 다시 만난 것은 거창한 풍경이 아니라 소의 느린 발걸음, 어머니의 호미, 운동장의 흙먼지, 신천의 오리와 고산골의 매미 소리였습니다. 어제의 고향이 오늘의 산책길과 만나고, 오래된 기억은 새로운 문장이 되었습니다."}</script>
<script>
(()=>{'use strict';const B=JSON.parse(document.getElementById('bookData').textContent), mobile=window.matchMedia('(max-width:720px)');const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let pages=[],position=0,animating=false,utter=null,paused=false;const step=()=>mobile.matches?1:2;
function cover(){return `<div class="cover"><div class="seal">明道</div><div class="small">明道齋 · 명도재 이명우 제2집</div><h1>${escape(B.title)}</h1><p>${escape(B.subtitle)}</p><div class="author-bottom">${escape(B.author)} 지음</div><div class="publisher">명도재 시문학사 · 2026</div></div>`}
function poemPage(p){return `<section class="poem"><div class="page-top"><span>제${p.part+1}부 · ${escape(B.parts[p.part].title)}</span><span>POEM ${String(p.number).padStart(3,'0')} / 100</span></div><div class="sep"></div><h2 class="poem-title">${escape(p.title)}</h2><div class="author">이명우</div><div class="verse">${escape(p.text)}</div><div class="poem-bottom"><span>명도재 제2집</span><span>${String(p.number).padStart(3,'0')}</span></div></section>`}
function partPage(part){return `<section class="divider-page"><div class="eyebrow">PART ${String(part.number).padStart(2,'0')} · ${String((part.number-1)*20+1).padStart(3,'0')}—${String(part.number*20).padStart(3,'0')}</div><div class="symbol">❧</div><h2>${escape(part.title)}</h2><p>${escape(part.subtitle)}</p><div class="symbol">⌁</div></section>`}
function prosePage(title,content,label){return `<section class="prose-page"><div class="label">${label}</div><h2>${escape(title)}</h2><p>${escape(content)}</p></section>`}
function tocPage(){return `<section class="toc-page"><div class="page-top">CONTENTS · 차례</div><h2>다섯 갈래의 길</h2>${B.parts.map(p=>`<button type="button" class="toc-part" data-part="${p.number}">제${p.number}부 · ${escape(p.title)}<small>${escape(p.subtitle)} · 20편</small></button>`).join('')}</section>`}
function build(){pages=[{html:cover(),type:'cover'},{html:prosePage('물밑의 돌멩이로 남은 이름들',B.intro,'시인의 말'),type:'intro'},{html:tocPage(),type:'toc'}];for(const part of B.parts){pages.push({html:partPage(part),type:'part',part:part.number});for(const p of B.poems.filter(p=>p.part===part.number-1))pages.push({html:poemPage(p),type:'poem',poem:p})}pages.push({html:prosePage('신천에서 주리못까지 백 개의 물굽이',B.after,'발문'),type:'after'});pages.push({html:`<div class="closing"><p>물 위의 하늘과 물속의 하늘을<br>한 권에 포개어 놓습니다.</p><b>${escape(B.author)}</b></div>`,type:'end'});if(pages.length%2)pages.push({html:'',type:'blank'});$('tocEntries').innerHTML=B.parts.map(part=>`<section class="part-group"><h3>제${part.number}부 · ${escape(part.title)}</h3>`+B.poems.filter(p=>p.part===part.number-1).map(p=>`<button type="button" class="entry" data-poem="${p.number}">${escape(p.title)}<span>${String(p.number).padStart(3,'0')}</span></button>`).join('')+'</section>').join('')}
function pageOfPoem(n){return pages.findIndex(p=>p.poem&&p.poem.number===n)}function goto(index,noAnim=false){index=Math.max(0,Math.min(pages.length-1,index));if(!mobile.matches)index-=index%2;if(index===position)return;stopSpeech();if(noAnim){position=index;render();return}const f=$('flip');animating=true;f.className='flip '+(index<position?'backward':'active');setTimeout(()=>{position=index;f.className='flip';animating=false;render()},490)}
function setLeaf(el,p,n){
 el.innerHTML=p?.html||'';
 el.dataset.page=p?.type==='cover'?'':String(n+1).padStart(2,'0');
 el.dataset.kind=p?.type||'blank';
 if(p?.poem){
  el.dataset.poem=p.poem.number;
  const control=document.createElement('div');control.className='page-read-control';
  const button=document.createElement('button');button.type='button';button.dataset.readPoem=String(p.poem.number);
  button.textContent='▶ 이 페이지 읽기';button.setAttribute('aria-label',p.poem.title+' 이 페이지 읽기');
  control.appendChild(button);el.appendChild(control);
 } else delete el.dataset.poem;
 el.scrollTop=0;
}
function render(){setLeaf($('left'),pages[position],position);setLeaf($('right'),pages[position+1],position+1);$('pageStat').textContent=(position+1)+'–'+Math.min(position+step(),pages.length)+' / '+pages.length;$('prev').disabled=position===0;$('next').disabled=position+step()>=pages.length;$('edge-prev').disabled=position===0;$('edge-next').disabled=position+step()>=pages.length;const hash='#page-'+(position+1);history.replaceState(null,'',hash)}
function toggleToc(v){$('tocOverlay').hidden=!v}
let speechJob=0, currentPoem=null, speakingIndex=0;
function setVoiceStatus(message){$('voiceStatus').textContent=message;updateVoiceButtons()}
function updateVoiceButtons(){
 for(const btn of document.querySelectorAll('[data-read-poem]')){
  const selected=currentPoem&&Number(btn.dataset.readPoem)===currentPoem.number;
  btn.textContent=selected?(paused?'▶ 이어 읽기':'⏸ 일시정지'):'▶ 이 페이지 읽기';
  btn.setAttribute('aria-pressed',selected?'true':'false');
 }
 $('read').textContent=currentPoem?(paused?'▶ 이어 읽기':'⏸ 일시정지'):'▶ 현재 시 낭송';
 $('pause').textContent=paused?'▶ 이어 읽기':'⏸ 일시정지';
}
function stopSpeech(){
 speechJob++;
 if('speechSynthesis' in window){try{window.speechSynthesis.cancel()}catch(_){}}
 utter=null;paused=false;currentPoem=null;speakingIndex=0;
 setVoiceStatus('');
}
function koreanVoice(){
 const voices=window.speechSynthesis.getVoices();
 return voices.find(v=>/^ko([-_]|$)/i.test(v.lang)&&v.localService)||voices.find(v=>/^ko([-_]|$)/i.test(v.lang))||null;
}
function pauseSpeech(){
 if(!currentPoem||!('speechSynthesis' in window))return;
 try{
  if(paused){speechSynthesis.resume();paused=false;setVoiceStatus('낭송 이어 읽기 · '+currentPoem.title)}
  else{speechSynthesis.pause();paused=true;setVoiceStatus('낭송 일시정지 · '+currentPoem.title)}
 }catch(e){setVoiceStatus('이 브라우저에서 음성 조절을 사용할 수 없습니다')}
}
function speakPoem(poem){
 if(!poem)return;
 if(currentPoem&&currentPoem.number===poem.number){pauseSpeech();return}
 stopSpeech();
 if(!('speechSynthesis' in window)){setVoiceStatus('읽어주기를 지원하지 않습니다. 크롬 또는 삼성 인터넷에서 열어 주세요.');return}

 let idx=0;

 const next=()=>{
  if(token!==speechJob||!currentPoem)return;

  const voice=koreanVoice();if(voice)u.voice=voice;
  u.onend=()=>{if(token===speechJob)next()};

  try{window.speechSynthesis.speak(u)}catch(_){if(token===speechJob){stopSpeech();setVoiceStatus('음성 재생을 시작하지 못했습니다')}}
