<script type="application/json" id="bookData">{"title":"낮달이 물밑에 백자 종지를 놓을 때","subtitle":"봉덕동의 기억에서 고산골 산책과 명도재 AI 창작까지","author":"명도재 이명우","parts":[{"number":1,"title":"골목에 남은 따뜻한 이름들","subtitle":"봉덕동 골목과 신천의 따뜻한 기억"},{"number":2,"title":"가족의 밥상과 오래된 시간","subtitle":"어머니의 부엌, 아버지의 들판, 일상의 기억"},{"number":3,"title":"고산골에서 배우는 하루","subtitle":"앞산·법장사·신천을 걷는 산책의 기록"},{"number":4,"title":"주리못이 건네는 계절","subtitle":"주리못·핑크빛 벤치·물새와 하늘"},{"number":5,"title":"명도재, 새로운 길을 쓰다","subtitle":"바이브코딩·인공지능 앱·책·칼럼과 시의 만남"}],"poems":[{"number":1,"title":"봄빛이 머문 자리","text":"봄비 그친 봉덕동 골목\n붉은 벽돌담 위에\n작은 햇살 하나 내려앉았다\n\n젖은 담쟁이잎이 흔들리고\n나는 문득 한 사람을 떠올렸다\n\n아직 이름조차 낯설었지만\n그 사람이 웃던 순간은\n오래된 사진처럼 선명했다\n\n저녁빛이 창문을 넘어오자\n가슴 한쪽에 작은 꽃이 피어났다\n\n그날 골목에 머문 햇살은\n금세 사라졌지만\n내 마음의 봄은 오래도록 지지 않았다","part":0},{"number":2,"title":"사진 속에 남은 봄","text":"오래된 서랍을 열다가\n빛바랜 사진 한 장을 꺼냈다\n\n봉덕동 작은 사진관\n어깨를 나란히 하고 웃던 친구들\n\n낡은 옷깃에는\n그 시절 바람이 머물고\n눈빛마다 먼 꿈이 반짝인다\n\n누군가는 다른 도시로 떠났고\n누군가는 소식조차 끊겼지만\n사진 속 우리는 아직 함께 있다\n\n손끝으로 얼굴들을 쓸어 보니\n그날의 웃음이 돌아온다\n세월도 가져가지 못한 봄 하나","part":0},{"number":3,"title":"나란히 걷는다는 것","text":"신천 둔치를 걷는 저녁\n강물은 말없이 흘러가고\n두 그림자가 길게 늘어진다\n\n내 걸음이 느려지면\n너도 천천히 걷는다\n숨이 차 잠시 멈추면\n함께 강 건너 산을 바라본다\n\n젊은 날에는\n서로 앞서가려고 바빴는데\n이제는 뒤처지는 사람이 없도록 걷는다\n\n강물 위의 오리 두 마리\n한 마리가 멈추자\n다른 한 마리도 물결 위에 머문다\n\n함께 늙어 간다는 것은\n서로의 느린 걸음을 지켜 주는 일","part":0},{"number":4,"title":"안개 속의 징검돌","text":"가창교 아래로\n아침 안개가 내려앉았다\n\n건너편 길은 보이지 않고\n물소리만 가까이 들렸다\n\n나는 징검돌 하나를 믿고\n조심스럽게 발을 내디뎠다\n미끄러운 돌 위에서 흔들릴 때\n누군가 내 손을 잡아 주었다\n\n작고 따뜻한 손 하나가\n차가운 안개를 밀어냈다\n\n안개가 걷힌 뒤 돌아보니\n우리가 건너온 길 위에\n젖은 발자국 두 줄이 빛나고 있었다","part":0},{"number":5,"title":"이름 하나가 불러온 저녁","text":"해가 지는 저녁\n식어 가는 찻잔 앞에서\n오래된 이름 하나를 불러 본다\n\n봉덕동 작은 골목\n담장 너머 감나무와\n낮은 지붕 위의 저녁노을\n\n함께 걷던 길도\n함께 웃던 날도\n이름 하나에 다시 살아난다\n\n세월은 골목의 모습을 바꾸었지만\n그 사람이 부르던 내 이름은\n아직도 귀에 익다\n\n추억은 마음에 숨어 있다가\n누군가 부르면 문을 여는가 보다","part":0},{"number":6,"title":"저녁 여덟 시의 안부","text":"저녁 여덟 시\n창밖에 어둠이 내려앉을 때\n휴대전화가 짧게 울렸다\n\n밥은 먹었니\n\n흔한 말 한마디에\n마음이 오래 머물렀다\n\n어릴 적 어머니도\n학교에서 돌아온 나에게\n늘 같은 말을 하셨다\n\n나는 천천히 답장을 썼다\n잘 먹었어 너도 챙겨 먹어\n\n차가운 밤\n창가에 놓인 작은 불빛이\n유난히 따뜻했다","part":0},{"number":7,"title":"반 걸음의 사랑","text":"고산골 메타세쿼이아 길\n우리는 나란히 걷는다\n\n내 걸음이 느려지면\n너는 반 걸음 뒤로 물러선다\n\n가파른 길에서는 손을 내밀고\n비가 오면 우산을 내 쪽으로 기울인다\n\n사랑한다는 말보다\n오래 마음에 남는 작은 몸짓들\n\n먼 훗날 걸음이 더욱 느려져도\n한 사람이 멈추면\n다른 한 사람도 멈추어\n바람 부는 숲길을 바라볼 수 있기를\n\n사랑은 앞서가는 일이 아니라\n서로의 곁에서 걷는 일이다","part":0},{"number":8,"title":"첫눈이 남긴 편지","text":"팔공산에 첫눈이 내렸다\n소나무마다 하얀 꽃이 피고\n산길에는 아무도 밟지 않은 눈이 쌓였다\n\n나는 오래전\n누군가와 함께 걷던 겨울을 떠올렸다\n\n눈이 오면 만나자던 약속\n차가운 손을 호호 불며 웃던 날\n\n산 아래 붉은 우체통에도\n하얀 눈이 소복이 쌓였다\n\n보내지 못한 편지들이\n밤새 내려앉은 것만 같다\n\n첫눈은 녹아 없어져도\n그 겨울의 발자국은\n아직 내 마음에 남아 있다","part":0},{"number":9,"title":"빈 의자에 앉은 그리움","text":"수성못이 보이는 찻집\n창가에 의자 두 개가 놓여 있다\n\n하나는 내가 앉고\n하나는 햇살이 앉았다\n\n예전에는 그 자리에 네가 있었다\n차를 나누며 별것 아닌 말에 웃고\n못가의 사람들을 바라보곤 했다\n\n오늘도 찻잔 두 개를 놓을까\n잠시 망설이다 하나만 주문했다\n\n바깥에서 왕버들 가지가 흔들린다\n빈 의자는 아무 말도 없지만\n나는 오래된 목소리를 듣는다\n\n떠난 사람은 보이지 않아도\n그리움은 그 자리에 앉아 있다","part":0},{"number":10,"title":"사과를 깎는 저녁","text":"병실 창밖으로\n저녁이 천천히 내려왔다\n\n하얀 침대 곁에서\n너는 사과를 깎고 있었다\n\n얇은 껍질이 끊어지지 않고\n접시 위에 길게 놓였다\n\n아프냐고 자꾸 묻지도\n괜찮아질 거라 서두르지도 않았다\n\n그저 사과 한 조각을 건네주었다\n나는 그 사과를 먹으며\n이상하게 마음이 놓였다\n\n큰 위로가 필요한 날에도\n말없이 곁에서 사과를 깎는 손이\n가장 따뜻한 말이 되기도 한다","part":0},{"number":11,"title":"막차를 기다리던 밤","text":"봉덕동 골목 버스 정류장\n낡은 가로등 아래\n두 사람이 서 있었다\n\n겨울바람은 차가웠지만\n우리는 자꾸만 웃었다\n\n멀리 버스 불빛이 보이면\n조금만 늦게 오기를 바랐다\n\n주머니에는 버스표 한 장과\n끝내 꺼내지 못한 말이 있었다\n\n그날의 막차는 떠났고\n우리는 서로 다른 길로 걸어갔다\n\n지금도 그 골목을 지날 때면\n가로등 아래 두 그림자가 보인다\n함께 기다린 시간은 떠나지 않았다","part":0},{"number":12,"title":"오래된 두 손","text":"서문시장 작은 포목점\n낡은 나무 자가 놓인 자리\n두 사람은 평생 천을 재고 잘라 왔다\n\n젊은 날에는 아이들 학비를 걱정하며\n늦은 밤까지 가게를 지켰다\n\n세월은 손등에 주름을 남기고\n손가락 마디를 굵게 만들었다\n\n어느 겨울 저녁\n할아버지가 할머니의 손을 잡았다\n춥지 않나\n\n할머니는 가만히 웃었다\n\n수많은 천을 잘라 왔지만\n두 사람의 정만큼은\n한 번도 잘라 낸 적이 없었다","part":0},{"number":13,"title":"늦게 도착한 편지","text":"청도에서 온 편지 한 통을\n오래된 서랍 속에서 발견했다\n\n봉투에는 빗물에 번진 도장과\n낯익은 이름이 적혀 있었다\n\n잘 지내고 있니\n고향에는 코스모스가 피었어\n\n짧은 문장 사이로\n가을바람이 불어왔다\n\n그때는 답장 쓸 날이 많다고 여겼다\n그러나 계절은 지나가고\n편지를 보낸 사람은 멀리 떠났다\n\n나는 봉투 속 마른 꽃씨를\n작은 화분에 묻었다\n봄이 오면 오래된 안부가 돋아날까","part":0},{"number":14,"title":"노을 속의 두 사람","text":"화원 강둑에 앉아\n우리는 저녁 강물을 바라보았다\n\n서쪽 하늘이 붉게 물들고\n강물에도 긴 노을이 내려앉았다\n\n젊은 날에는\n할 이야기가 참 많았는데\n오늘은 말이 없어도 좋았다\n\n강바람이 불어오자\n네 어깨가 내 어깨에 닿았다\n\n걸어온 길에는 기쁜 날도\n슬픈 날도 있었지만\n모두 같은 물결에 실려 여기까지 왔다\n\n해가 산 너머로 사라질 때\n두 그림자가 하나의 길처럼 길어졌다","part":0},{"number":15,"title":"나를 지켜 준 작은 돌","text":"큰비가 내리던 여름\n마당의 돌담이 무너졌다\n\n나는 어디부터 손대야 할지 몰라\n한참을 서 있었다\n\n그때 누군가 찾아와\n말없이 돌들을 들어 올렸다\n\n무너진 틈에 작은 돌 하나를 끼워\n흔들리는 담을 바로 세웠다\n\n살아가다 마음이 무너지는 날이면\n나는 그 돌을 생각한다\n\n눈에 잘 띄지 않아도\n늘 내 곁에 있어 준 사람\n\n오늘도 돌담 아래 작은 돌 하나가\n무거운 시간을 견디고 있다","part":0},{"number":16,"title":"기울어진 우산","text":"칠성시장에 소나기가 쏟아졌다\n우리는 작은 우산 하나를\n함께 쓰고 걸었다\n\n내 어깨는 젖지 않았는데\n네 어깨는 흠뻑 젖어 있었다\n\n그제야 알았다\n우산이 줄곧 내 쪽으로\n기울어져 있었다는 것을\n\n돌아오는 길\n나는 우산을 네 쪽으로 조금 기울였다\n\n사랑은 비를 멈추게 할 수 없어도\n서로가 덜 젖도록\n작은 지붕을 내어 주는 일","part":0},{"number":17,"title":"목소리가 켜 놓은 불","text":"해가 지고\n빈방에 어둠이 내려앉았다\n\n창밖에는 찬바람이 불고\n책상에는 읽다 만 책이 놓여 있었다\n\n그때 전화벨이 울렸다\n잘 지내고 있니\n\n익숙한 목소리가\n먼 곳에서 건너왔다\n\n날씨와 저녁밥 이야기를 나눈 뒤\n전화는 끊겼지만\n방 안에는 따뜻한 기운이 남았다\n\n사람의 목소리에도\n빛이 있는 모양이다\n어둔 마음이 이토록 환해지는 걸 보면","part":0},{"number":18,"title":"다시 열두 살이 되는 날","text":"달성공원 나무 벤치에\n두 노인이 나란히 앉았다\n\n서로의 얼굴을 바라보다\n오래된 별명 하나를 불렀다\n\n그 순간 두 사람은 크게 웃었다\n운동장을 달리던 일\n개울에서 물장구치던 일\n\n주름진 얼굴마다\n어린 시절의 웃음이 피어났다\n\n지나가는 사람들은\n두 노인이 웃는 줄 알았겠지만\n그날 벤치에는\n열두 살 소년 둘이 앉아 있었다\n\n세월은 머리를 하얗게 물들여도\n마음속 소년까지 늙히지는 못한다","part":0},{"number":19,"title":"은행잎이 잠든 책","text":"오래된 시집을 펼치자\n마른 은행잎 하나가 떨어졌다\n\n반월당 헌책방에서\n그 책을 사던 가을이 떠올랐다\n\n노란 은행나무 아래\n누군가를 기다리며\n시 한 편을 읽던 오후\n\n잎은 얇은 종이처럼 변했지만\n잎맥에는 그날의 햇살이 남은 듯했다\n\n나는 은행잎을 주워\n다시 책 속에 넣었다\n\n가을이 올 때마다 시집을 펼치면\n오래된 나무 한 그루가\n내 마음속에 노랗게 물든다","part":0},{"number":20,"title":"강물은 이름을 묻지 않는다","text":"가창에서 흘러온 작은 물줄기는\n신천을 지나 넓은 강으로 향한다\n\n어느 곳에서는 시냇물이라 불리고\n어느 곳에서는 큰 강이라 불린다\n\n이름이 달라져도\n물은 흐르는 일을 멈추지 않는다\n\n작은 돌을 만나면 돌아가고\n깊은 웅덩이를 만나면 잠시 머문다\n\n그러다가 다른 물줄기를 만나\n더 넓은 세상으로 흘러간다\n\n나도 강물처럼 살고 싶다\n어디에서 어떤 이름으로 불리든\n처음 품었던 맑은 마음을 잃지 않고\n먼 바다까지 흘러가고 싶다","part":0},{"number":21,"title":"아침밥에 남은 온기","text":"새벽에 부엌 불이 켜지면\n어머니는 쌀을 씻고\n찬물에 손을 담그셨다\n창밖의 별이 하나씩 지는 동안\n솥에서는 하얀 김이 올랐다\n늦잠을 자던 나는 몰랐다\n하루가 시작되기도 전에\n누군가 우리 하루를\n따뜻하게 지어 주었다는 것을","part":1},{"number":22,"title":"아버지의 검정 고무신","text":"문 앞에 가지런한 고무신 한 켤레\n그 안에는 논둑의 흙이 말라 있었다\n아버지는 먼지를 털지 않으셨다\n내일도 그 길을 걸어야 했으므로\n해 질 무렵 신발을 들여놓다가\n나는 작은 돌 하나를 꺼냈다\n아버지가 하루 종일 밟은 길이\n내 손바닥에 들어왔다","part":1},{"number":23,"title":"손등에 흐르는 강","text":"어머니의 손등에는\n가느다란 푸른 줄이 있었다\n어릴 때는 그것이 무엇인지 몰라\n손가락으로 따라 그리곤 했다\n오래 일한 손을 잡아 보니\n차가운 겨울이 묻어 있었다\n어머니는 내 손부터 감싸 주셨다\n작은 강 하나가\n그제야 내게로 흘러왔다","part":1},{"number":24,"title":"가창 장날의 뒷모습","text":"가창 오일장에 가면\n사람들 어깨가 부딪치고\n빨간 고추와 파란 채소가 빛난다\n장바구니를 든 어머니는\n언제나 내 앞에서 걸으셨다\n무거운 짐을 나눠 들자고 해도\n괜찮다며 웃으셨다\n이제 장터를 혼자 지나면\n그 웃음이 사람들 틈에서 들린다","part":1},{"number":25,"title":"장독대에 앉은 햇살","text":"겨울이 지나자\n장독대 뚜껑에 햇살이 고였다\n어머니는 장을 뜨고\n나는 옆에서 빈 바가지를 들었다\n오래된 항아리는 말이 없지만\n봄마다 같은 냄새를 품었다\n고향을 떠나 많은 집을 지나도\n된장국이 끓는 저녁이면\n그 작은 마당이 돌아온다","part":1},{"number":26,"title":"논물에 비친 아버지","text":"모내기하던 논에\n아버지의 얼굴이 비쳤다\n구부린 등 위로\n파란 하늘이 흔들렸다\n나는 둑에 앉아 손을 흔들었고\n아버지는 허리를 펴며 웃으셨다\n시간이 흐른 뒤 알았다\n아버지가 심은 것은 모뿐 아니라\n우리 집의 내일이었다","part":1},{"number":27,"title":"빨랫줄의 작은 하늘","text":"마당에 빨래를 널던 날\n양말 두 짝이 바람에 흔들렸다\n어머니의 앞치마와\n아버지의 낡은 셔츠 사이\n어린 내 옷이 펄럭였다\n우리는 서로 다른 하루를 살았지만\n해가 기우는 저녁이면\n한 줄에 나란히 걸려\n같은 바람을 맞았다","part":1},{"number":28,"title":"초승달 닮은 낫","text":"헛간 벽에 걸린 낫 하나\n달빛을 받아 반짝였다\n아버지는 그 낫으로\n여름 풀을 베고 가을 벼를 거두셨다\n손잡이는 오래 닳았고\n날은 자주 갈아야 했다\n하늘의 초승달을 볼 때마다\n나는 땀 젖은 아버지의 손과\n곡식이 익던 들판을 생각한다","part":1},{"number":29,"title":"아궁이 앞 작은 별","text":"아궁이에 솔가지를 넣으면\n주황빛 불씨가 튀어 올랐다\n바깥에는 겨울바람이 불고\n방문 틈은 자꾸만 떨렸지만\n우리는 따뜻한 아랫목에 모였다\n어머니가 불을 살피던 밤\n불꽃 하나가 잠깐 날아올랐다\n내 어린 시절의 별은\n하늘보다 부엌에 더 많았다","part":1},{"number":30,"title":"오 분 빠른 시계","text":"아버지의 낡은 손목시계는\n언제나 오 분 빨랐다\n늦지 말고 살아라\n말없이 알려 주는 듯했다\n학교에 가던 아침마다\n나는 그 시계를 힐끗 보았다\n이제 내 책상 위에 놓인 시계\n멈춘 바늘을 바라보며\n서둘러야 할 것은 시간이 아니라\n서로의 안부였음을 안다","part":1},{"number":31,"title":"향이 피어오르는 아침","text":"명절 아침 상을 차리고\n작은 향 하나에 불을 붙였다\n가느다란 연기가 올라가\n창문 앞에서 잠시 굽었다\n멀리 계신 부모님께\n오늘도 잘 지낸다고 말한다\n대답 없는 방 안으로\n햇살이 천천히 들어왔다\n그 빛 앞에서 고개를 숙였다","part":1},{"number":32,"title":"세 마디의 전화","text":"여보세요, 밥 먹었나\n그게 아버지의 첫마디였다\n잘 지낸다, 걱정 마라\n그게 늘 마지막 말이었다\n이제는 걸 수 없는 번호를\n손끝이 가끔 기억한다\n짧아서 더 오래 남은 말\n저녁밥 냄새가 날 때면\n그 목소리가 다시 울린다","part":1},{"number":33,"title":"벼가 익는 속도","text":"옥포 들판을 지날 때\n벼들이 고개를 숙이고 있었다\n봄에는 작던 모가\n비와 바람을 견디며 자랐다\n급히 크지 않아도 좋다고\n논바닥의 물이 말하는 듯했다\n나도 하루에 하나씩 배우며\n서두르지 않는 가을을 맞고 싶다\n익을수록 낮아지는 들판처럼","part":1},{"number":34,"title":"서랍 속 봄 블라우스","text":"서랍을 열자\n옅은 꽃무늬 옷이 나왔다\n어머니가 봄마다 입으시던 옷\n작은 단추 하나가 느슨했다\n오래된 천을 손으로 쓸어 보니\n햇살이 창가에 멈춘 듯했다\n옷은 더는 움직이지 않지만\n그 안에 남은 봄은\n해마다 나를 찾아온다","part":1},{"number":35,"title":"정류장의 우산 두 개","text":"가창 정류장에 비가 내렸다\n버스를 기다리는 사람들 사이\n우산 두 개가 나란히 서 있었다\n한 사람은 젖은 신발을 털고\n한 사람은 손수건을 내밀었다\n커다란 약속도 없는 저녁\n서로의 빗방울을 살피는 마음이\n낡은 정류장 지붕 아래\n오래 따뜻하게 남았다","part":1},{"number":36,"title":"도마 위에 오는 새벽","text":"어머니가 파를 썰던 도마에는\n작은 칼자국이 많았다\n아침마다 한 줄씩 새겨진\n우리 가족의 오래된 시간\n어머니가 부엌을 떠나신 뒤\n도마는 조용해졌지만\n파를 썰 때 나는 소리마다\n새벽에 일어나던 그 발걸음이\n잠깐씩 돌아온다","part":1},{"number":37,"title":"산소 앞 솔방울","text":"선산에 가는 길에는\n소나무가 길게 서 있다\n부모님께 절을 올린 뒤\n솔방울 하나를 주워 들었다\n흙 묻은 작은 비늘 사이로\n지난여름의 햇살이 남아 있다\n살아 계실 때 못다 한 말들은\n바람이 대신 전해 줄까\n나는 한참 산 아래를 바라보았다","part":1},{"number":38,"title":"주인 없는 매화","text":"빈집 담장 밖으로\n매화 한 가지가 뻗어 있었다\n문은 오래 잠겨 있었지만\n꽃은 올해도 제때 피었다\n사람이 떠난 자리에서도\n봄은 길을 잃지 않는다\n나는 담장 앞에 서서\n아무도 받지 않을 인사를\n조용히 건넸다","part":1},{"number":39,"title":"나란한 사진 두 장","text":"벽에 걸린 사진 두 장\n아버지와 어머니가 웃고 계신다\n살아 계실 때는\n서로 사소한 일로 다투시더니\n사진 속에서는 늘 다정하다\n먼지를 닦다가 문득\n두 사람 사이에 내 얼굴이 비쳤다\n그제야 알았다\n나는 아직도 두 분의 가운데에 산다","part":1},{"number":40,"title":"마음속 작은 집","text":"어릴 적 살던 집은 없어졌지만\n나는 그 길을 기억한다\n마루 끝에 놓인 고무신\n부엌에서 들리던 도마 소리\n저녁이면 켜지던 노란 전등\n눈을 감으면 문이 열린다\n사람이 돌아갈 수 없는 곳에도\n마음은 작은 집을 지어\n그리운 사람들을 기다린다","part":1},{"number":41,"title":"숲이 여는 아침","text":"고산골 산책길에 들어서면\n먼저 새 한 마리가 운다\n메타세쿼이아 높은 가지에서\n밤새 묻어 둔 아침을 꺼낸다\n신발 밑에 솔잎이 눌리고\n찬 공기가 가슴에 들어온다\n어제의 걱정은 잠시 내려놓고\n나는 새가 연 숲의 문을\n천천히 통과한다","part":2},{"number":42,"title":"법장사 오르는 돌계단","text":"법장사로 오르는 길\n돌계단마다 발이 잠깐 멈춘다\n누군가 쌓아 둔 작은 돌탑에\n바람이 지나가도 돌은 서 있다\n서로 기대고 있기 때문일까\n나는 맨 아래 돌을 바라본다\n높이 오른 사람보다\n아래에서 받쳐 주는 사람이\n먼저 고마워지는 길이다","part":2},{"number":43,"title":"고산골 약수터","text":"약수터의 차가운 물이\n작은 바가지를 채운다\n먼저 온 사람이 한 모금 마시고\n다음 사람에게 자리를 비켜 준다\n산에서는 누구도 서두르지 않는다\n물은 늘 같은 자리에서\n오가는 사람의 목을 적신다\n나는 빈 바가지를 내려놓으며\n오늘의 욕심도 함께 놓는다","part":2},{"number":44,"title":"백로가 지나간 신천","text":"신천 둔치 얕은 물에\n백로 한 마리가 서 있었다\n긴 다리로 물을 가르며\n제 그림자를 천천히 옮겼다\n자동차는 다리 위를 달리고\n사람들은 저마다 바쁘게 걸었다\n그 사이 하얀 새 한 마리\n서두르지 않고 하루를 읽는다\n나는 잠시 걸음을 늦췄다","part":2},{"number":45,"title":"고산골 단풍 편지","text":"고산골 가을 길에는\n나무마다 다른 편지가 걸렸다\n붉은 잎은 뜨거운 안부를\n노란 잎은 조용한 인사를 보낸다\n나는 한 장을 주워 책에 넣었다\n읽지 않아도 마음을 아는 편지\n겨울에 책장을 펼치면\n그날 산길의 바람이\n다시 내 곁을 지나갈 것이다","part":2},{"number":46,"title":"신천의 저녁 운동화","text":"해가 기울면 신천 둔치에\n운동화들이 모여든다\n젊은 사람은 빠르게 달리고\n노인은 강을 보며 천천히 걷는다\n나는 물소리에 걸음을 맞춘다\n오늘 하루 마음에 남은 말들이\n발자국 뒤로 하나씩 흐려진다\n집으로 돌아가는 길\n강물이 나보다 먼저 웃고 있다","part":2},{"number":47,"title":"앞산의 낮달","text":"고산골 능선 위에\n하얀 낮달이 걸려 있었다\n바람은 벌써 겨울 냄새를 싣고\n나뭇잎은 몇 장 남지 않았다\n나는 달을 보며 아버지를 생각했다\n멀리 계셔도\n같은 하늘을 바라보는 것 같아서\n한참 고개를 들고 걸었다\n달은 말없이 길을 밝혀 주었다","part":2},{"number":48,"title":"낙엽의 다른 자리","text":"나무에 달렸을 때는\n빨간 잎 하나가 참 눈부셨다\n바닥에 내려앉자\n사람들은 그냥 지나갔다\n나는 발끝의 잎을 주웠다\n나무에서 멀어진 뒤에도\n잎맥에는 여름이 남아 있었다\n가까운 곳의 소중함을\n늦게 알아보는 내가 보였다","part":2},{"number":49,"title":"솔바람이 쉬어 가는 곳","text":"고산골 벤치에 앉아\n물병 뚜껑을 열었다\n오르막에서 거칠어진 숨이\n조금씩 제자리로 돌아온다\n솔바람이 어깨에 내려앉고\n멀리 작은 새가 대답한다\n쉬는 일도 걸어가는 일의 일부\n나는 그 말을 마음에 적어 두고\n다시 신발 끈을 묶는다","part":2},{"number":50,"title":"법장사 처마 아래","text":"법장사 처마 끝에는\n작은 풍경이 흔들린다\n바람이 지나갈 때마다\n맑은 소리가 골짜기로 퍼진다\n나는 그 소리를 들으며\n말없이 서 있는 시간을 배운다\n마음이 소란한 날에도\n바람을 따라 흔들린 뒤\n다시 고요해질 수 있기를","part":2},{"number":51,"title":"고산골 돌계단의 이슬","text":"이른 아침 돌계단에는\n작은 이슬이 맺혀 있었다\n밟지 않으려 옆으로 걷자\n풀잎이 살짝 흔들렸다\n바쁜 마음으로는 보이지 않던\n작은 빛 하나가 눈에 들어왔다\n산책은 멀리 가는 일이 아니라\n가까운 것을 천천히\n다시 보는 일인지도 모른다","part":2},{"number":52,"title":"가을이 건네는 의자","text":"고산골 길가 나무 의자\n낙엽 몇 장이 먼저 앉아 있다\n나는 그 옆에 자리를 잡고\n지나가는 구름을 바라본다\n할 일은 아직 많지만\n지금은 바람 소리만 듣고 싶다\n산은 아무것도 묻지 않고\n내게 잠깐의 시간을 내어 준다","part":2},{"number":53,"title":"산책길의 인사","text":"매일 같은 시각 걷다 보면\n낯익은 얼굴들이 생긴다\n처음에는 고개만 끄덕이다가\n어느 날부터 안녕하세요, 인사한다\n이름도 모르는 사이지만\n비 온 뒤 미끄러운 길을 알려 주고\n꽃이 피면 먼저 가리켜 준다\n고산골 산책길에는\n작은 이웃들이 함께 산다","part":2},{"number":54,"title":"억새가 흔드는 손","text":"고산골 언덕에 억새가 피면\n은빛 머리들이 바람에 흔들린다\n누구를 부르는 것일까\n나는 잠시 멈추어 손을 흔든다\n젊은 날 빠르게 지나친 계절이\n이제는 천천히 보인다\n바람이 지나간 자리마다\n작은 웃음처럼\n햇살이 반짝인다","part":2},{"number":55,"title":"비 온 뒤의 고산골","text":"밤새 내린 비가 그치고\n고산골 흙길이 짙어졌다\n젖은 돌에는 하늘이 비치고\n계곡물은 어제보다 커졌다\n나는 미끄러운 길을 살피며\n한 걸음씩 올라간다\n비를 맞은 나무는 더 푸르고\n마음도 가끔 젖어야\n새로운 빛을 만나는가 보다","part":2},{"number":56,"title":"산 아래 작은 찻집","text":"산책을 마친 뒤\n찻집 창가에 앉는다\n따뜻한 잔을 두 손으로 감싸면\n앞산의 차가운 공기가 녹는다\n유리창 밖 사람들은 바쁘지만\n내 시간은 조금 느리게 흐른다\n산에서 얻은 고요를\n차가 식을 때까지\n마음속에 남겨 둔다","part":2},{"number":57,"title":"고산골의 첫눈","text":"아침에 고산골을 찾으니\n어제의 흙길이 하얗게 변했다\n나뭇가지마다 눈이 놓이고\n새 발자국이 먼저 길을 냈다\n나는 그 작은 흔적을 따라\n조심스럽게 걸었다\n아무도 시작하지 않은 하루에\n새가 먼저 적어 놓은\n짧은 시 한 줄이 있었다","part":2},{"number":58,"title":"고산골에서 만난 봄","text":"겨울 내내 마른 풀만 보이더니\n돌 틈에서 새싹이 올라왔다\n나는 쪼그려 앉아\n연둣빛 잎을 오래 바라보았다\n커다란 나무도 아닌데\n산길 전체가 환해졌다\n봄은 멀리서 오는 것이 아니라\n작은 풀 하나가 고개를 들 때\n우리 곁에서 시작된다","part":2},{"number":59,"title":"앞산을 내려오는 길","text":"산에 오를 때는\n정상만 생각하며 걸었다\n돌아오는 길에는\n작은 꽃과 오래된 나무가 보였다\n내려갈수록 마음은 가벼워지고\n발밑의 그림자는 길어진다\n삶도 이와 같다면\n높이 오른 날보다\n잘 내려온 날을 기억하고 싶다","part":2},{"number":60,"title":"못가에 첫 잎이 돋으면","text":"주리못 가장자리 버드나무에\n연둣빛 잎이 돋았다\n바람이 물결을 살짝 밀자\n나무는 수면에 고개를 숙인다\n나는 아직 찬 손을 주머니에 넣고\n봄이 오는 모습을 바라본다\n계절은 큰소리 없이 바뀐다\n작은 잎 한 장이\n못 전체를 새롭게 한다","part":2},{"number":61,"title":"핑크빛 빈 벤치","text":"주리못 둑의 핑크빛 벤치\n오늘도 물을 향해 앉아 있다\n누군가 쉬다 떠난 자리에는\n햇살이 잠깐 머문다\n나는 벤치 옆에 서서\n멀리 떠 있는 빈 배를 바라본다\n아무도 없는 자리가\n반드시 외로운 것은 아니다\n기다림도 하나의 풍경이 된다","part":3},{"number":62,"title":"빈 돛배의 오후","text":"주리못 위 작은 돛배는\n바람이 없는 날 조용히 떠 있다\n물결이 닿을 때마다\n조금씩 제자리를 바꾼다\n어디에도 서두르지 않는 배를 보며\n나는 오늘 할 일을 잠시 잊는다\n움직이지 않아도\n하늘을 오래 품는 시간이\n한 척의 여행이 될 수 있다","part":3},{"number":63,"title":"빗방울의 인사","text":"비가 그친 주리못 둑\n풀잎 끝에 물방울이 맺혔다\n몸을 낮춰 들여다보니\n그 안에 작은 하늘이 들어 있다\n바람이 불자 물방울은 떨어지고\n풀잎은 가볍게 일어섰다\n아주 짧은 만남이어도\n서로를 맑게 남기는 일이 있다","part":3},{"number":64,"title":"수면 위의 구름","text":"구름 하나가 주리못을 건넌다\n하늘에서는 천천히 움직이고\n물속에서는 조금 흔들린다\n나는 두 구름을 번갈아 본다\n같은 모습도 보는 곳에 따라\n다르게 보일 수 있구나\n사람의 마음을 이해할 때도\n한쪽에서만 바라보지 않기를\n못물이 조용히 일러 준다","part":3},{"number":65,"title":"못둑의 작은 꽃","text":"주리못 둑길 가장자리\n이름 모를 꽃이 피었다\n사람들은 넓은 못을 바라보느라\n발밑의 꽃을 놓치고 지나간다\n나는 잠깐 몸을 낮춘다\n꽃은 누가 봐 주지 않아도\n제 계절을 환하게 살고 있다\n작은 삶을 함부로 지나치지 말자고\n돌아가는 길에 다짐한다","part":3},{"number":66,"title":"물닭이 그은 선","text":"검은 물닭 한 마리가\n주리못 수면을 가로지른다\n뒤에 남은 긴 물결이\n조금씩 넓어졌다 사라진다\n내가 한 말과 행동도\n누군가의 마음에 저런 길을 낼까\n나는 물결이 잠잠해질 때까지\n말없이 새를 바라보았다","part":3},{"number":67,"title":"노을이 앉는 자리","text":"저녁이 오면 주리못의 물은\n천천히 붉은빛을 받아 적는다\n산그늘이 둑길까지 내려오고\n빈 벤치가 긴 그림자를 만든다\n나는 하루를 돌아보며 앉는다\n아쉬운 일도 있었지만\n오늘의 끝에는 노을이 있다\n못물은 누구의 하루도\n조용히 품어 준다","part":3},{"number":68,"title":"달빛을 건네는 못","text":"보름달이 뜬 밤\n주리못에는 달이 두 개다\n하늘의 달 하나\n물속에서 흔들리는 달 하나\n손을 뻗으면 닿을 듯하지만\n물결을 건드리면 흩어진다\n그리운 사람도 때로는 그렇다\n가까이 느껴지다가\n손끝에서 멀어지는 빛","part":3},{"number":69,"title":"바람이 읽는 갈대","text":"주리못 갈대밭에 서면\n바람이 먼저 시를 읽는다\n갈대는 이쪽저쪽 몸을 기울이고\n마른 잎들이 서로 부딪친다\n나는 그 소리를 듣다가\n적어 둔 문장을 지워 본다\n말을 줄인 자리에\n가을이 더 또렷하게 들린다","part":3},{"number":70,"title":"벚꽃이 떠나는 길","text":"봄날 주리못 물가에\n벚꽃잎이 흩날렸다\n잠시 가지에 머물던 꽃들이\n물 위에서 작은 배가 된다\n떨어지는 것을 끝이라 생각했는데\n꽃잎은 다른 풍경으로 흘러간다\n나도 언젠가 자리를 옮겨도\n내가 품은 봄 하나는\n누군가에게 닿을 수 있을까","part":3},{"number":71,"title":"참새 두 마리","text":"주리못 둑에 참새 둘이 앉아\n짧은 소리로 말을 나눈다\n한 마리가 날아오르면\n다른 한 마리도 뒤따른다\n나는 그 모습을 보며 웃었다\n멀리 날아가는 것보다\n함께 돌아올 자리를 아는 일이\n더 큰 기쁨일지도 모른다","part":3},{"number":72,"title":"물빛에 비친 얼굴","text":"잔잔한 주리못에\n내 얼굴이 잠깐 비쳤다\n젊은 날과는 다른 주름이\n물결을 따라 흔들렸다\n나는 손으로 물을 휘젓지 않았다\n지나온 계절이 얼굴에 남아도\n오늘의 하늘은 여전히 푸르다\n늙는다는 것은\n빛을 잃는 일만은 아니다","part":3},{"number":73,"title":"깨졌다 다시 모이는 달","text":"돌멩이 하나를 던지자\n물속의 달이 여러 조각으로 갈라졌다\n잠시 뒤 잔물결이 멎자\n달은 다시 둥글어졌다\n마음이 흔들리는 날에도\n나는 이 모습을 떠올린다\n지금은 조각난 것 같아도\n고요해질 시간이 오면\n내 안의 달도 다시 떠오른다","part":3},{"number":74,"title":"보름밤의 작은 약속","text":"음력 보름 주리못 둑에서\n나는 하늘을 올려다본다\n달빛은 나무와 벤치를 지나\n못물 가장자리까지 내려온다\n멀리 있는 가족도\n오늘 저 달을 보고 있을까\n같은 하늘 아래 있다는 생각만으로\n밤길이 조금 환해진다","part":3},{"number":75,"title":"물안개 속 발자국","text":"주리못에 물안개가 피어오른 아침\n맞은편 산길이 흐려졌다\n나는 보이지 않는 둑을 따라\n익숙한 발걸음을 옮겼다\n어제 걸었던 길이라도\n오늘은 조금 다르게 보인다\n같은 곳을 여러 번 찾는 까닭은\n새로운 길보다\n새로운 마음을 만나기 위해서다","part":3},{"number":76,"title":"새벽의 첫 물결","text":"해 뜨기 전 주리못에서\n물새가 먼저 움직였다\n잠잠하던 수면에\n작은 동그라미가 퍼져 나갔다\n아침은 거창하게 시작되지 않았다\n작은 날갯짓 하나가\n고요한 물을 깨웠다\n나도 오늘 한 가지 일을\n저 물결처럼 시작해 본다","part":3},{"number":77,"title":"풀벌레의 밤 학교","text":"산책객이 돌아간 저녁\n주리못 둑은 조용해졌다\n풀숲에서 한 마리 울자\n다른 풀벌레도 소리를 보탰다\n누가 지휘하는지도 모르는데\n밤의 합창은 이어졌다\n서로 다른 작은 목소리가\n함께 어울려 숲을 채웠다\n나는 그 노래를 한참 들었다","part":3},{"number":78,"title":"주리못의 가을 그림자","text":"늦가을 주리못 둑길\n해가 산 너머로 기울면\n내 그림자도 길어진다\n물속에는 또 다른 내가 서 있다\n바람이 불면 그 얼굴이 흐려져도\n나는 서두르지 않는다\n흔들리는 날도 나의 하루이므로\n노을이 사라질 때까지\n천천히 물가를 걷는다","part":3},{"number":79,"title":"물가에 놓인 돌 하나","text":"주리못 물가에서\n둥근 돌 하나를 주워 든다\n수없이 물에 씻긴 모서리가\n손바닥에 부드럽게 닿는다\n사람도 오래 살아가며\n조금씩 날카로움을 내려놓을까\n돌을 다시 제자리에 두자\n잔물결이 조용히 인사한다","part":3},{"number":80,"title":"겨울 못의 기다림","text":"겨울 주리못에는\n바람이 얇은 얼음을 밀고 간다\n나뭇가지들은 잎을 내려놓고\n빈 벤치는 하얀 서리를 입었다\n아무것도 자라지 않는 듯한 계절\n나는 물가의 마른 풀을 본다\n작은 뿌리들은 땅속에서\n다음 봄을 준비하고 있을 것이다","part":3},{"number":81,"title":"느티나무의 오래된 공부","text":"주리마을 느티나무 아래\n나는 잠깐 걸음을 멈춘다\n굵은 줄기에는 세월이 남고\n작은 잎은 올해도 새로 난다\n오래 산 나무도 봄마다 배우는구나\n뿌리는 자리를 지키고\n가지는 먼 하늘을 향한다\n나도 아는 것을 지키면서\n모르는 곳으로 자라고 싶다","part":4},{"number":82,"title":"금 간 찻잔의 빛","text":"명도재 찻잔에 금이 갔다\n버릴까 하다가 내려놓는다\n작은 금 사이로\n오래 사용한 시간이 보였다\n흠집 없이 사는 사람은 없을 것이다\n나는 차를 다른 잔에 따라 놓고\n금 간 잔을 창가에 두었다\n오후의 햇살이 그 틈에서 빛났다","part":4},{"number":83,"title":"오래된 만년필과 새 화면","text":"서랍 속 만년필을 꺼내\n종이에 짧은 문장을 적는다\n곁에는 새 컴퓨터가 켜져 있다\n한쪽은 잉크로 천천히 쓰고\n다른 한쪽은 손끝에 따라 바뀐다\n도구는 달라도\n누군가에게 닿고 싶은 마음은 같다\n나는 종이와 화면 사이에\n오늘의 시를 놓는다","part":4},{"number":84,"title":"명도재의 자정","text":"밤이 깊어도 명도재에는\n작은 스탠드 불이 켜져 있다\n책 한 권과 노트북 한 대\n그리고 식어 가는 찻잔\n새로운 앱의 첫 화면을 고치다가\n창밖 어둠을 잠시 바라본다\n이 늦은 나이에도\n만들고 싶은 것이 있다는 사실이\n밤을 조금 밝게 한다","part":4},{"number":85,"title":"인공지능 책갈피","text":"책상 위 인공지능 책에\n노란 메모지가 붙어 있다\n어려운 문장을 여러 번 읽다가\n나는 창밖의 나무를 본다\n나무는 해마다 다른 가지를 낸다\n기술도 그렇게 자라나는 걸까\n중요한 것은 빠른 답보다\n사람에게 도움이 되는 질문\n책갈피에 그 말을 적는다","part":4},{"number":86,"title":"바이브코딩의 첫 화면","text":"명도재에서 문장을 입력한다\n아이들이 별을 배우는\n작은 게임을 만들고 싶다고\n잠시 뒤 화면에 밤하늘이 열린다\n그러나 버튼은 아직 어색하다\n누르고 고치고 다시 시험한다\n완성은 한 번에 오지 않는다\n실패한 자리마다\n새로운 길을 찾는 즐거움이 생긴다","part":4},{"number":87,"title":"아이들의 우주여행","text":"화면 속 작은 우주선이\n지구를 떠나 별 사이로 간다\n토성의 고리를 만나고\n달의 어두운 면을 지나간다\n책에서 보던 하늘이\n손끝에서 움직이자\n어린 눈들이 환하게 빛난다\n내가 만든 것은 게임 하나지만\n그 안에 들어갈 꿈은\n아이들마다 다를 것이다","part":4},{"number":88,"title":"전기회로를 잇는 손","text":"어린이 과학게임 화면에서\n전구는 아직 켜지지 않았다\n아이가 전선을 하나 움직이자\n노란 불빛이 환하게 켜진다\n작은 성공 앞에서 웃는 얼굴\n나는 그 웃음을 생각하며\n설명이 어려운 곳을 다시 고친다\n배움은 정답을 맞히는 순간보다\n스스로 해냈다고 느끼는 빛이다","part":4},{"number":89,"title":"시를 쓰는 앱","text":"한 학생이 화면에 적는다\n오늘 비가 왔어요\n나는 그 문장을 고치기보다\n어디에 비가 내렸는지 묻고 싶다\n운동장, 우산, 젖은 운동화\n세상을 자세히 바라보는 눈이\n시의 첫 줄을 만든다\n기계가 문장을 도와주어도\n마음의 날씨는 사람이 쓴다","part":4},{"number":90,"title":"AI와 함께 그리는 수채화","text":"고산골 단풍 사진을 띄우고\n그날의 바람을 글로 적는다\n화면에는 붉은 숲이 펼쳐지지만\n내가 밟은 낙엽 소리까지\n그림에 담기기는 어렵다\n그래서 한 줄을 더 적는다\n나무 아래 오래 서 있던 사람\n기술은 색을 보태고\n기억은 그림에 숨을 불어넣는다","part":4},{"number":91,"title":"질문이 깊어지는 밤","text":"인공지능은 빠르게 대답한다\n나는 그 답을 읽다가\n다시 질문을 바꾼다\n정말 사람에게 도움이 될까\n틀린 곳은 없는지 살펴본다\n빠른 길이 늘 좋은 길은 아니다\n명도재의 작은 스탠드 아래\n한 번 더 확인하는 시간이\n내일의 문장을 지켜 준다","part":4},{"number":92,"title":"인공지능 시대의 교실","text":"오래전 교실에서는\n분필 가루가 햇살에 떠다녔다\n이제 아이들은 화면을 열고\n새로운 답을 찾아 나선다\n도구가 달라져도\n서로의 생각을 듣는 일은 중요하다\n모두가 정답을 빨리 찾는 시대\n나는 좋은 질문을 품는 교실을\n오래 꿈꾼다","part":4},{"number":93,"title":"칼럼을 쓰는 새벽","text":"새벽 명도재 책상 위에\n신문 기사 몇 장이 펼쳐져 있다\n인공지능과 시험 이야기\n편리함과 공정함 사이에서\n나는 쉽게 결론을 쓰지 않는다\n학생의 얼굴을 먼저 떠올리고\n교실에서 배웠던 것을 생각한다\n한 줄의 칼럼에도\n사람을 향한 책임이 있어야 한다","part":4},{"number":94,"title":"화면 밖의 독자","text":"글을 올리고 나면\n화면 속 숫자가 조금씩 바뀐다\n그러나 숫자로 알 수 없는 것이 있다\n누가 어디에서 이 글을 읽고\n잠시 생각에 잠겼을까\n나는 오늘도 문장을 다듬는다\n읽는 사람의 마음에\n작은 질문 하나라도 남기를 바라며","part":4},{"number":95,"title":"버튼 하나의 배려","text":"새 게임을 스마트폰에 띄우니\n작은 버튼이 잘 눌리지 않는다\n나는 크기와 간격을 고친다\n아이의 손가락을 떠올리면서\n기술의 멋은 복잡한 기능보다\n누구나 쉽게 쓰는 데 있을 것이다\n고친 화면을 다시 열어 본다\n작은 배려 하나가\n앱 전체를 밝히고 있다","part":4},{"number":96,"title":"틀린 답을 고치는 용기","text":"코드를 고쳐도\n화면은 가끔 멈춘다\n나는 오류 문장을 읽고\n다시 처음으로 돌아간다\n살아온 날들도 그랬다\n모든 선택이 맞지는 않았지만\n고치려는 마음이 길을 만들었다\n화면에 작은 별이 뜨는 순간\n나는 다시 시작할 힘을 얻는다","part":4},{"number":97,"title":"명도재 디지털 문학관","text":"시 한 편을 화면에 올리니\n멀리 있는 사람도 읽을 수 있다\n책장 냄새는 나지 않아도\n문장을 따라 마음이 움직인다\n누군가는 늦은 밤 낭송을 듣고\n누군가는 아침에 시를 펼칠 것이다\n낡은 종이와 새로운 화면 사이\n시는 오늘도 자기 길을 찾는다","part":4},{"number":98,"title":"음성으로 돌아온 시","text":"내가 쓴 시를 화면에 넣자\n낭송하는 목소리가 들려온다\n고산골의 바람을 적은 문장이\n조용한 방 안을 지나간다\n기계의 목소리는 또렷하지만\n그날의 떨림은 나만이 안다\n나는 다시 한 줄을 고친다\n시를 완성하는 마지막 손길은\n언제나 사람이 남긴다","part":4},{"number":99,"title":"늦은 배움의 기쁨","text":"명도재 창문 밖으로\n주리못 쪽 저녁빛이 기운다\n오늘은 앱 하나를 고쳤고\n인공지능 책 몇 쪽을 읽었다\n아직 모르는 것은 많다\n그래서 내일이 조금 궁금하다\n산책길 끝에 다시 집이 있듯\n배움의 길 끝에는\n또 새로운 길이 기다린다","part":4},{"number":100,"title":"백 번째 하늘","text":"주리못에서 돌아와\n명도재 창가에 선다\n오늘도 하늘은 한 번뿐이었는데\n물속에서 보고 사진에서 보고\n화면 속 그림으로 다시 만났다\n나는 마지막 시를 적는다\n새로운 기술을 배워도\n끝내 마음에 남는 것은\n함께 걸은 길과 사람의 온기\n내일은 또 다른 하늘이 열릴 것이다","part":4}],"intro":"설명을 버리고 사물의 등줄기만 남기려 했다.\n가창교 건너 찐빵 가마솥에서 피어오르던 흰 김,\n서문시장 포목점 골목의 무명실 보풀, 신천 둔치의 젖은 자갈,\n앞산 고산골 법장사 처마 끝의 청동 물고기와 주리못 수면의 낮달까지\n내가 발 딛고 살아온 대구의 골목과 산수(山水)가 시의 몸통이 되었다.\n그리움이라 적는 대신 식어 가는 찻잔 테두리의 동그란 얼룩을 적었고,\n어머니라 부르는 대신 새벽 네 시 도마 위에 내려앉은 파뿌리의 흙을 적었다.\n책장이 스스로 넘어갈 때마다 독자의 눈앞에 관념이 아닌\n손으로 만져지는 한 장의 물결과 돌멩이가 놓이기를 바란다.","after":"백 편의 시를 모두 구체적인 사물과 지역의 풍경으로 다시 벼려 내었다.\n\n옥포 들판의 벼 포기, 화원 나루의 물안개, 고산골 약수터의 바가지,\n\n주리못둑 핑크빛 벤치의 벗겨진 페인트와 감투봉 산그늘이\n\n관념의 군살을 덜어 낸 자리에 단단한 뼈대로 들어앉았다.\n\n말로 다 설명하지 않아도 시의 행간에 고인 물소리와 풍경소리가\n\n읽는 이의 귓가에 오래도록 서늘한 은유로 남기를 소망한다.\n\n2026년 늦가을, 가창 주리못가 명도재(明道齋)에서 — 시인 이 명 우"}</script>
<script>
(()=>{'use strict';const B=JSON.parse(document.getElementById('bookData').textContent), mobile=window.matchMedia('(max-width:720px)');const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let pages=[],position=0,animating=false,utter=null,paused=false;const step=()=>mobile.matches?1:2;
function cover(){return `<div class="cover"><div class="seal">明道</div><div class="small">明道齋 · 제2창작시집</div><h1>${escape(B.title)}</h1><p>${escape(B.subtitle)}</p><div class="author-bottom">${escape(B.author)} 지음</div><div class="publisher">명도재 시문학사 · 2026</div></div>`}
function poemPage(p){return `<section class="poem"><div class="page-top"><span>제${p.part+1}부 · ${escape(B.parts[p.part].title)}</span><span>POEM ${String(p.number).padStart(3,'0')} / 100</span></div><div class="sep"></div><h2 class="poem-title">${escape(p.title)}</h2><div class="author">이명우</div><div class="verse">${escape(p.text)}</div><div class="poem-bottom"><span>명도재 제2시집</span><span>${String(p.number).padStart(3,'0')}</span></div></section>`}
function partPage(part){return `<section class="divider-page"><div class="eyebrow">PART ${String(part.number).padStart(2,'0')} · ${String((part.number-1)*20+1).padStart(3,'0')}—${String(part.number*20).padStart(3,'0')}</div><div class="symbol">❧</div><h2>${escape(part.title)}</h2><p>${escape(part.subtitle)}</p><div class="symbol">⌁</div></section>`}
function prosePage(title,content,label){return `<section class="prose-page"><div class="label">${label}</div><h2>${escape(title)}</h2><p>${escape(content)}</p></section>`}
function tocPage(){return `<section class="toc-page"><div class="page-top">CONTENTS · 차례</div><h2>다섯 갈래의 길</h2>${B.parts.map(p=>`<button type="button" class="toc-part" data-part="${p.number}">제${p.number}부 · ${escape(p.title)}<small>${escape(p.subtitle)} · 20편</small></button>`).join('')}</section>`}
function build(){pages=[{html:cover(),type:'cover'},{html:prosePage('물밑의 돌멩이로 남은 이름들',B.intro,'시인의 말'),type:'intro'},{html:tocPage(),type:'toc'}];for(const part of B.parts){pages.push({html:partPage(part),type:'part',part:part.number});for(const p of B.poems.filter(p=>p.part===part.number-1))pages.push({html:poemPage(p),type:'poem',poem:p})}pages.push({html:prosePage('신천에서 주리못까지 백 개의 물굽이',B.after,'발문'),type:'after'});pages.push({html:`<div class="closing"><p>물 위의 하늘과 물속의 하늘을<br>한 권에 포개어 놓습니다.</p><b>${escape(B.author)}</b></div>`,type:'end'});if(pages.length%2)pages.push({html:'',type:'blank'});$('tocEntries').innerHTML=B.parts.map(part=>`<section class="part-group"><h3>제${part.number}부 · ${escape(part.title)}</h3>`+B.poems.filter(p=>p.part===part.number-1).map(p=>`<button type="button" class="entry" data-poem="${p.number}">${escape(p.title)}<span>${String(p.number).padStart(3,'0')}</span></button>`).join('')+'</section>').join('')}
function pageOfPoem(n){return pages.findIndex(p=>p.poem&&p.poem.number===n)}function goto(index,noAnim=false){index=Math.max(0,Math.min(pages.length-1,index));if(!mobile.matches)index-=index%2;if(index===position)return;stopSpeech();if(noAnim){position=index;render();return}const f=$('flip');animating=true;f.className='flip '+(index<position?'backward':'active');setTimeout(()=>{position=index;f.className='flip';animating=false;render()},490)}
function setLeaf(el,p,n){el.innerHTML=p?.html||'';el.dataset.page=p?.type==='cover'?'':String(n+1).padStart(2,'0');el.dataset.kind=p?.type||'blank';if(p?.poem){el.dataset.poem=p.poem.number}else delete el.dataset.poem;el.scrollTop=0}
function render(){setLeaf($('left'),pages[position],position);setLeaf($('right'),pages[position+1],position+1);$('pageStat').textContent=(position+1)+'–'+Math.min(position+step(),pages.length)+' / '+pages.length;$('prev').disabled=position===0;$('next').disabled=position+step()>=pages.length;const hash='#page-'+(position+1);history.replaceState(null,'',hash)}
function toggleToc(v){$('tocOverlay').hidden=!v}function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();utter=null;paused=false;$('voiceStatus').textContent=''}function read(){let p=pages[position]?.poem||(!mobile.matches?pages[position+1]?.poem:null);if(!p){$('voiceStatus').textContent='시가 있는 페이지에서 낭송해 주세요';return}if(!('speechSynthesis' in window)){$('voiceStatus').textContent='이 브라우저는 음성 낭송을 지원하지 않습니다';return}stopSpeech();utter=new SpeechSynthesisUtterance(p.title+'\n'+p.text);utter.lang='ko-KR';utter.rate=.88;utter.pitch=1;utter.onend=()=>{$('voiceStatus').textContent='낭송 완료';utter=null};utter.onerror=()=>{$('voiceStatus').textContent='음성 재생을 확인해 주세요'};speechSynthesis.speak(utter);$('voiceStatus').textContent='낭송 중 · '+p.title}
$('tocButton').onclick=()=>toggleToc(true);$('closeToc').onclick=()=>toggleToc(false);$('firstButton').onclick=()=>goto(0,true);$('prev').onclick=()=>goto(position-step());$('next').onclick=()=>goto(position+step());$('read').onclick=read;$('stop').onclick=stopSpeech;$('pause').onclick=()=>{if(!utter)return;if(paused){speechSynthesis.resume();paused=false;$('voiceStatus').textContent='낭송 다시 시작'}else{speechSynthesis.pause();paused=true;$('voiceStatus').textContent='일시정지'}};$('tocEntries').onclick=e=>{const item=e.target.closest('[data-poem]');if(item){toggleToc(false);goto(pageOfPoem(Number(item.dataset.poem)),true)}};$('book').onclick=e=>{const part=e.target.closest('[data-part]');if(part){const i=pages.findIndex(p=>p.type==='part'&&p.part===Number(part.dataset.part));goto(i,true);return}if(!$('tocOverlay').hidden||e.target.closest('button')||animating)return;const box=$('book').getBoundingClientRect();goto(position+(mobile.matches?(e.clientX<box.left+box.width*.35?-step():step()):(e.clientX<box.left+box.width/2?-step():step())))};document.addEventListener('keydown',e=>{if(!$('tocOverlay').hidden){if(e.key==='Escape')toggleToc(false);return}if(e.key==='ArrowRight')goto(position+step());if(e.key==='ArrowLeft')goto(position-step())});let start=null;$('book').addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('book').addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6)goto(position+(dx<0?step():-step()))},{passive:true});mobile.addEventListener('change',()=>{if(!mobile.matches)position-=position%2;render()});addEventListener('pagehide',stopSpeech);
// On small screens, preserve the same 10pt typography and only condense exceptionally long poems if necessary.
function fit(){for(const el of document.querySelectorAll('.leaf .poem .verse')){el.style.fontSize='';let s=13.333;while(el.scrollHeight>el.clientHeight+2&&s>=11.3){s-=.3;el.style.fontSize=s+'px'}}}
const oldRender=render;render=()=>{oldRender();requestAnimationFrame(fit)};build();const match=location.hash.match(/^#page-(\d+)$/);if(match)position=Math.max(0,Math.min(pages.length-1,Number(match[1])-1));if(!mobile.matches)position-=position%2;render();})();
</script></body></html>
