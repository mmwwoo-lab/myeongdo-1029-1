<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>명도재 이명우 제3시집 · 고산골 메타세쿼이아 길에서 신천 물길까지</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&display=swap');
    @font-face {
      font-family: 'Myeongdo Brush';
      src: url('../poetry-book/media/fonts/NanumBrushScript-Regular.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --ink: #263c3b;
      --muted: #7d8175;
      --paper: #ffffff;
      --accent: #9b704b;
      --book-cover: #173b32;
      --book-foil: #eddbac;
      --book-natural-height: 720px;
      --book-viewport-scale: 1;
      /* 시 본문 글자 크기 8포인트(8pt) 고정 */
      --poem-font-size: 8pt;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff !important;
      color: var(--ink);
      font-family: 'Gowun Batang', 'Batang', 'Noto Serif KR', Georgia, serif;
      overflow-x: hidden;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; color: inherit; }

    header {
      height: 74px;
      margin: 0 4%;
      padding-inline: clamp(12px, 2.5vw, 34px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eee7f6 !important;
      color: #34323b !important;
      border-bottom: 1px solid #d6c9e5 !important;
      border-radius: 0 0 12px 12px;
      gap: 8px;
      position: relative;
      z-index: 40;
    }

    .brand {
      text-decoration: none;
      color: #34323b !important;
      font-family: 'Gowun Batang', serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .brand span {
      font: 12px 'Malgun Gothic', sans-serif;
      letter-spacing: 1px;
      margin-left: 10px;
      font-weight: 500;
    }
    .edition {
      font-size: 10.5px;
      letter-spacing: 2.5px;
      color: #555260 !important;
      font-family: Arial, sans-serif;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: #f9f6fc !important;
      border: 1px solid #b5a5ca !important;
      color: #34323b !important;
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 650;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .pill-btn:hover { background: #e6dcf2 !important; }
    .pill-btn.active {
      background: #173b32 !important;
      color: #eddbac !important;
      border-color: #173b32 !important;
    }

    main {
      max-width: 1200px;
      margin: 14px auto 0;
      padding: 0 26px;
    }

    .book-frame {
      width: 92%;
      height: calc(var(--book-natural-height) * var(--book-viewport-scale));
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 22px 48px rgba(15, 25, 22, 0.24), 0 4px 12px rgba(0, 0, 0, 0.12);
      border-radius: 4px;
      filter: drop-shadow(0 14px 20px rgba(25, 35, 35, 0.12));
    }

    .book {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      perspective: 2200px;
      border-radius: 4px;
      height: var(--book-natural-height);
      width: calc(100% / var(--book-viewport-scale));
      transform: scale(var(--book-viewport-scale));
      transform-origin: top left;
      isolation: isolate;
      background: #fff;
    }

    .book::before {
      content: "";
      position: absolute;
      z-index: 4;
      pointer-events: none;
      left: calc(50% - 2px);
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(90deg, #9fa5a8 0%, #d0d3d4 27%, #eef0f0 50%, #c0c5c7 77%, #9da3a6 100%);
      box-shadow: -6px 0 12px rgba(38, 46, 49, 0.14), 6px 0 12px rgba(38, 46, 49, 0.14);
    }

    .page {
      position: relative !important;
      background: #ffffff !important;
      padding: 54px 66px 68px;
      min-width: 0;
      height: var(--book-natural-height);
      overflow: hidden !important;
      scrollbar-width: none !important;
      cursor: pointer;
    }
    .page::-webkit-scrollbar { display: none !important; }

    .book > .page.left:not(.cover-page):not(.back-cover-page) {
      border-radius: 4px 0 0 4px;
      background: linear-gradient(90deg, #ffffff 0%, #ffffff 82%, #f7f7f5 93%, #e9e9e7 99%, #d9dbdc 100%) !important;
      box-shadow: inset -12px 0 17px -12px rgba(43, 49, 51, 0.25), 0 2px 3px rgba(34, 44, 46, 0.09);
    }
    .book > .page.right:not(.cover-page):not(.back-cover-page) {
      border-radius: 0 4px 4px 0;
      background: linear-gradient(90deg, #dadcdd 0%, #e8e9e8 1%, #f7f7f5 8%, #ffffff 19%, #ffffff 100%) !important;
      box-shadow: inset 12px 0 17px -12px rgba(43, 49, 51, 0.25), 0 2px 3px rgba(34, 44, 46, 0.09);
    }

    .book > .page.section-leaf, .turn .page.section-leaf {
      background: linear-gradient(105deg, #faf5e9 0%, #f9f3e5 50%, #f6efdf 100%) !important;
    }

    .page:after {
      content: attr(data-number);
      position: absolute;
      bottom: 14px !important;
      left: 50%;
      transform: translateX(-50%);
      font: 11px Georgia, serif;
      color: #8e8b7e;
      z-index: 4;
      pointer-events: none;
    }

    .page.cover-page, .page.back-cover-page {
      padding: 12px !important;
      background: var(--book-cover) !important;
      border: 1px solid #83998b !important;
      box-shadow: inset 5px 0 12px #071d1888, inset -2px 0 4px #b9cda544 !important;
    }
    .page.cover-page:after, .page.back-cover-page:after { display: none; }
    .page.cover-page:before, .page.back-cover-page:before {
      content: '';
      position: absolute;
      inset: 4px;
      z-index: 2;
      pointer-events: none;
      border: 1px solid #a6b99a88 !important;
      box-shadow: inset 0 0 0 2px #f8eedc18, 0 0 0 2px #071d1866 !important;
    }

    .cover.hardcover-front.editorial-cover, .back-cover {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--book-cover) !important;
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,.042) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(0deg, rgba(235,231,207,.020) 0 1px, transparent 1px 5px),
        linear-gradient(125deg, rgba(255,255,255,.035), transparent 46%, rgba(0,0,0,.09)) !important;
      border: 1px solid #83998b !important;
      box-shadow: inset 0 0 0 1px #d8c69022, inset 12px 0 17px #081d172e, 3px 3px 0 #0d2922, 5px 5px 0 #476357 !important;
      overflow: hidden;
    }

    .editorial-cover-frame {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: calc(100% - 38px);
      height: calc(100% - 38px);
      margin: 19px;
      padding: 36px 28px 34px;
      border: 1px solid #e4d5a780 !important;
      box-shadow: inset 0 0 0 1px #e4d5a71a !important;
      text-align: center;
      color: #efe6d0;
    }
    .editorial-cover-kicker {
      margin: 0;
      font: 500 11.5px/1.6 'Gowun Batang', serif;
      letter-spacing: .24em;
      color: #e3d6b3;
    }
    .editorial-cover-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .editorial-cover-rule {
      width: 44px;
      height: 1px;
      background: #d5be83;
      margin-bottom: 26px;
    }
    .editorial-cover-title {
      margin: 0 !important;
      font-family: 'Myeongdo Brush', 'Nanum Brush Script', 'Gowun Batang', serif !important;
      font-size: clamp(36px, 3.6vw, 50px) !important;
      font-weight: 700 !important;
      line-height: 1.28 !important;
      letter-spacing: -.03em !important;
      color: var(--book-foil) !important;
      text-shadow: 1px 2px 1px #0b251f, 0 4px 9px #071a1666 !important;
    }
    .editorial-cover-subtitle {
      margin: 20px 0 0 !important;
      font: 400 11.5px/1.75 'Gowun Batang', serif !important;
      letter-spacing: .09em !important;
      color: #eee5ce !important;
    }
    .editorial-cover-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #e6dbc1;
      font: 400 11.5px/1.5 'Gowun Batang', serif;
      letter-spacing: .15em;
    }

    .back-cover {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .back-cover-mark {
      font: 23px/1.5 'Gowun Batang', serif;
      letter-spacing: .22em;
      color: var(--book-foil);
    }
    .back-cover-quote {
      font: 14px/2.2 'Gowun Batang', serif;
      margin: 40px 24px;
      letter-spacing: 1.5px;
      color: #f1ead8;
    }
    .back-cover-title {
      font: 32px/1.4 'Myeongdo Brush', 'Nanum Brush Script', serif;
      color: var(--book-foil);
    }
    .back-cover-author {
      font-size: 10.5px;
      letter-spacing: 3px;
      color: #e7dbc2;
      margin-top: 12px;
    }

    /* ==================== 본문 시 페이지 (1집 편집 구성 + 8pt + 상하좌우 넉넉한 여백) ==================== */
    .eyebrow {
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--accent);
      line-height: 1.7;
      font-family: Arial, sans-serif;
    }

    section.poem {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 46px !important;
    }

    .poem-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #dedbcf;
      padding-bottom: 10px;
      margin-bottom: 16px;
      font-size: 8pt;
      color: #8a8e80;
      letter-spacing: 1px;
    }

    .poem-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 100px;
      gap: 12px;
      align-items: center;
      min-height: 100px;
      margin: 0 0 14px;
      padding: 0 12px;
    }

    .poem-heading h2 {
      font-family: 'Myeongdo Brush', 'Nanum Brush Script', 'Gowun Batang', serif;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.35;
      color: #273c3c;
      margin: 0;
      word-break: keep-all;
    }

    .poem-art {
      display: block;
      width: 100px;
      height: 100px;
      margin: 0;
      background-image: url('../poetry-book/media/poetry-watercolors.png');
      background-size: 500% 400%;
      background-position: var(--art-x) var(--art-y);
      background-repeat: no-repeat;
      border-radius: 4px;
      mix-blend-mode: multiply;
      mask-image: radial-gradient(ellipse at center, #000 55%, #000d 65%, transparent 76%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 55%, #000d 65%, transparent 76%);
    }

    /* 페이지 내 시 글자 크기 8포인트(8pt) & 상하좌우 넉넉한 여백 */
    .verse-box-8pt {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 30px;
      margin: 6px 18px;
      background: rgba(250, 247, 238, 0.38);
      border-radius: 6px;
    }

    .verse {
      white-space: pre-wrap;
      font-family: 'Gowun Batang', 'Batang', 'Noto Serif KR', serif;
      font-size: 8pt !important; /* 정확히 8포인트 고정 */
      line-height: 1.78 !important;
      letter-spacing: 0.01em;
      color: #263c3b;
      word-break: keep-all;
      margin: 0;
    }

    .song, .colophon.editorial, .book-contents, .section-opener {
      max-width: 440px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 14px 44px;
    }

    .song h1, .colophon h2, .book-contents h2, .section-opener h2 {
      font-family: 'Gowun Batang', 'Batang', serif;
      font-size: 23px !important;
      font-weight: 400;
      line-height: 1.38;
      margin: 8px 0 10px !important;
      color: #20343c;
    }

    .colophon.editorial p, .section-note, .song .intro {
      font-size: 8pt !important;
      line-height: 1.72 !important;
      color: #4f5d57;
      margin: 0 0 7px;
      word-break: keep-all;
    }

    .part-link {
      padding: 7px 0;
      border-bottom: 1px solid #e2e4de;
    }
    .part-link button {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: 0;
      padding: 0;
      font-size: 9.5pt;
      font-weight: 700;
      color: #263c3b;
    }
    .part-link button:hover { color: var(--accent); }
    .part-link p {
      font-size: 7.5pt;
      color: #7d8175;
      margin: 2px 0 0;
    }

    .chapter-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5px 14px;
      margin-top: 6px;
    }
    .chapter-list button {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #e4dfd3;
      background: none;
      padding: 3px 0;
      font-size: 7.8pt;
      color: #263c3b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chapter-list button span {
      font: 7pt Georgia, serif;
      color: #92947f;
      flex-shrink: 0;
    }
    .chapter-list button:hover { color: var(--accent); font-weight: 700; }

    .book .page-crescent {
      position: absolute;
      top: 50%;
      z-index: 24;
      transform: translateY(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 38px;
      height: 80px;
      padding: 0;
      border: 1px solid #b8a77d;
      background: linear-gradient(135deg, #efe3bb, #d7c28c);
      color: #493d25;
      font-family: Georgia, serif;
      font-size: 34px;
      line-height: 1;
      box-shadow: 0 3px 9px rgba(29, 34, 30, 0.17);
      cursor: pointer;
      transition: background .2s ease, filter .2s ease;
    }
    .book .crescent-prev {
      left: 0;
      border-left: 0;
      border-radius: 0 90px 90px 0;
      padding-right: 4px;
    }
    .book .crescent-next {
      right: 0;
      border-right: 0;
      border-radius: 90px 0 0 90px;
      padding-left: 4px;
    }
    .book .page-crescent:hover {
      background: #eddaa5;
      filter: brightness(1.04);
    }
    .book .page-crescent[hidden] { display: none !important; }

    .book .page > .page-read-control {
      position: absolute !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 33px !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 32 !important;
      display: flex !important;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .book .page > .page-read-control button {
      pointer-events: auto !important;
      min-height: 30px !important;
      padding: 5px 14px !important;
      background: #e8efe4;
      color: #234b39;
      border: 1px solid #a9bda9;
      border-radius: 22px;
      font-size: 11px !important;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .book .page.cover-page .page-read-control button {
      background: #eee2bb;
      color: #28443b;
      border-color: #d0bb83;
    }

    .turn {
      display: none;
      position: absolute;
      left: 50%;
      top: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 15;
    }
    .turn.active {
      display: block;
      animation: forward .82s ease-in-out forwards;
    }
    .turn.back {
      left: 0;
      transform-origin: right center;
      animation: backward .82s ease-in-out forwards;
    }
    .sheet-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--paper);
      box-shadow: 0 0 1px #b6ae9c, 8px 0 25px #0003;
      overflow: hidden;
    }
    .sheet-front { transform: rotateY(0deg) translateZ(.2px); }
    .sheet-back { transform: rotateY(180deg) translateZ(.2px); }
    @keyframes forward { to { transform: rotateY(-180deg); } }
    @keyframes backward { to { transform: rotateY(180deg); } }

    .book #toc {
      position: absolute;
      z-index: 50;
      left: 50%;
      right: 0;
      top: 0;
      bottom: 0;
      width: 50%;
      height: 100%;
      background: #faf7ee;
      box-shadow: -8px 0 26px #13251c33;
      overflow-y: auto;
      padding: 16px 20px !important;
    }
    .book #toc[hidden] { display: none !important; }
    .toc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .toc-head button { border: 0; background: none; padding: 5px 8px; }
    .book #toc h2 { font: 18px 'Gowun Batang', serif; margin: 10px 0 12px; }
    #toc-list button {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid #e3dfd3;
      padding: 6px 2px;
      font-size: 8.5pt;
    }
    #toc-list button:hover { color: var(--accent); font-weight: 700; }
    #toc-list h3 { margin: 12px 0 3px; font-size: 8.5pt; color: var(--accent); }
    #toc-list button span { color: #96998c; font-size: 7.5pt; }

    #recital-status {
      display: block;
      position: sticky;
      top: 8px;
      z-index: 35;
      margin: 6px auto;
      padding: 7px 16px;
      border-radius: 100px;
      border: 1px solid #c4d3c6;
      background: #eaf1e5;
      color: #214836;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      max-width: 92%;
      cursor: pointer;
    }
    #recital-status[hidden] { display: none !important; }

    /* 제3시집 제2쪽: 영상 없는 여는 시 〈가을〉 */
    .autumn-opening{
      height:100%;min-height:0;width:100%;max-width:440px;margin:0 auto;
      padding:5px 10px 38px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;
      overflow:hidden;gap:0;
    }
    .autumn-opening .eyebrow{font-size:9px;letter-spacing:1.6px;margin-bottom:12px;white-space:nowrap}
    .autumn-heading{display:flex;justify-content:center;align-items:center;gap:8px;}
    .autumn-heading h1{font:normal 29px/1.35 'Myeongdo Brush','Nanum Brush Script','Gowun Batang',serif!important;margin:0!important;letter-spacing:.04em;color:#254c3f}
    .autumn-leaf{font:24px Georgia,serif;color:#b18451}
    .autumn-author{font:11px/1.5 'Gowun Batang',serif;color:#66766b;margin:5px 0 20px;}
    .autumn-poem{font:normal 11.1px/1.57 'Gowun Batang','Batang',serif;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;color:#2d423b;}
    .autumn-end{font:22px/1 Georgia,serif;color:#b49a70;margin-top:15px}
    @media(max-width:720px){
      .autumn-opening{max-width:100%;padding:3px 0 26px}
      .autumn-opening .eyebrow{font-size:7.5px;margin-bottom:9px}
      .autumn-heading h1{font-size:26px!important}
      .autumn-author{margin-bottom:13px;font-size:10px}
      .autumn-poem{font-size:10px;line-height:1.42}
      .autumn-end{margin-top:8px}
    }
    @media(max-height:680px){
      .autumn-heading h1{font-size:24px!important}
      .autumn-opening .eyebrow{margin-bottom:7px}
      .autumn-author{margin-bottom:9px}
      .autumn-poem{font-size:10px;line-height:1.38}
      .autumn-end{margin-top:5px}
    }
  
    /* 제3집 2쪽 · 시화 이미지를 원본 16:9로 보존하고 모든 시구를 한 면에 수록 */
    .autumn-opening{justify-content:center!important;gap:0!important;padding:5px 7px 28px!important;max-width:100%!important;overflow:hidden!important}
    .autumn-opening .eyebrow{margin-bottom:5px!important;font-size:8px!important}
    .autumn-heading h1{font-size:24px!important;line-height:1.1!important}
    .autumn-author{margin:2px 0 7px!important;font-size:10px!important}
    .autumn-picture{display:block;flex:0 0 auto;margin:0 auto 9px!important;width:min(100%,292px);aspect-ratio:16/9;overflow:hidden;border-radius:5px;box-shadow:0 3px 12px rgba(45,58,49,.14);}

다\n봄이면 빨간 영산홍과 노란 개나리가 먼저 꽃을 피우고\n여름이면 초록빛 고추 모종에 하얀 꽃이 달려 열매를 맺는다\n\n아침마다 물뿌리개로 화분마다 시원하게 물을 주면\n잎사귀들이 물방울을 매단 채 반갑게 고개를 끄덕인다\n\n작은 화분 몇 개가 봉덕동 우리 집을\n어린 시절 살던 시골집 마당처럼 푸르고 따뜻하게 만들어 준다", "artX": "100.00%", "artY": "100.00%", "artAlt": "기와지붕 위 보름달과 소나무 숲"}, {"num": "052", "part": 3, "title": "아이들 손잡고 걷던 봉덕동 일요일 아침", "text": "봉덕동에서 가정을 이루고 아이들이 자라나던 시절\n일요일 아침이면 어린 자녀들의 작은 손을 양쪽에 잡고\n동네 골목을 지나 앞산 자락까지 천천히 산책을 나갔다\n아빠, 저 나무 이름은 뭐야 묻는 아이들의 초롱초롱한 눈망울\n\n어릴 적 내가 아버지께 배웠던 풀 이름과 새 이름을\n이제는 내가 아버지가 되어 아이들에게 하나씩 알려 주었다\n\n봉덕동 골목길 보도블록 위에는\n우리 가족이 함께 걸으며 남긴 행복한 발자국들이 겹겹이 쌓여 있다", "artX": "0.00%", "artY": "33.33%", "artAlt": "고목 매화 가지에 머무는 작은 새"}, {"num": "053", "part": 3, "title": "봉덕동 우체부 아저씨의 반가운 오토바이", "text": "골목 밖에서 부릉거리는 빨간 오토바이 소리가 멈추고\n대문 우체통에 편지가 툭 떨어지는 소리가 나면\n맨발로 마당을 가로질러 나가 우체통 덮개를 열었다\n\n고향 시골의 부모님이 보내신 편지와 반가운 친구들의 소식,\n봉투를 뜯기도 전에 글씨만 보아도 반가운 얼굴들이 떠올랐다\n\n인터넷이 없던 그 시절 봉덕동 우체통은\n그리운 사람들과 내 마음을 이어 주던 가장 설레는 창문이었다", "artX": "100.00%", "artY": "100.00%", "artAlt": "기와지붕 위 보름달과 소나무 숲"}, {"num": "054", "part": 3, "title": "비 오는 날 봉덕동 창가에 앉아 듣는 빗소리", "text": "주말 오후 봉덕동에 촉촉한 비가 내리면\n따뜻한 차 한 잔을 타서 들고 창가 의자에 앉는다\n처마 끝에서 떨어지는 빗방울이 화분 잎사귀를 두드리고\n골목길 아스팔트가 빗물에 씻겨 거울처럼 깨끗해진다\n\n빗소리를 가만히 듣고 있으면 어린 시절 소를 몰고 들어와\n시골집 마루에서 듣던 그 빗소리와 조금도 다르지 않다\n\n도시에 살면서도 비 오는 날이면 내 마음은\n언제나 시골 고향집의 평화로운 마루 끝으로 돌아간다", "artX": "0.00%", "artY": "33.33%", "artAlt": "고목 매화 가지에 머무는 작은 새"}, {"num": "055", "part": 3, "title": "봉덕동 단골 이발소의 돌아가는 삼색 등", "text": "봉덕동 골목 모퉁이에는 내가 수십 년째 다니는 이발소가 있다\n문 앞에서 빨강, 파랑, 하얀 줄무늬 등이 빙글빙글 돌아가고\n문을 열면 익숙한 비누 향기와 라디오 소리가 반겨 준다\n\n젊은 청년이었던 내 머리를 깎아 주시던 이발사 아저씨와 나는\n이제 거울 속에서 나란히 하얀 백발이 되어 마주 웃는다\n말하지 않아도 내 머리 모양을 가장 잘 알아주는 고마운 손길\n\n한 동네에서 오래 살아간다는 것은\n이렇게 말없이 서로의 세월을 알아주는 이웃이 생기는 일이다", "artX": "100.00%", "artY": "100.00%", "artAlt": "기와지붕 위 보름달과 소나무 숲"}, {"num": "056", "part": 3, "title": "대명동 옛 학교 앞을 다시 지나며", "text": "볼일이 있어 오랜만에 대명동 옛 고등학교 앞길을 걸었다\n교문 옆 분식집도 문구점도 간판이 새로 바뀌었지만\n학교 담장 너머로 우뚝 솟은 오래된 나무들은 그대로 서 있었다\n\n마침 하교 시간이 되어 교문을 쏟아져 나오는 학생들의 웃음소리\n저 아이들의 반짝이는 눈빛 속에서\n사 , "part": 4, "title": "여름 고산골 나무 그늘 벤치의 시원한 바람", "text": "무더운 여름날 고산골 산책로를 한 바퀴 걷고 내려와\n메타세쿼이아 나무 그늘 아래 벤치에 앉아 땀을 식힌다\n계곡물을 스치고 올라온 시원한 산바람이\n젖은 내 셔츠 깃 속으로 솔솔 불어 들어온다\n\n어릴 적 시골 느티나무 그늘에서 아버지와 함께 맞던 그 바람\n수십 년이 지나 고산골 벤치에서도 똑같이 시원하게 불어온다\n\n나무가 사람에게 아무 대가 없이 내어 주는 넓은 그늘과 바람,\n그 고마운 선물 앞에서 나는 잠시 눈을 감고 미소를 짓는다", "artX": "25.00%", "artY": "66.67%", "artAlt": "굽은 소나무와 안개에 잠긴 앞산 고산골 산길"}, {"num": "078", "part": 4, "title": "흰 눈이 내려 수묵화가 된 겨울 고산골", "text": "간밤에 내린 흰 눈이 고산골의 바위와 나뭇가지를 하얗게 덮었다\n화려하던 가을 단풍이 모두 떨어진 빈 나뭇가지 위에\n하얀 눈꽃이 새로 피어나 겨울만의 깨끗한 아름다움을 보여 준다\n\n아무도 밟지 않은 산책로 눈길 위에 내 운동화 발자국을 찍으며\n뽀드득뽀드득 눈 밟는 소리를 들으며 천천히 걸어간다\n\n검은 나무 기둥과 하얀 눈이 어우러진 겨울 고산골은\n누군가 화선지 위에 정성껏 그려 놓은 한 폭의 동양화 같다", "artX": "25.00%", "artY": "66.67%", "artAlt": "굽은 소나무와 안개에 잠긴 앞산 고산골 산길"}, {"num": "079", "part": 4, "title": "얼음 밑에서 봄을 준비하는 고산골 계곡물", "text": "추운 겨울날 고산골 계곡을 들여다보면 겉은 하얗게 얼어 있지만\n투명한 얼음장 아래에서는 맑은 물이 쉬지 않고 흐르고 있다\n귀를 가까이 대어 보면 졸졸졸, 얼음 밑을 지나는 물소리가\n머지않아 따뜻한 봄이 올 것이라고 속삭여 준다\n\n계곡가 버드나무 가지 끝에도 벌써 작은 봄눈이 맺혀 있다\n\n아무리 추운 겨울 속에서도 자연은 멈추지 않고\n보이지 않는 곳에서 새로운 봄을 부지런히 준비하고 있었다", "artX": "25.00%", "artY": "66.67%", "artAlt": "굽은 소나무와 안개에 잠긴 앞산 고산골 산길"}, {"num": "080", "part": 4, "title": "고산골 산책을 마치고 내려오는 가벼운 발걸음", "text": "고산골 메타세쿼이아 길과 계곡 길을 한 시간쯤 걷고 내려올 때면\n올라갈 때 마음속에 있던 작은 걱정들이 흔적도 없이 사라진다\n맑은 물소리가 내 귀를 깨끗이 씻어 주었고\n초록빛 나무와 꽃들이 내 눈을 시원하게 밝혀 주었다\n\n산책길 입구에서 마주 오르는 이웃들에게 가벼운 목례를 건네며\n다시 봉덕동과 신천 쪽으로 발걸음을 옮긴다\n\n날마다 나를 건강하게 안아 주는 앞산 고산골이 곁에 있어\n나의 하루는 언제나 맑고 든든하게 시작된다", "artX": "25.00%", "artY": "66.67%", "artAlt": "굽은 소나무와 안개에 잠긴 앞산 고산골 산길"}, {"num": "081", "part": 5, "title": "봉덕동에서 걸어 나가는 맑은 신천 산책길", "text": "고산골 숲길을 다녀온 뒤나 해 질 무렵이면\n나는 봉덕동 집에서 가까운 신천 물길로 산책을 나간다\n가창에서 흘러내려와 대구 시내를 가로질러 흐르는 고마운 강\n물가를 따라 잘 다듬어진 산책로에는 사계절 바람이 시원하다\n\n흐르는 강물을 바라보며 천천히 걷다 보면\n어린 시절 소를 몰고 걷던 시골 개울가가 신천 물결 위에 겹쳐진다\n\n도심 한가운데로 이렇게 맑은 물길이 흘러 주니\n신천은 대구 시민들과 내 마음을 적셔 주는 생명의 강이다", "artX": "0.00%", "artY": "66.67%", "artAlt": "신천 물살을 바라보는 왜가리와 강가의 돌"}, {"num": "082", "part": 5, "title": "신천 물 위를 나란히 헤엄치는 오리 가족", "text": "신천 산책로를 걷다가 물가를 내려다보면\n오리 가족이 줄을 지어 사이좋게 물 위를 헤엄쳐 간다\n엄마 오리가 앞에서 물갈퀴를 저으며 길을 열면\n아기 오리들이 뒤처지지 않으려고 조그만 발을 바쁘게 움직인다\n\n가끔 물속으로 머리를 쏙 넣었다가 물방울을 털어 내는 귀여운 모습\n산책하던 아이들도 어른들도 걸음을 멈추고 미소를 짓는다\n\n나란히 물결을 가르며 나아가는 신천의 오리 가족을 보며\n함께 걸어가는 가족의 따뜻함을 다시 한번 느낀다", "artX": "0.00%", "artY": "66.67%", "artAlt": "신천 물살을 바라보는 왜가리와 강가의 돌"}, {"num": "083", "part": 5, "title": "맑은 신천 물속을 헤엄치는 물고기와 큰 잉어", "text": "신천 징검다리 위에 멈춰 서서 흐르는 물속을 들여다보면\n바닥의 조약돌이 다 보일 만큼 맑은 물속에서 물고기들이 논다\n작은 피라미 떼가 햇빛을 받아 은빛으로 반짝이며 지나가고\n그 아래로는 팔뚝보다 큰 잉어들이 유유히 꼬리를 흔들며 헤엄친다\n\n가끔 큰 잉어 한 마리가 수면 위로 철퍼덕 뛰어올라\n둥근 물결을 만들며 산책하는 사람들을 깜짝 놀라게 한다\n\n어릴 적 시골 개울에서 붕어를 잡던 소년은 이제 노인이 되어\n신천의 잉어들이 건강하게 헤엄치는 모습을 흐뭇하게 바라본다", "artX": "50.00%", "artY": "0.00%", "artAlt": "분홍 연꽃과 연잎 아래 은빛 물고기"}, {"num": "084", "part": 5, "title": "신천 여울목에 눈부시게 서 있는 하얀 백로", "text": "신천 물살이 자갈을 만나 하얗게 부서지는 여울목 한가운데\n눈처럼 하얀 백로 한 마리가 긴 다리로 고요히 서 있다\n주변으로 사람들이 걸어가고 자전거가 지나가도\n백로는 조금도 흔들리지 않고 물속의 물고기만 가만히 바라본다\n\n그러다 쏜살같이 부리를 뻗어 작은 물고기를 낚아채고는\n우아하게 긴 목을 들어 올리는 하얀 새\n\n바쁘게 흘러가는 강물 한가운데서 저토록 고요히 서 있는 백로는\n신천이 그려 놓은 가장 깨끗하고 아름다운 그림 한 폭이다", "artX": "0.00%", "artY": "66.67%", "artAlt": "신천 물살을 바라보는 왜가리와 강가의 돌"}, {"num": "085", "part": 5, "title": "큰 날개를 펴고 신천 하늘을 나는 왜가리", "text": "신천 둔치의 바위 위에 조각상처럼 우뚝 서 있던 회색빛 왜가리\n한참 동안 강물을 내려다보며 깊은 생각에 잠겨 있더니\n어느 순간 커다란 두 날개를 활짝 펴고 하늘로 날아오른다\n\n한 번 날개를 저을 때마다 강물 위의 바람이 크게 일렁이고\n왜가리는 다리를 길게 뻗은 채 앞산 쪽 하늘로 유유히 날아간다\n\n기다릴 때는 바위처럼 묵직하고 날아오를 때는 구름처럼 자유로운 왜가리,\n신천 산책길에서 만나는 가장 멋지고 당당한 친구다", "artX": "0.00%", "artY": "66.67%", "artAlt": "신천 물살을 바라보는 왜가리와 강가의 돌"}, {"num": "086", "part": 5, "title": "신천을 건너는 정겨운 돌 징검다리", "text": "신천 이쪽 둔치에서 저쪽 둔치로 건너가는 물길 위에\n네모나고 둥근 돌들이 나란히 놓인 징검다리가 있다\n한 발 한 발 돌을 디디며 강 한가운데로 걸어 들어가면\n발아래에서 흐르는 맑은 물소리가 한결 가깝고 시원하게 들린다\n\n반대편에서 건너오던 이웃과 징검다리 중간에서 마주치면\n서로 웃으며 살짝 비켜 주는 정겨운 풍경\n\n어린 시절 시골 개울의 징검다리를 건너던 그 마음 그대로\n나는 오늘도 신천 징검다리 위에서 동심으로 돌아간다", "artX": "0.00%", "artY": "66.67%", "artAlt": "신천 물살을 바라보는 왜가리와 강가의 돌"}, {"num": "087", "part": 5, "title": "신천 둔치 버드나무와 봄의 노란 개나리", "text": "신천 산책로에도 봄이 오면 가장 먼저     // 4. 시인의 말 (Page 03)
    const editorialHtml = `
      <section class="colophon editorial">
        <div class="eyebrow">POET’S NOTE · 제3시집 시인의 말</div>
        <h2>소 고삐 잡던 손으로<br>고산골과 신천을 걷습니다</h2>
        <p>『${esc(DATA.title)}』는 명도재 이명우의 제3창작 시집(3집)으로, 어린 시절부터 오늘의 산책길까지 삶의 이야기를 누구나 읽기 쉬운 맑은 우리말로 엮은 백 편의 시집입니다.</p>
        <p>시골에서 부모님 농사일을 돕고 소 끌고 풀 찾아다니던 기억, 국민학교 운동장에서 소꿉놀이와 축구·고무줄놀이를 하고 가을 운동회 달리기 일등을 하던 날, 대명동 고교 시절과 대학 졸업 후 정든 봉덕동 생활을 담았습니다.</p>
        <p>지금도 날마다 걷는 고산골 메타세쿼이아 길의 꽃과 매미 소리, 계곡 물소리와 바위 이끼, 앞산 안개와 신천의 오리·잉어·백로·왜가리가 독자 여러분의 마음에도 시원한 산책길이 되기를 바랍니다.</p>
      </section>`;

    const tocButton = (title, page) => `<button type="button" data-page="${page}">${esc(title)}<span>${String(page + 1).padStart(2, '0')}</span></button>`;

    for (const sec of DATA.sections) {
      const secPoems = DATA.poems.filter(p => p.part === sec.num);
      sec.page = pages.length;
      pages.push('');
      pageMeta.push({ type: 'section', sectionNum: sec.num });
      tocEntries.push({ title: `제${sec.num}부 ${sec.title}`, page: sec.page, heading: true });
      sec.entries = [];

      for (const p of secPoems) {
        const pPage = pages.length;
        const entry = { title: `${p.num}. ${p.title}`, page: pPage };
        tocEntries.push(entry);
        sec.entries.push(entry);

        const header = `<div class="poem-header"><span>제${sec.num}부 · ${esc(sec.title)}</span><span>${p.num} / 100</span></div>`;
        const heading = `
          <div class="poem-heading">
            <h2>${esc(p.title)}</h2>
            <figure class="poem-art" role="img" aria-label="시화 삽화: ${esc(p.artAlt)}" style="--art-x:${p.artX};--art-y:${p.artY}"></figure>
          </div>`;
        const body = `
          <section class="poem" data-poem-num="${p.num}">
            <div>
              ${header}
              ${heading}
            </div>
            <div class="verse-box-8pt">
              <p class="verse">${esc(p.text)}</p>
            </div>
          </section>`;
        pages.push(body);
        pageMeta.push({ type: 'poem', poem: p });
      }

      pages[sec.page] = `
        <section class="section-opener">
          <div class="eyebrow">PART ${String(sec.num).padStart(2, '0')} · ${secPoems.length}편</div>
          <h2>제${sec.num}부 · ${esc(sec.title)}</h2>
          <p class="section-subtitle" style="font-size:8.5pt;color:#637065;margin:2px 0 4px;">${esc(sec.subtitle)}</p>
          <p class="section-note">${esc(sec.intro)}</p>
          <div class="chapter-list">
            ${sec.entries.map(e => tocButton(e.title, e.page)).join('')}
          </div>
        </section>`;
    }

    pages[3] = `
      <section class="book-contents">
        <div class="eyebrow">CONTENTS · 제3시집 차례</div>
        <h2>다섯 갈래의 길</h2>
        <p style="font-size:8pt;color:#69746d;margin:0 0 8px;">명도재 이명우 제3시집 · 전 100편</p>
        ${DATA.sections.map(sec => `
          <div class="part-link">
            ${tocButton(`제${sec.num}부 ${sec.title}`, sec.page)}
            <p>${esc(sec.subtitle)} · 20편</p>
          </div>
        `).join('')}
      </section>`;

    const colophonPage = pages.length;
    tocEntries.push({ title: '책을 덮으며 · 판권', page: colophonPage });
    pages.push(`
      <section class="colophon editorial">
        <div class="eyebrow">COLOPHON · 책을 덮으며</div>
        <h2>시골 하늘에서 신천 물길까지,<br>그게 백 편이다.</h2>
        <p><strong>명도재 이명우 제3창작 시집 『${esc(DATA.title)}』</strong><br><small>${esc(DATA.subtitle)}</small></p>
        <p>수록 작품 · 이명우 창작시 100편 (제1부~제5부)<br>여는 시 · 「가을」<br>편집 구성 · 1집 『물빛에 놓아둔 마음』 정통 시화집 판형 계승<br>조판 규격 · 본문 8포인트(8pt) 및 상하좌우 여백 판형</p>
        <p style="font-size:7.5pt;color:#788173;border-top:1px solid #e2e4de;padding-top:8px;">2026년 늦가을, 봉덕동 명도재(明道齋)에서 엮음.</p>
      </section>`);
    pageMeta.push({ type: 'colophon' });

    if (pages.length % 2 === 0) {
      pages.push(`<section class="colophon editorial" style="text-align:center;"><div class="eyebrow">明道齋 · 第3詩集</div><h2>당신의 오늘 산책길에도<br>맑은 시 한 편이 함께하기를.</h2></section>`);
      pageMeta.push({ type: 'closing' });
    }

    tocEntries.push({ title: '뒷표지', page: pages.length });
    pages.push(backCoverHtml);
    pageMeta.push({ type: 'back-cover' });

    $('#toc-list').innerHTML = tocEntries.map(e => e.heading ? `<h3>${tocButton(e.title, e.page)}</h3>` : tocButton(e.title, e.page)).join('');

    let soundEnabled = true, audioContext = null;
    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        const AudioEngine = window.AudioContext || window.webkitAudioContext;
        if (!AudioEngine) return;
        audioContext ??= new AudioEngine();
        const play = () => {
          if (!soundEnabled || audioContext.state !== 'running') return;
          const now = audioContext.currentTime;
          const tap = audioContext.createOscillator(), tapGain = audioContext.createGain();
          tap.type = 'triangle';
          tap.frequency.setValueAtTime(1050, now);
          tap.frequency.exponentialRampToValueAtTime(380, now + .025);
          tapGain.gain.setValueAtTime(.0001, now);
          tapGain.gain.exponentialRampToValueAtTime(.07, now + .002);
          tapGain.gain.exponentialRampToValueAtTime(.0001, now + .035);
          tap.connect(tapGain); tapGain.connect(audioContext.destination);
          tap.start(now); tap.stop(now + .04);
          const duration = .55, buffer = audioContext.createBuffer(1, Math.ceil(audioContext.sampleRate * duration), audioContext.sampleRate), data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (.7 + .3 * Math.sin(i / audioContext.sampleRate * 90));
          const paper = audioContext.createBufferSource(), filter = audioContext.createBiquadFilter(), gain = audioContext.createGain();
          paper.buffer = buffer; filter.type = 'bandpass'; filter.Q.value = .65;
          filter.frequency.setValueAtTime(1100, now + .04);
          filter.frequency.exponentialRampToValueAtTime(2900, now + .24);
          filter.frequency.exponentialRampToValueAtTime(850, now + .58);
          gain.gain.setValueAtTime(.0001, now);
          gain.gain.exponentialRampToValueAtTime(.13, now + .14);
          gain.gain.exponentialRampToValueAtTime(.0001, now + .58);
          paper.connect(filter); filter.connect(gain); gain.connect(audioContext.destination);
          paper.start(now + .04); paper.stop(now + .59);
        };
        if (audioContext.state === 'suspended') audioContext.resume().then(play).catch(() => {});
        else play();
      } catch (e) {}
    }

    function togglePageSound() {
      soundEnabled = !soundEnabled;
      const btn = $('#btn-sound');
      btn.classList.toggle('active', soundEnabled);
      btn.textContent = soundEnabled ? '🔊 책장 소리' : '🔇 소리 끔';
    }

    function setPaperContent(paper, html, number) {
      paper.innerHTML = html || '';
      paper.dataset.number = String(number + 1).padStart(2, '0');
      const meta = pageMeta[number] || {};
      paper.classList.toggle('cover-page', meta.type === 'cover' || meta.type === 'back-cover');
      paper.classList.toggle('back-cover-page', meta.type === 'back-cover');
      paper.classList.toggle('section-leaf', meta.type === 'section');

      if (html) {
        const control = document.createElement('div');
        control.className = 'page-read-control';
        control.innerHTML = `<button type="button" data-page-read="${number}" aria-label="이 페이지 읽어주기">▶ 이 페이지 읽기</button>`;
        paper.append(control);
      }
    }

    function render() {
      for (const [i, side] of ['left', 'right'].entries()) {
        const el = $('#' + side), n = position + i;
        setPaperContent(el, pages[n], n);
        el.classList.toggle('mobile-hidden', mobile.matches && i === 1);
      }
      $('#edge-prev').hidden = position === 0;
      $('#edge-next').hidden = position + step() >= pages.length;
      updateRecitalStatus();
    }

    function go(target) {
      if (!pages.length) return;
      target = Math.max(0, Math.min(pages.length - step(), target));
      if (!mobile.matches) target -= target % 2;
      if (busy || target === position) return;
      if (currentSpeech !== null) stopRecital();
      busy = true;
      playPageTurnSound();
      document.querySelectorAll('video,audio').forEach(v => v.pause());

      const backward = target < position, turn = $('#turn');
      const source = $(mobile.matches ? '#left' : backward ? '#left' : '#right');
      const makeFace = (html, number, side) => {
        const face = document.createElement('div');
        face.className = `sheet-face sheet-${side}`;
        const paper = document.createElement('div');
        paper.className = 'page';
        setPaperContent(paper, html, number);
        face.classList.toggle('cover-sheet', paper.classList.contains('cover-page'));
        paper.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
        paper.querySelectorAll('video,audio').forEach(v => { v.removeAttribute('controls'); v.preload = 'none'; });
        face.append(paper);
        return face;
      };

      const front = makeFace(source.innerHTML, Number(source.dataset.number) - 1, 'front');
      const reverseIndex = mobile.matches ? target : backward ? target + 1 : target;
      const back = makeFace(pages[reverseIndex], reverseIndex, 'back');
      turn.replaceChildren(front, back);

      const under = $(mobile.matches ? '#left' : backward ? '#left' : '#right');
      const underIndex = mobile.matches ? target : backward ? target : target + 1;
      setPaperContent(under, pages[underIndex], underIndex);

      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        clearTimeout(fallback);
        turn.removeEventListener('animationend', onEnd);
        turn.className = 'turn';
        turn.replaceChildren();
        position = target;
        render();
        busy = false;
      };
      const onEnd = e => { if (e.target === turn) finish(); };
      const fallback = setTimeout(finish, 950);
      turn.addEventListener('animationend', onEnd);      turn.className = `turn active${backward ? ' back' : ''}`;
    }

    $('#edge-prev').addEventListener('click', () => go(position - step()));
    $('#edge-next').addEventListener('click', () => go(position + step()));

    function toggleToc(open) {
      $('#toc').hidden = !open;
      $('#contents').setAttribute('aria-expanded', String(open));
    }
    $('#contents').onclick = () => toggleToc($('#toc').hidden);
    $('#close').onclick = () => toggleToc(false);

    let currentSpeech = null, recitalToken = 0, recitalPaused = false;

    function stopRecital() {
      recitalToken++;
      recitalPaused = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentSpeech = null;
      updateRecitalStatus();
    }

    function updateRecitalStatus() {
      const status = $('#recital-status');
      if (status) {
        status.hidden = !currentSpeech;
        status.textContent = recitalPaused
          ? '⏸ 시낭송 일시정지 · 화면을 누르면 이어 읽기'
          : '🔊 시낭송 중 · 화면을 누르면 일시정지';
      }
      document.querySelectorAll('[data-page-read]').forEach(b => {
        if ('page-' + b.dataset.pageRead === currentSpeech) {
          b.textContent = recitalPaused ? '▶ 이어 읽기' : '⏸ 일시정지';
          b.setAttribute('aria-pressed', 'true');
        } else {
          b.textContent = '▶ 이 페이지 읽기';
          b.setAttribute('aria-pressed', 'false');
        }
      });
    }

    function startRecital(pageIndex, onCompleteCallback = null) {
      const id = 'page-' + pageIndex;
      if (currentSpeech === id && !onCompleteCallback) {
        stopRecital();
        return;
      }
      stopRecital();
      const token = ++recitalToken;
      currentSpeech = id;
      updateRecitalStatus();
      speakPageByTts(pageIndex, token, onCompleteCallback);
    }

    function speakPageByTts(pageIndex, token, onCompleteCallback) {
      if (!('speechSynthesis' in window)) {
        stopRecital();
        if (onCompleteCallback) onCompleteCallback();
        return;
      }
      const host = document.querySelector(`.page[data-number="${String(pageIndex + 1).padStart(2, '0')}"]`);
      if (!host) { stopRecital(); return; }
      const section = host.querySelector('section');
      if (!section) { stopRecital(); return; }
      const copy = section.cloneNode(true);
      copy.querySelectorAll('button,.page-read-control,.poem-header,video,audio,.video-input-bar,.chapter-list,.eyebrow').forEach(el => el.remove());
      const lines = (copy.textContent || '').split(/\n+/).map(t => t.trim()).filter(Boolean);
      if (!lines.length) { stopRecital(); return; }

      let idx = 0;
      const next = () => {
        if (token !== recitalToken) return;
        if (idx >= lines.length) {
          stopRecital();
          if (onCompleteCallback) onCompleteCallback();
          return;
        }
        const u = new SpeechSynthesisUtterance(lines[idx++]);
        u.lang = 'ko-KR';
        u.rate = 0.88;
        u.pitch = 1.04;
        u.onend = next;
        u.onerror = () => { if (token === recitalToken) stopRecital(); };
        window.speechSynthesis.speak(u);
      };
      next();
    }

    document.addEventListener('click', e => {
      const readBtn = e.target.closest('[data-page-read]');
      if (readBtn) {
        e.preventDefault();
        e.stopPropagation();
        startRecital(Number(readBtn.dataset.pageRead));
        return;
      }
      if (e.target.id === 'recital-status') {
        stopRecital();
        return;
      }
    });

    const navigate = e => {
      const button = e.target.closest('[data-page]');
      if (button) {
        e.preventDefault();
        e.stopPropagation();
        if (!$('#toc').hidden) toggleToc(false);
        go(Number(button.dataset.page));
      }
    };
    $('#toc-list').onclick = navigate;

    $('#book').onclick = e => {
      if (e.target.closest('[data-page]')) { navigate(e); return; }
      if (busy || !$('#toc').hidden) return;
      if (e.target.closest('a,button,video,audio,input,select,label') || window.getSelection()?.toString()) return;
      const page = e.target.closest('#left,#right');
      if (!page) return;
      const rect = page.getBoundingClientRect();
      const backward = mobile.matches ? e.clientX < rect.left + rect.width / 2 : page.id === 'left';
      go(position + (backward ? -step() : step()));
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') toggleToc(false);
      if (!$('#toc').hidden || /INPUT|SELECT|VIDEO/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); go(position + step()); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(position - step()); }
    });
    let synthTimer = null;
    function toggleBgm() {
      const btn = $('#btn-bgm');
      if (synthTimer) {
        clearInterval(synthTimer);
        synthTimer = null;
        btn.classList.remove('active');
        return;
      }
      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      audioContext ??= new AudioEngine();
      if (audioContext.state === 'suspended') audioContext.resume();
      const notes = [293.66, 329.63, 392.00, 440.00, 523.25];
      let s = 0;
      const pluck = () => {
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.frequency.value = notes[s++ % notes.length];
        g.gain.setValueAtTime(0.001, audioContext.currentTime);
        g.gain.linearRampToValueAtTime(0.035, audioContext.currentTime + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0008, audioContext.currentTime + 1.3);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + 1.35);
      };
      pluck();
      synthTimer = setInterval(pluck, 850);
      btn.classList.add('active');
    }

    function fitBookToScreen() {
      const frame = $('.book-frame'), header = $('header');
      if (!frame || !header) return;
      const natural = 720;
      const top = frame.getBoundingClientRect().top;
      const reserve = 22;
      const available = Math.max(260, window.innerHeight - top - reserve);
      const scale = Math.min(0.92, available / natural);
      document.documentElement.style.setProperty('--book-viewport-scale', String(scale));
    }
    addEventListener('resize', fitBookToScreen, { passive: true });
    fitBookToScreen();

    render();
  </script>
</body>
</html>
